lesson: k10-passwords-and-personal-information
updated: 2026-11-14
questions:
  - id: q1
    prompt: "Why should you not use the same password for many accounts?"
    options:
      - text: Because it is hard to remember.
        correct: false
        why: One shared password is actually easier to remember. The problem is the risk.
      - text: Because if one site leaks it, criminals try that password on your other accounts.
        correct: true
        why: Correct. With one shared password, you can lose many accounts at once.
      - text: Because the law forbids sharing passwords.
        correct: false
        why: The reason here is safety, not a specific law.
  - id: q2
    prompt: "Someone calls, says they are from your bank, and asks for your one-time code to \"unlock your account\". What do you do?"
    options:
      - text: Read out the code, because they know your name.
        correct: false
        why: Scammers may know your name. Nobody has a genuine reason to ask for your one-time code.
      - text: Do not give the code; hang up and call the number on your card or in the bank's app.
        correct: true
        why: Correct. Never give a one-time code to anyone, and contact the bank through its official channel.
      - text: Give the code, then change your password later.
        correct: false
        why: With the code, a criminal can move your money at once.
  - id: q3
    prompt: "An online employer asks for photos of both sides of your ID card and a deposit for a uniform. What do you think?"
    options:
      - text: It's normal; everywhere does this.
        correct: false
        why: Asking for ID and a deposit by message is a warning sign.
      - text: It's suspicious; check the employer before sending anything.
        correct: true
        why: Correct. Send documents only to employers you have checked.
      - text: Send the ID photos, but not the money.
        correct: false
        why: ID photos can also be used to open accounts in your name.
  - id: q4
    prompt: "At the end of your shift at the till, what should you do with your sales software account?"
    options:
      - text: Leave it signed in for the next shift.
        correct: false
        why: The next person would be working under your name. If something goes wrong, nobody can tell who did it.
      - text: Sign out of your account.
        correct: true
        why: Correct. Signing out means each person works only under their own account.
      - text: Stick the password on the screen so the next shift can sign in.
        correct: false
        why: A password on display lets anyone use your account.
