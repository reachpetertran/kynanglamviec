lesson: k8-thiet-ke-quyen-quyet-dinh
updated: 2026-11-14
questions:
  - id: q1
    prompt: "Bảng quyền ghi: giám đốc tài chính và giám đốc kinh doanh cùng quyết hạn mức công nợ cho khách. Vấn đề là gì?"
    options:
      - text: Không có vấn đề, hai người quyết thì chắc hơn.
        correct: false
        why: Hai người cùng quyết thì dễ chờ nhau, hoặc không ai chịu trách nhiệm khi sai.
      - text: Có hai người quyết. Nên chọn một người quyết, người kia được hỏi ý kiến.
        correct: true
        why: Đúng. Mỗi quyết định chỉ một người quyết. Người kia vẫn được nghe trước khi chốt.
      - text: Nên đẩy lên tổng giám đốc quyết cho rõ.
        correct: false
        why: Dồn lên trên là một dấu hiệu nghẽn. Quyết định nên ở gần thông tin.
  - id: q2
    prompt: "Mỗi tuần, tổng giám đốc nhận 20 hồ sơ mua vật tư nhỏ để duyệt. Đây là dấu hiệu gì?"
    options:
      - text: Tổng giám đốc rất sát sao, nên giữ.
        correct: false
        why: Sát sao việc nhỏ làm mất thời gian cho việc cấp tổ chức.
      - text: Dấu hiệu dồn lên trên. Nên đặt ngưỡng và chuyển quyền xuống.
        correct: true
        why: Đúng. Việc thường ngày cứ lên ban điều hành là cơ cấu đang gây nghẽn.
      - text: Dấu hiệu nhân viên mua hàng làm chưa tốt.
        correct: false
        why: Chưa có bằng chứng về người. Trước hết hãy xem bảng quyền có cho họ quyết không.
  - id: q3
    prompt: "Phòng pháp chế được hỏi ý kiến cho mọi hợp đồng, nhưng thường trả lời sau 2 tuần. Sửa thế nào?"
    options:
      - text: Bỏ bước hỏi pháp chế để làm nhanh hơn.
        correct: false
        why: Pháp chế có chuyên môn cần thiết. Bỏ bước này tăng rủi ro pháp lý.
      - text: "Đặt hạn trả lời, và có thể chia ngưỡng: hợp đồng mẫu không cần hỏi, hợp đồng lớn thì hỏi."
        correct: true
        why: Đúng. Hỏi ý kiến cần có hạn. Ngưỡng giúp pháp chế tập trung vào việc rủi ro.
      - text: Chuyển quyền quyết hợp đồng sang pháp chế.
        correct: false
        why: Pháp chế góp ý về pháp lý. Quyết kinh doanh vẫn nên thuộc người chịu kết quả.
  - id: q4
    prompt: "Bạn muốn đặt ngưỡng: giám đốc nhà máy được quyết mua máy đến một mức tiền. Cần đối chiếu gì?"
    options:
      - text: Ngưỡng của các công ty khác cùng ngành.
        correct: false
        why: Có thể tham khảo, nhưng chưa đủ. Mỗi tổ chức có điều lệ và quy chế riêng.
      - text: Điều lệ và quy chế nội bộ của tổ chức về thẩm quyền.
        correct: true
        why: Đúng. Bảng quyền phải nằm trong thẩm quyền mà điều lệ và quy chế cho phép.
      - text: Không cần đối chiếu, tổng giám đốc tự đặt là được.
        correct: false
        why: Thẩm quyền của người quản lý có giới hạn theo điều lệ. Vượt giới hạn là rủi ro.
