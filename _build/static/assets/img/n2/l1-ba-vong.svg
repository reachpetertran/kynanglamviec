<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Ba vòng tròn giao nhau: điều mình thích làm, điều mình làm được có bằng chứng, điều kiện thật của mình. Phần giao ở giữa là hướng để thử."><title>Ba vòng tròn giao nhau: điều mình thích làm, điều mình làm được có bằng chứng, điều kiện thật của mình. Phần giao ở giữa là hướng để thử.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="34" font-size="20" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ba vòng để chọn hướng thử</text><circle cx="250" cy="170" r="105" fill="#d98a1c" fill-opacity=".22" stroke="#d98a1c" stroke-width="2"/><circle cx="390" cy="170" r="105" fill="#1f7a74" fill-opacity=".2" stroke="#1f7a74" stroke-width="2"/><circle cx="320" cy="280" r="105" fill="#2563a8" fill-opacity=".16" stroke="#2563a8" stroke-width="2"/><text x="215" y="112" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Mình thích làm</text><text x="215" y="130" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">việc gì?</text><text x="212" y="152" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Làm lâu</text><text x="212" y="168" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">không thấy chán</text><text x="425" y="112" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Mình làm được</text><text x="425" y="130" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">việc gì?</text><text x="428" y="152" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Có bằng chứng:</text><text x="428" y="168" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">sản phẩm, điểm số</text><text x="320" y="325" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Điều kiện thật</text><text x="320" y="345" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Thời gian, đi lại, chi phí,</text><text x="320" y="361" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">nơi đang cần người</text><circle cx="320" cy="210" r="34" fill="#fff" stroke="#14524f" stroke-width="2.5"/><text x="320" y="206" font-size="13" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hướng</text><text x="320" y="222" font-size="13" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">để thử</text></svg>