<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Một trang sổ quy trình viết tay: tên việc pha trà đào cam sả, các bước đánh số, ô lỗi hay gặp, và ba ô ôn lại sau 1 ngày, 3 ngày, 7 ngày, đã đánh dấu hai ô."><title>Một trang sổ quy trình viết tay: tên việc pha trà đào cam sả, các bước đánh số, ô lỗi hay gặp, và ba ô ôn lại sau 1 ngày, 3 ngày, 7 ngày, đã đánh dấu hai ô.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><rect x="120" y="20" width="400" height="360" rx="8" fill="#fffdf6" stroke="#d8cfae" stroke-width="1.5"/><path d="M140,78 L500,78" stroke="#e9e1c7"/><path d="M140,100 L500,100" stroke="#e9e1c7"/><path d="M140,122 L500,122" stroke="#e9e1c7"/><path d="M140,144 L500,144" stroke="#e9e1c7"/><path d="M140,166 L500,166" stroke="#e9e1c7"/><path d="M140,188 L500,188" stroke="#e9e1c7"/><path d="M140,210 L500,210" stroke="#e9e1c7"/><path d="M140,232 L500,232" stroke="#e9e1c7"/><path d="M140,254 L500,254" stroke="#e9e1c7"/><path d="M140,276 L500,276" stroke="#e9e1c7"/><path d="M140,298 L500,298" stroke="#e9e1c7"/><path d="M140,320 L500,320" stroke="#e9e1c7"/><path d="M140,342 L500,342" stroke="#e9e1c7"/><path d="M140,364 L500,364" stroke="#e9e1c7"/><path d="M170,20 L170,380" stroke="#e7b3a9" stroke-width="1.5"/><text x="184" y="54" font-size="15" fill="#14524f" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Quy trình: Pha trà đào cam sả (giả định)</text><text x="184" y="96" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1. Rửa tay, lấy ly size M</text><text x="184" y="118" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2. Cho 30 ml syrup đào</text><text x="184" y="140" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3. Thêm trà đến vạch 2</text><text x="184" y="162" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">4. Cho đá đến vạch 3, lắc 10 lần</text><text x="184" y="184" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">5. Thêm đào miếng, cam, sả</text><text x="184" y="206" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">6. Đóng nắp, dán tem giờ</text><rect x="184" y="236" width="300" height="64" rx="8" fill="#fbe9e7" stroke="#b03a2e" stroke-width="1.5"/><text x="196" y="256" font-size="13" fill="#b03a2e" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Lỗi hay gặp</text><text x="196" y="276" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Quên lắc → trà nhạt phía dưới</text><text x="196" y="294" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Đá trước syrup → syrup không tan</text><text x="184" y="330" font-size="13" fill="#14524f" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ôn không nhìn sổ:</text><rect x="312" y="316" width="18" height="18" rx="3" fill="#fff" stroke="#14524f" stroke-width="2"/><path d="M315,325 l5,5 l8,-10" fill="none" stroke="#1e7d4f" stroke-width="3"/><text x="336" y="330" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1 ngày</text><rect x="378" y="316" width="18" height="18" rx="3" fill="#fff" stroke="#14524f" stroke-width="2"/><path d="M381,325 l5,5 l8,-10" fill="none" stroke="#1e7d4f" stroke-width="3"/><text x="402" y="330" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3 ngày</text><rect x="444" y="316" width="18" height="18" rx="3" fill="#fff" stroke="#14524f" stroke-width="2"/><text x="468" y="330" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">7 ngày</text></svg>