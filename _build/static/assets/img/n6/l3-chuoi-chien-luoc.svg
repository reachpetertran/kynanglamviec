<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Một ưu tiên chiến lược được chia cho ba khối, giả định. Ưu tiên: giao hàng nội thành dưới 24 giờ trước tháng 6. Khối kho: soạn hàng xong trong 4 giờ. Khối vận tải: 95% chuyến đúng giờ. Khối công nghệ: đơn tự chuyển từ web sang kho. Hai mũi tên phụ thuộc: kho cần công nghệ, vận tải cần kho. Mỗi chỗ phụ thuộc có một người điều phối."><title>Một ưu tiên chiến lược được chia cho ba khối, giả định. Ưu tiên: giao hàng nội thành dưới 24 giờ trước tháng 6. Khối kho: soạn hàng xong trong 4 giờ. Khối vận tải: 95% chuyến đúng giờ. Khối công nghệ: đơn tự chuyển từ web sang kho. Hai mũi tên phụ thuộc: kho cần công nghệ, vận tải cần kho. Mỗi chỗ phụ thuộc có một người điều phối.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Một ưu tiên, ba khối, hai chỗ phụ thuộc</text><rect x="110" y="50" width="420" height="60" rx="12" fill="#e8f0fa" stroke="#2563a8" stroke-width="2"/><text x="320" y="74" font-size="13" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ưu tiên</text><text x="320" y="96" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Giao hàng nội thành dưới 24 giờ trước tháng 6</text><line x1="320" y1="110" x2="112" y2="168" stroke="#1f7a74" stroke-width="2"/><circle cx="112" cy="168" r="4.5" fill="#1f7a74"/><rect x="24" y="172" width="176" height="82" rx="12" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="112" y="200" font-size="15" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Kho</text><text x="112" y="228" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Soạn hàng xong trong 4 giờ</text><line x1="320" y1="110" x2="320" y2="168" stroke="#1f7a74" stroke-width="2"/><circle cx="320" cy="168" r="4.5" fill="#1f7a74"/><rect x="232" y="172" width="176" height="82" rx="12" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="320" y="200" font-size="15" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Vận tải</text><text x="320" y="228" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">95% chuyến đúng giờ</text><line x1="320" y1="110" x2="528" y2="168" stroke="#1f7a74" stroke-width="2"/><circle cx="528" cy="168" r="4.5" fill="#1f7a74"/><rect x="440" y="172" width="176" height="82" rx="12" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="528" y="200" font-size="15" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Công nghệ</text><text x="528" y="228" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Đơn tự chuyển web → kho</text><path d="M 528 256 C 480 330, 160 330, 112 256" fill="none" stroke="#b03a2e" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="112" cy="256" r="5" fill="#b03a2e"/><circle cx="320" cy="311" r="12" fill="#b03a2e"/><text x="320" y="316" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1</text><path d="M 112 256 C 140 286, 290 286, 320 256" fill="none" stroke="#d98a1c" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="320" cy="256" r="5" fill="#d98a1c"/><circle cx="216" cy="278" r="12" fill="#d98a1c"/><text x="216" y="283" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2</text><rect x="24" y="330" width="592" height="62" rx="10" fill="#fdf3e2" stroke="#d98a1c" stroke-width="1.5"/><text x="320" y="350" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Chỗ phụ thuộc: (1) Kho cần Công nghệ · (2) Vận tải cần Kho</text><text x="320" y="368" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Mỗi chỗ phụ thuộc có một người điều phối có tên</text><text x="320" y="385" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Rà soát tháng: tiếp tục · đổi cách làm · dừng</text></svg>