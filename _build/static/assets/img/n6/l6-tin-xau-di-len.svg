<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Đường đi của tin xấu, giả định. Bên trái: tin từ tuyến đầu đi qua tổ trưởng, trưởng phòng, giám đốc khối; mỗi cấp lọc bớt, đến ban điều hành chỉ còn câu mọi thứ ổn. Bên phải: có Kênh tin xấu; tin về an toàn, khách lớn, pháp lý, tài chính lên ban điều hành trong 48 giờ, kèm đường báo vượt cấp."><title>Đường đi của tin xấu, giả định. Bên trái: tin từ tuyến đầu đi qua tổ trưởng, trưởng phòng, giám đốc khối; mỗi cấp lọc bớt, đến ban điều hành chỉ còn câu mọi thứ ổn. Bên phải: có Kênh tin xấu; tin về an toàn, khách lớn, pháp lý, tài chính lên ban điều hành trong 48 giờ, kèm đường báo vượt cấp.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Đường đi của tin xấu</text><text x="164" y="60" font-size="15" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Không có kênh</text><rect x="64" y="72" width="200" height="38" rx="10" fill="#fbe9e7" stroke="#b03a2e" stroke-width="1.5"/><text x="164" y="96" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ban điều hành</text><rect x="64" y="124" width="200" height="38" rx="10" fill="#fff" stroke="#b03a2e" stroke-width="1.5"/><text x="164" y="148" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Giám đốc khối</text><rect x="64" y="176" width="200" height="38" rx="10" fill="#fff" stroke="#b03a2e" stroke-width="1.5"/><text x="164" y="200" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Trưởn