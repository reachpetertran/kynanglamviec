ial,sans-serif">An toàn, khách lớn, pháp lý, tài chính</text><text x="476" y="362" font-size="12" fill="#1e7d4f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">lên trong 48 giờ · có đường vượt cấp</text></svg>