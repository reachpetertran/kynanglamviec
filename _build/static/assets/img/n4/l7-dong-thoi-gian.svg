<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Dòng thời gian của Nghị định 283/2026/NĐ-CP. Ngày 15/7/2026: Chính phủ ký ban hành. Ngày 10/9/2026: có hiệu lực, Nghị định 12/2022/NĐ-CP hết hiệu lực. Hành vi đã xảy ra và kết thúc trước 10/9/2026 thì áp dụng văn bản có hiệu lực lúc đó. Hành vi vẫn đang diễn ra sau 10/9/2026 thì áp dụng Nghị định 283."><title>Dòng thời gian của Nghị định 283/2026/NĐ-CP. Ngày 15/7/2026: Chính phủ ký ban hành. Ngày 10/9/2026: có hiệu lực, Nghị định 12/2022/NĐ-CP hết hiệu lực. Hành vi đã xảy ra và kết thúc trước 10/9/2026 thì áp dụng văn bản có hiệu lực lúc đó. Hành vi vẫn đang diễn ra sau 10/9/2026 thì áp dụng Nghị định 283.</title><rect width="640" height="400" rx="18" fill="#f4f8f8"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ba mốc khi đọc một văn bản mới</text><text x="320" y="52" font-size="13" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ví dụ thật: Nghị định 283/2026/NĐ-CP (Điều 66, 67)</text><line x1="40" y1="160" x2="600" y2="160" stroke="#14524f" stroke-width="4"/><rect x="40" y="148" width="300" height="24" rx="4" fill="#5b6b73" fill-opacity=".25"/><rect x="340" y="148" width="260" height="24" rx="4" fill="#1f7a74" fill-opacity=".3"/><text x="190" y="140" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Nghị định 12/2022 còn áp dụng</text><text x="470" y="140" font-size="12.5" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Nghị định 283/2026 áp dụng</text><circle cx="120" cy="160" r="10" fill="#2563a8"/><text x="120" y="198" font-size="15" fill="#2563a8" text-anchor="middle" font-weight="8