<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Ba hướng làm mới nghề, giả định, cho một kỹ sư chất lượng 8 năm kinh nghiệm. Hướng sâu hơn: chuyên gia hệ thống quản lý chất lượng. Hướng rộng hơn: nhận dự án cải tiến liên phòng ban và kèm cặp kỹ sư mới. Hướng chuyển: sang đánh giá viên cho tổ chức chứng nhận. Ở giữa là các kỹ năng mang theo được."><title>Ba hướng làm mới nghề, giả định, cho một kỹ sư chất lượng 8 năm kinh nghiệm. Hướng sâu hơn: chuyên gia hệ thống quản lý chất lượng. Hướng rộng hơn: nhận dự án cải tiến liên phòng ban và kèm cặp kỹ sư mới. Hướng chuyển: sang đánh giá viên cho tổ chức chứng nhận. Ở giữa là các kỹ năng mang theo được.</title><rect width="640" height="400" rx="18" fill="#fdf8ef"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ba hướng làm mới nghề</text><circle cx="320" cy="215" r="80" fill="#14524f"/><text x="320" y="178" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Kỹ năng</text><text x="320" y="195" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">mang theo được</text><text x="320" y="222" font-size="11" fill="#e3f0ee" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">hệ thống · quyết định</text><text x="320" y="237" font-size="11" fill="#e3f0ee" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">thuyết phục · kèm cặp</text><text x="320" y="252" font-size="11" fill="#e3f0ee" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">dự án · đọc quy định</text><rect x="30" y="60" width="180" height="78" rx="12" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="120" y="86" font-size="15" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sâu hơn</text><text x="120" y="108" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Chuyên gia hệ thống</text><text x="120" y="124" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">quản lý chất lượng</text><line x1="240" y1="180" x2="120" y2="138" stroke="#1e7d4f" stroke-width="2.5" stroke-dasharray="6 4"/><rect x="430" y="60" width="180" height="78" rx="12" fill="#e8f0fa" stroke="#2563a8" stroke-width="2"/><text x="520" y="86" font-size="15" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Rộng hơn</text><text x="520" y="108" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Dự án liên phòng ban,</text><text x="520" y="124" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">kèm kỹ sư mới</text><line x1="400" y1="180" x2="520" y2="138" stroke="#2563a8" stroke-width="2.5" stroke-dasharray="6 4"/><rect x="230" y="312" width="180" height="78" rx="12" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="320" y="338" font-size="15" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Chuyển hướng</text><text x="320" y="360" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Đánh giá viên tổ chức</text><text x="320" y="376" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">chứng nhận (thử nhỏ trước)</text><line x1="320" y1="295" x2="320" y2="312" stroke="#d98a1c" stroke-width="2.5" stroke-dasharray="6 4"/></svg>