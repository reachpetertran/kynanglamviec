<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Sơ đồ tác động, giả định, ở tổng đài chăm sóc khách hàng. Chỉ tiêu thời gian mỗi cuộc gọi dưới 3 phút làm nhân viên kết thúc cuộc gọi sớm. Vấn đề của khách chưa được giải quyết, khách gọi lại, số cuộc gọi tăng, thời gian chờ tăng. Quản lý siết chỉ tiêu hơn, vòng lặp quay lại."><title>Sơ đồ tác động, giả định, ở tổng đài chăm sóc khách hàng. Chỉ tiêu thời gian mỗi cuộc gọi dưới 3 phút làm nhân viên kết thúc cuộc gọi sớm. Vấn đề của khách chưa được giải quyết, khách gọi lại, số cuộc gọi tăng, thời gian chờ tăng. Quản lý siết chỉ tiêu hơn, vòng lặp quay lại.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Vòng lặp: sửa một ô, cả vòng xấu đi</text><rect x="240" y="50" width="160" height="60" rx="12" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><text x="320" y="74" font-size="14" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Siết chỉ tiêu</text><text x="320" y="96" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">&lt; 3 phút/cuộc gọi</text><rect x="440" y="130" width="160" height="60" rx="12" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="520" y="154" font-size="14" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Kết thúc</text><text x="520" y="176" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">cuộc gọi sớm</text><rect x="390" y="270" width="160" height="60" rx="12" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="470" y="294" font-size="14" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Khách gọi lại</text><text x="470" y="316" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">38% cuộc gọi</text><rect x="90" y="270" width="160" height="60" rx="12" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><text x="170" y="294" font-size="14" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Thời gian chờ</text><text x="170" y="316" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2 → 6 phút</text><rect x="40" y="130" width="160" height="60" rx="12" fill="#e8f0fa" stroke="#2563a8" stroke-width="2"/><text x="120" y="154" font-size="14" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Quản lý lo</text><text x="120" y="176" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">chậm, siết thêm</text><line x1="400" y1="95" x2="470" y2="130" stroke="#1f7a74" stroke-width="2.5"/><circle cx="470" cy="130" r="4.5" fill="#1f7a74"/><line x1="520" y1="190" x2="490" y2="270" stroke="#1f7a74" stroke-width="2.5"/><circle cx="490" cy="270" r="4.5" fill="#1f7a74"/><line x1="390" y1="305" x2="250" y2="305" stroke="#1f7a74" stroke-width="2.5"/><circle cx="250" cy="305" r="4.5" fill="#1f7a74"/><line x1="150" y1="270" x2="125" y2="190" stroke="#1f7a74" stroke-width="2.5"/><circle cx="125" cy="190" r="4.5" fill="#1f7a74"/><line x1="150" y1="130" x2="240" y2="92" stroke="#1f7a74" stroke-width="2.5"/><circle cx="240" cy="92" r="4.5" fill="#1f7a74"/><circle cx="455" cy="100" r="11" fill="#fff" stroke="#1f7a74" stroke-width="2"/><text x="455" y="105" font-size="15" fill="#1f7a74" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">+</text><circle cx="520" cy="232" r="11" fill="#fff" stroke="#1f7a74" stroke-width="2"/><text x="520" y="237" font-size="15" fill="#1f7a74" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">+</text><circle cx="320" cy="290" r="11" fill="#fff" stroke="#1f7a74" stroke-width="2"/><text x="320" y="295" font-size="15" fill="#1f7a74" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">+</text><circle cx="122" cy="232" r="11" fill="#fff" stroke="#1f7a74" stroke-width="2"/><text x="122" y="237" font-size="15" fill="#1f7a74" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">+</text><circle cx="190" cy="100" r="11" fill="#fff" stroke="#1f7a74" stroke-width="2"/><text x="190" y="105" font-size="15" fill="#1f7a74" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">+</text><circle cx="320" cy="200" r="42" fill="#fff" stroke="#14524f" stroke-width="2.5" stroke-dasharray="6 4"/><text x="320" y="196" font-size="13" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Vòng</text><text x="320" y="213" font-size="13" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">tự lớn dần</text><rect x="150" y="350" width="340" height="36" rx="10" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="320" y="374" font-size="13" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Điểm đòn bẩy: đo &quot;giải quyết ngay lần đầu&quot;</text></svg>