<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Hai loại quyết định, giả định. Cửa quay lại được: thử mẫu báo cáo mới, đổi giờ họp. Quyết nhanh, thử nhỏ, đo lại. Cửa khó quay lại: ký hợp đồng nhà cung cấp 3 năm, thay hóa chất trên dây chuyền. Cần thêm dữ liệu, người duyệt và phương án dự phòng."><title>Hai loại quyết định, giả định. Cửa quay lại được: thử mẫu báo cáo mới, đổi giờ họp. Quyết nhanh, thử nhỏ, đo lại. Cửa khó quay lại: ký hợp đồng nhà cung cấp 3 năm, thay hóa chất trên dây chuyền. Cần thêm dữ liệu, người duyệt và phương án dự phòng.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Quyết định có quay lại được không?</text><rect x="30" y="54" width="280" height="326" rx="14" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><rect x="130" y="74" width="80" height="110" rx="6" fill="#fff" stroke="#1e7d4f" stroke-width="2.5"/><circle cx="196" cy="132" r="5" fill="#1e7d4f"/><path d="M90 130 q -18 -30 0 -50" fill="none" stroke="#1e7d4f" stroke-width="2.5"/><path d="M250 130 q 18 -30 0 -50" fill="none" stroke="#1e7d4f" stroke-width="2.5"/><text x="170" y="216" font-size="16" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Cửa quay lại được</text><text x="170" y="242" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Thử mẫu báo cáo mới</text><text x="170" y="260" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Đổi giờ họp nhóm</text><text x="170" y="278" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Đoạn mã thay thế tạm</text><circle cx="90" cy="308" r="5" fill="#1e7d4f"/><text x="104" y="312" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Quyết nhanh</text><circle cx="90" cy="330" r="5" fill="#1e7d4f"/><text x="104" y="334" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Thử nhỏ</text><circle cx="90" cy="352" r="5" fill="#1e7d4f"/><text x="104" y="356" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Đo lại, đổi nếu cần</text><rect x="330" y="54" width="280" height="326" rx="14" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><rect x="430" y="74" width="80" height="110" rx="6" fill="#fff" stroke="#b03a2e" stroke-width="2.5"/><circle cx="496" cy="132" r="5" fill="#b03a2e"/><line x1="400" y1="190" x2="540" y2="190" stroke="#b03a2e" stroke-width="3"/><text x="470" y="216" font-size="16" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Cửa khó quay lại</text><text x="470" y="242" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ký hợp đồng 3 năm</text><text x="470" y="260" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Thay hóa chất dây chuyền</text><text x="470" y="278" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tuyển, cho nghỉ việc</text><circle cx="390" cy="308" r="5" fill="#b03a2e"/><text x="404" y="312" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Thêm dữ liệu</text><circle cx="390" cy="330" r="5" fill="#b03a2e"/><text x="404" y="334" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Người có quyền duyệt</text><circle cx="390" cy="352" r="5" fill="#b03a2e"/><text x="404" y="356" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Phương án dự phòng</text></svg>