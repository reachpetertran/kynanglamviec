ns-serif">Ít nhất</text><rect x="316" y="292" width="148" height="54" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="390.0" y="324" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Vừa</text><rect x="472" y="292" width="148" height="54" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="546.0" y="324" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Nhiều nhất</text><text x="320" y="384" font-size="12.5" fill="#5b6b73" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tóm tắt để so sánh. Kiểm lại với văn bản gốc trước khi quyết.</text></svg>