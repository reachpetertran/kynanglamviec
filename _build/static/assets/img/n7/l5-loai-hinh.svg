<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Bảng so sánh ba loại hình theo bốn câu hỏi. Hộ kinh doanh: chủ chịu trách nhiệm bằng toàn bộ tài sản, giấy tờ ít nhất, khó gọi vốn. Công ty TNHH: trách nhiệm trong phạm vi vốn góp, một hoặc nhiều thành viên, gọi vốn hạn chế. Công ty cổ phần: trách nhiệm trong phạm vi vốn góp, từ 3 cổ đông, dễ gọi vốn nhất, giấy tờ nhiều nhất."><title>Bảng so sánh ba loại hình theo bốn câu hỏi. Hộ kinh doanh: chủ chịu trách nhiệm bằng toàn bộ tài sản, giấy tờ ít nhất, khó gọi vốn. Công ty TNHH: trách nhiệm trong phạm vi vốn góp, một hoặc nhiều thành viên, gọi vốn hạn chế. Công ty cổ phần: trách nhiệm trong phạm vi vốn góp, từ 3 cổ đông, dễ gọi vốn nhất, giấy tờ nhiều nhất.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">So sánh ba loại hình theo bốn câu hỏi</text><rect x="160" y="48" width="148" height="40" rx="8" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.5"/><text x="234.0" y="73" font-size="13.5" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hộ kinh doanh</text><rect x="316" y="48" width="148" height="40" rx="8" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.5"/><text x="390.0" y="73" font-size="13.5" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Công ty TNHH</text><rect x="472" y="48" width="148" height="40" rx="8" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.5"/><text x="546.0" y="73" font-size="13.5" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Công ty cổ phần</text><rect x="20" y="100" width="128" height="54" rx="8" fill="#fdf3e2" stroke="#