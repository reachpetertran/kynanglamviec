<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Bảng công cụ số của một tiệm bánh, giả định, gồm 5 dòng. Trang bán hàng: có tên và số điện thoại khách. Ví điện tử: có dữ liệu thanh toán. Phần mềm hóa đơn: có mã số thuế khách sỉ. Nhóm chat với nhân viên: có lịch ca. Thư mục ảnh sản phẩm: không có dữ liệu cá nhân. Các dòng có dữ liệu cá nhân được tô vàng."><title>Bảng công cụ số của một tiệm bánh, giả định, gồm 5 dòng. Trang bán hàng: có tên và số điện thoại khách. Ví điện tử: có dữ liệu thanh toán. Phần mềm hóa đơn: có mã số thuế khách sỉ. Nhóm chat với nhân viên: có lịch ca. Thư mục ảnh sản phẩm: không có dữ liệu cá nhân. Các dòng có dữ liệu cá nhân được tô vàng.</title><rect width="640" height="400" rx="18" fill="#fdf8ef"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Bảng công cụ số của một tiệm bánh</text><rect x="26" y="50" width="196" height="36" rx="8" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.5"/><text x="124.0" y="73" font-size="13.5" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Công cụ</text><rect x="226" y="50" width="246" height="36" rx="8" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.5"/><text x="349.0" y="73" font-size="13.5" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Dữ liệu</text><rect x="476" y="50" width="138" height="36" rx="8" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.5"/><text x="545.0" y="73" font-size="13.5" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Dữ liệu cá nhân?</text><rect x="26" y="96" width="196" height="46" rx="8" fill="#fdf3e2" stroke="#d98a1c" stroke-width="1.2"/><text x="124.0" y="124" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Trang bán hàng</text><rect x="226" y="96" width="246" height="46" rx="8" fill="#fdf3e2" stroke="#d98a1c" stroke-width="1.2"/><text x="349.0" y="124" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tên, số điện thoại khách</text><rect x="476" y="96" width="138" height="46" rx="8" fill="#fdf3e2" stroke="#d98a1c" stroke-width="1.2"/><text x="545.0" y="124" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Có</text><rect x="26" y="150" width="196" height="46" rx="8" fill="#fdf3e2" stroke="#d98a1c" stroke-width="1.2"/><text x="124.0" y="178" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ví điện tử</text><rect x="226" y="150" width="246" height="46" rx="8" fill="#fdf3e2" stroke="#d98a1c" stroke-width="1.2"/><text x="349.0" y="178" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Dữ liệu thanh toán</text><rect x="476" y="150" width="138" height="46" rx="8" fill="#fdf3e2" stroke="#d98a1c" stroke-width="1.2"/><text x="545.0" y="178" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Có</text><rect x="26" y="204" width="196" height="46" rx="8" fill="#fdf3e2" stroke="#d98a1c" stroke-width="1.2"/><text x="124.0" y="232" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Phần mềm hóa đơn</text><rect x="226" y="204" width="246" height="46" rx="8" fill="#fdf3e2" stroke="#d98a1c" stroke-width="1.2"/><text x="349.0" y="232" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Mã số thuế khách sỉ</text><rect x="476" y="204" width="138" height="46" rx="8" fill="#fdf3e2" stroke="#d98a1c" stroke-width="1.2"/><text x="545.0" y="232" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Có</text><rect x="26" y="258" width="196" height="46" rx="8" fill="#fdf3e2" stroke="#d98a1c" stroke-width="1.2"/><text x="124.0" y="286" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Nhóm chat nhân viên</text><rect x="226" y="258" width="246" height="46" rx="8" fill="#fdf3e2" stroke="#d98a1c" stroke-width="1.2"/><text x="349.0" y="286" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Lịch ca</text><rect x="476" y="258" width="138" height="46" rx="8" fill="#fdf3e2" stroke="#d98a1c" stroke-width="1.2"/><text x="545.0" y="286" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Có</text><rect x="26" y="312" width="196" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.2"/><text x="124.0" y="340" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Thư mục ảnh sản phẩm</text><rect x="226" y="312" width="246" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.2"/><text x="349.0" y="340" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ảnh bánh</text><rect x="476" y="312" width="138" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.2"/><text x="545.0" y="340" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Không</text><text x="320" y="384" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Dòng tô vàng: kiểm quyền truy cập, sao lưu, thu quyền khi nhân viên nghỉ.</text></svg>