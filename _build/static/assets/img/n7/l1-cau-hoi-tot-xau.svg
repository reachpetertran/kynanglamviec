<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="So sánh câu hỏi phỏng vấn, giả định. Bên trái, câu hỏi dẫn dắt màu đỏ: Chị có thích ứng dụng đặt lịch không? Chị có trả 50 nghìn một tháng không? Bên phải, câu hỏi về quá khứ màu xanh: Lần gần nhất chị đặt lịch là khi nào? Lúc đó chị làm thế nào? Chị tốn bao nhiêu thời gian?"><title>So sánh câu hỏi phỏng vấn, giả định. Bên trái, câu hỏi dẫn dắt màu đỏ: Chị có thích ứng dụng đặt lịch không? Chị có trả 50 nghìn một tháng không? Bên phải, câu hỏi về quá khứ màu xanh: Lần gần nhất chị đặt lịch là khi nào? Lúc đó chị làm thế nào? Chị tốn bao nhiêu thời gian?</title><rect width="640" height="400" rx="18" fill="#fdf8ef"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hỏi về tương lai hay hỏi về quá khứ?</text><rect x="24" y="56" width="280" height="286" rx="14" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><text x="164" y="88" font-size="16" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Câu hỏi dẫn dắt</text><text x="164" y="132" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Chị có thích ứng dụng</text><text x="164" y="166" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">đặt lịch không?</text><text x="164" y="234" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Chị có trả 50 nghìn</text><text x="164" y="268" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">một tháng không?</text><text x="164" y="322" font-size="15" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">→ cho lời khen</text><rect x="336" y="56" width="280" height="286" rx="14" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="476" y="88" font-size="16" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Câu hỏi về quá khứ</text><text x="476" y="132" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Lần gần nhất chị đặt lịch</text><text x="476" y="166" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">là khi nào?</text><text x="476" y="200" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Lúc đó chị làm thế nào?</text><text x="476" y="234" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Chị tốn bao nhiêu</text><text x="476" y="268" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">thời gian?</text><text x="476" y="322" font-size="15" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">→ cho sự thật</text><text x="320" y="376" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ghi việc khách đã làm, đã trả, đã bỏ thời gian. Không ghi lời khen.</text></svg>