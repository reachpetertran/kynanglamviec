<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Thanh thời gian 3 phút chia 5 đoạn, giả định. Vấn đề 30 giây, bằng chứng 45 giây, giải pháp 45 giây, con số 30 giây, đề nghị 30 giây. Bên dưới, hai cột so sánh: số đã có màu xanh, ví dụ 18 đơn cọc trong 3 tuần; số dự báo màu vàng, ví dụ 200 đơn mỗi tháng sau 6 tháng."><title>Thanh thời gian 3 phút chia 5 đoạn, giả định. Vấn đề 30 giây, bằng chứng 45 giây, giải pháp 45 giây, con số 30 giây, đề nghị 30 giây. Bên dưới, hai cột so sánh: số đã có màu xanh, ví dụ 18 đơn cọc trong 3 tuần; số dự báo màu vàng, ví dụ 200 đơn mỗi tháng sau 6 tháng.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Pitch 3 phút: 5 phần</text><rect x="30" y="64" width="92.66666666666667" height="64" rx="8" fill="#2563a8"/><text x="76.33333333333334" y="92" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Vấn đề</text><text x="76.33333333333334" y="114" font-size="12" fill="#fff" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">30 giây</text><rect x="126.66666666666667" y="64" width="141.0" height="64" rx="8" fill="#1e7d4f"/><text x="197.16666666666669" y="92" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Bằng chứng</text><text x="197.16666666666669" y="114" font-size="12" fill="#fff" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">45 giây</text><rect x="271.6666666666667" y="64" width="141.0" height="64" rx="8" fill="#1f7a74"/><text x="342.1666666666667" y="92" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Giải pháp</text><text x="342.1666666666667" y="114" font-size="12" fill="#fff" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">45 giây</text><rect x="416.6666666666667" y="64" width="92.66666666666667" height="64" rx="8" fill="#d98a1c"/><text x="463.0" y="92" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Con số</text><text x="463.0" y="114" font-size="12" fill="#fff" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">30 giây</text><rect x="513.3333333333334" y="64" width="92.66666666666667" height="64" rx="8" fill="#b03a2e"/><text x="559.6666666666667" y="92" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Đề nghị</text><text x="559.6666666666667" y="114" font-size="12" fill="#fff" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">30 giây</text><rect x="30" y="168" width="280" height="170" rx="12" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="170" y="198" font-size="16" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Số đã có</text><text x="170" y="240" font-size="18" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">18 đơn cọc</text><text x="170" y="266" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">trong 3 tuần</text><text x="170" y="312" font-size="13" fill="#1e7d4f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Nói: &quot;Đây là số thật&quot;</text><rect x="330" y="168" width="280" height="170" rx="12" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="470" y="198" font-size="16" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Số dự báo</text><text x="470" y="240" font-size="18" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">200 đơn mỗi tháng</text><text x="470" y="266" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">sau 6 tháng</text><text x="470" y="312" font-size="13" fill="#d98a1c" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Nói: &quot;Đây là dự báo&quot;</text><text x="320" y="374" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Kiểm: người nghe nhắc lại đúng đề nghị của bạn.</text></svg>