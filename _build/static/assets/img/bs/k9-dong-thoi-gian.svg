<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Đường thời gian một buổi chiều xếp kho đồ vải, giả định. 13:00 đề xuất 3 câu và chia 3 cặp: phân loại, gấp, xếp kệ và dán nhãn. 15:00 hỏi tiến độ từng cặp, thấy cặp gấp chậm, người điều phối sang phụ. 17:00 báo giám sát đã xong và cảm ơn cả nhóm."><title>Đường thời gian một buổi chiều xếp kho đồ vải, giả định. 13:00 đề xuất 3 câu và chia 3 cặp: phân loại, gấp, xếp kệ và dán nhãn. 15:00 hỏi tiến độ từng cặp, thấy cặp gấp chậm, người điều phối sang phụ. 17:00 báo giám sát đã xong và cảm ơn cả nhóm.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="18.5" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Điều phối một buổi chiều xếp kho (giả định)</text><line x1="60" y1="84" x2="590" y2="84" stroke="#14524f" stroke-width="4"/><circle cx="80" cy="84" r="11" fill="#d98a1c" stroke="#fff" stroke-width="3"/><text x="80" y="62" font-size="14" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">13:00</text><text x="80" y="112" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Đề xuất, chia việc</text><circle cx="330" cy="84" r="11" fill="#d98a1c" stroke="#fff" stroke-width="3"/><text x="330" y="62" font-size="14" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">15:00</text><text x="330" y="112" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hỏi tiến độ</text><circle cx="570" cy="84" r="11" fill="#d98a1c" stroke="#fff" stroke-width="3"/><text x="570" y="62" font-size="14" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">17:00</text><text x="570" y="112" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Chốt, cảm ơn</text><text x="60" y="142" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Cặp 1: phân loại</text><rect x="60" y="150" width="530" height="22" rx="11" fill="#e1eae8"/><rect x="60" y="150" width="270.0" height="22" rx="11" fill="#1f7a74"/><text x="60" y="204" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Cặp 2: gấp</text><rect x="60" y="212" width="530" height="22" rx="11" fill="#e1eae8"/><rect x="60" y="212" width="148.5" height="22" rx="11" fill="#d98a1c"/><text x="60" y="266" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Cặp 3: xếp kệ, dán nhãn</text><rect x="60" y="274" width="530" height="22" rx="11" fill="#e1eae8"/><rect x="60" y="274" width="243.0" height="22" rx="11" fill="#2563a8"/><line x1="330" y1="128" x2="330" y2="300" stroke="#b03a2e" stroke-width="2" stroke-dasharray="5 4"/><rect x="346" y="180" width="240" height="28" rx="8" fill="#fbe9e7" stroke="#b03a2e" stroke-width="1.6"/><text x="466" y="199" font-size="12" fill="#b03a2e" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Chậm → xong phần mình rồi sang phụ</text><rect x="40" y="318" width="560" height="64" rx="12" fill="#fff" stroke="#1e7d4f" stroke-width="2"/><text x="320" y="342" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Đề xuất 3 câu: việc cần làm · cách làm · “Mọi người thấy ổn không?”</text><text x="320" y="362" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hỏi tiến độ cụ thể, không trách</text></svg>