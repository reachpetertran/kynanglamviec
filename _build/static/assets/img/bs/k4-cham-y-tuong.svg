<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Bảng chấm ba ý tưởng A, B, C theo bốn tiêu chí: tác động, chi phí thử thấp, mức bằng chứng, quay lại được. Mỗi ô có từ 1 đến 3 chấm. Ý A đổi toàn bộ phần mềm có nhiều ô chỉ 1 chấm nên cần bằng chứng trước. Ý B và C có điểm cao ở chi phí và quay lại được nên cho thử nhỏ. Điểm số là giả định."><title>Bảng chấm ba ý tưởng A, B, C theo bốn tiêu chí: tác động, chi phí thử thấp, mức bằng chứng, quay lại được. Mỗi ô có từ 1 đến 3 chấm. Ý A đổi toàn bộ phần mềm có nhiều ô chỉ 1 chấm nên cần bằng chứng trước. Ý B và C có điểm cao ở chi phí và quay lại được nên cho thử nhỏ. Điểm số là giả định.</title><rect width="640" height="400" rx="18" fill="#fdf8ef"/><text x="320" y="30" font-size="18.5" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Chấm ý tưởng theo 4 tiêu chí (giả định)</text><rect x="174" y="50" width="76" height="48" rx="8" fill="#14524f" stroke="#14524f" stroke-width="1.5"/><text x="212.0" y="79" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tác động</text><rect x="254" y="50" width="76" height="48" rx="8" fill="#14524f" stroke="#14524f" stroke-width="1.5"/><text x="292.0" y="70" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Chi phí</text><text x="292.0" y="85" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">thử thấp</text><rect x="334" y="50" width="76" height="48" rx="8" fill="#14524f" stroke="#14524f" stroke-width="1.5"/><text x="372.0" y="70" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Mức</text