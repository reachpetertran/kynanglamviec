<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Hai lần gói quà, giả định. Lần 1: tờ giấy vừa khít mép hộp, giấy bị nhăn, dấu chéo đỏ. Lần 2: chỉ đổi một điểm, giấy rộng hơn mép hộp 3 cm, gói phẳng, dấu tích xanh."><title>Hai lần gói quà, giả định. Lần 1: tờ giấy vừa khít mép hộp, giấy bị nhăn, dấu chéo đỏ. Lần 2: chỉ đổi một điểm, giấy rộng hơn mép hộp 3 cm, gói phẳng, dấu tích xanh.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Thử lại, đổi đúng một điểm</text><rect x="24" y="52" width="276" height="300" rx="14" fill="#fff" stroke="#b03a2e" stroke-width="2"/><text x="162" y="80" font-size="16" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Lần 1</text><rect x="340" y="52" width="276" height="300" rx="14" fill="#fff" stroke="#1e7d4f" stroke-width="2"/><text x="478" y="80" font-size="16" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Lần 2</text><rect x="87" y="120" width="150" height="110" rx="8" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><path d="M99,130 q8,30 -4,60 q-8,20 6,36" fill="none" stroke="#b03a2e" stroke-opacity=".55" stroke-width="2"/><path d="M133,130 q8,30 -4,60 q-8,20 6,36" fill="none" stroke="#b03a2e" stroke-opacity=".55" stroke-width="2"/><path d="M167,130 q8,30 -4,60 q-8,20 6,36" fill="none" stroke="#b03a2e" stroke-opacity=".55" stroke-width="2"/><path d="M201,130 q8,30 -4,60 q-8,20 6,36" fill="none" stroke="#b03a2e" stroke-opacity=".55" stroke-width="2"/><rect x="153" y="120" width="18" height="110" fill="#d98a1c"/><rect x="87" y="166" width="150" height="18" fill="#d98a1c"/><circle cx="258" cy="110" r="15" fill="#b03a2e"/><path d="M252,104 l12,12 M264,104 l-12,12" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><rect x="403" y="120" width="150" height="110" rx="8" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><rect x="469" y="120" width="18" height="110" fill="#d98a1c"/><rect x="403" y="166" width="150" height="18" fill="#d98a1c"/><circle cx="574" cy="110" r="15" fill="#1e7d4f"/><path d="M567,110 l5,6 l10,-12" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><text x="162" y="268" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Giấy vừa khít mép hộp</text><text x="162" y="288" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">→ giấy bị nhăn, hở góc</text><line x1="395" y1="250" x2="561" y2="250" stroke="#1f7a74" stroke-width="2" stroke-dasharray="4 3"/><text x="478" y="244" font-size="12" fill="#1f7a74" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">+3 cm mỗi mép</text><text x="478" y="278" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Chỉ đổi khổ giấy</text><text x="478" y="298" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">→ gói phẳng</text><line x1="300" y1="200" x2="336" y2="200" stroke="#d98a1c" stroke-width="3"/><circle cx="336" cy="200" r="4.5" fill="#d98a1c"/><text x="320" y="382" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Đổi nhiều thứ cùng lúc thì không biết điều gì đã giúp.</text></svg>