<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Lộ trình thay đổi ba giai đoạn, giả định, khi đưa AI vào phòng hành chính nhân sự. Giai đoạn 1, tuần 1 đến 2: hai người tình nguyện thử soạn nháp thông báo nội bộ. Giai đoạn 2, tuần 3 đến 6: cả phòng dùng, có quy tắc 5 dòng, gặp nhau mỗi tuần để chia sẻ lỗi. Giai đoạn 3, từ tuần 7: đo thời gian soạn và số lỗi, quyết định mở rộng hay dừng. Dữ liệu cá nhân của người lao động không đưa vào AI ở mọi giai đoạn."><title>Lộ trình thay đổi ba giai đoạn, giả định, khi đưa AI vào phòng hành chính nhân sự. Giai đoạn 1, tuần 1 đến 2: hai người tình nguyện thử soạn nháp thông báo nội bộ. Giai đoạn 2, tuần 3 đến 6: cả phòng dùng, có quy tắc 5 dòng, gặp nhau mỗi tuần để chia sẻ lỗi. Giai đoạn 3, từ tuần 7: đo thời gian soạn và số lỗi, quyết định mở rộng hay dừng. Dữ liệu cá nhân của người lao động không đưa vào AI ở mọi giai đoạn.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Thử nhỏ, đo, rồi mới mở rộng</text><rect x="24" y="150" width="180" height="150" rx="14" fill="#e8f0fa" stroke="#2563a8" stroke-width="2"/><text x="114" y="178" font-size="15" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Giai đoạn 1</text><text x="114" y="198" font-size="12.5" fill="#5b6b73" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tuần 1–2</text><text x="114" y="228" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2 người tình nguyện</text><text x="114" y="246" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">soạn nháp thông báo</text><rect x="230" y="110" width="180" height="190" rx="14" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="320" y="138" font-size="15" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Giai đoạn 2</text><text x="320" y="158" font-size="12.5" fill="#5b6b73" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tuần 3–6</text><text x="320" y="188" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Cả phòng dùng</text><text x="320" y="206" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">quy tắc 5 dòng</text><text x="320" y="224" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">chia sẻ lỗi mỗi tuần</text><rect x="436" y="70" width="180" height="230" rx="14" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="526" y="98" font-size="15" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Giai đoạn 3</text><text x="526" y="118" font-size="12.5" fill="#5b6b73" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Từ tuần 7</text><text x="526" y="148" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Đo thời gian, số lỗi</text><text x="526" y="166" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">mở rộng hay dừng</text><line x1="204" y1="220" x2="228" y2="200" stroke="#1f7a74" stroke-width="2.5"/><circle cx="228" cy="200" r="4.5" fill="#1f7a74"/><line x1="410" y1="180" x2="434" y2="160" stroke="#1f7a74" stroke-width="2.5"/><circle cx="434" cy="160" r="4.5" fill="#1f7a74"/><rect x="24" y="318" width="592" height="62" rx="12" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><text x="320" y="344" font-size="14" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Mọi giai đoạn: không đưa dữ liệu cá nhân</text><text x="320" y="366" font-size="14" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">của người lao động vào AI</text></svg>