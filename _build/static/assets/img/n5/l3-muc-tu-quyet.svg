<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Bốn mức tự quyết khi giao việc. Mức 1: làm theo hướng dẫn, hỏi khi có gì khác. Mức 2: đề xuất phương án, chờ duyệt rồi làm. Mức 3: tự làm, báo lại sau khi xong. Mức 4: tự quyết hoàn toàn, báo trong buổi họp định kỳ. Càng lên cao, quản lý càng ít can thiệp."><title>Bốn mức tự quyết khi giao việc. Mức 1: làm theo hướng dẫn, hỏi khi có gì khác. Mức 2: đề xuất phương án, chờ duyệt rồi làm. Mức 3: tự làm, báo lại sau khi xong. Mức 4: tự quyết hoàn toàn, báo trong buổi họp định kỳ. Càng lên cao, quản lý càng ít can thiệp.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Bốn mức tự quyết khi giao việc</text><rect x="30" y="230" width="136" height="120" rx="12" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><circle cx="98" cy="260" r="17" fill="#b03a2e"/><text x="98" y="266" font-size="16" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1</text><text x="98" y="300" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Làm theo hướng dẫn</text><text x="98" y="320" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">hỏi khi có gì khác</text><rect x="178" y="185" width="136" height="165" rx="12" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><circle cx="246" cy="215" r="17" fill="#d98a1c"/><text x="246" y="221" font-size="16" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2</text><text x="246" y="255" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Đề xuất, chờ duyệt</text><text x="246" y="275" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">rồi mới làm</text><rect x="326" y="140" width="136" height="210" rx="12" fill="#e8f0fa" stroke="#2563a8" stroke-width="2"/><circle cx="394" cy="170" r="17" fill="#2563a8"/><text x="394" y="176" font-size="16" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3</text><text x="394" y="210" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tự làm, báo sau</text><text x="394" y="230" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">báo khi xong</text><rect x="474" y="95" width="136" height="255" rx="12" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><circle cx="542" cy="125" r="17" fill="#1e7d4f"/><text x="542" y="131" font-size="16" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">4</text><text x="542" y="165" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tự quyết hoàn toàn</text><text x="542" y="185" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">báo ở họp định kỳ</text><line x1="40" y1="366" x2="600" y2="366" stroke="#14524f" stroke-width="2.5"/><circle cx="600" cy="366" r="4.5" fill="#14524f"/><text x="320" y="390" font-size="12.5" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Quản lý can thiệp ít dần →</text><text x="98" y="80" font-size="12.5" fill="#b03a2e" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Rủi ro cao,</text><text x="98" y="96" font-size="12.5" fill="#b03a2e" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">người còn mới</text><text x="542" y="60" font-size="12.5" fill="#1e7d4f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Việc quen,</text><text x="542" y="76" font-size="12.5" fill="#1e7d4f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">rủi ro thấp</text></svg>