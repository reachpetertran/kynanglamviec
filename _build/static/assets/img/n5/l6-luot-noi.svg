<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Hai cuộc họp, giả định. Cuộc họp trước khi có thỏa thuận: quản lý và hai người nói gần hết thời gian, bốn người còn lại gần như im lặng, người làm từ xa không nghe rõ. Cuộc họp sau khi có thỏa thuận: mọi người viết ý kiến trước, người ít nói được mời nói trước, quản lý nói sau cùng, người làm từ xa có tài liệu trước."><title>Hai cuộc họp, giả định. Cuộc họp trước khi có thỏa thuận: quản lý và hai người nói gần hết thời gian, bốn người còn lại gần như im lặng, người làm từ xa không nghe rõ. Cuộc họp sau khi có thỏa thuận: mọi người viết ý kiến trước, người ít nói được mời nói trước, quản lý nói sau cùng, người làm từ xa có tài liệu trước.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ai được nghe trong cuộc họp?</text><rect x="24" y="48" width="286" height="300" rx="14" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><text x="167" y="76" font-size="15" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Trước thỏa thuận</text><text x="88" y="116" font-size="12" fill="#1d2a33" text-anchor="end" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">QL</text><rect x="98" y="104" width="184" height="16" rx="5" fill="#b03a2e" fill-opacity=".85"/><text x="88" y="148" font-size="12" fill="#1d2a33" text-anchor="end" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">A</text><rect x="98" y="136" width="140" height="16" rx="5" fill="#b03a2e" fill-opacity=".85"/><text x="88" y="180" font-size="12" fill="#1d2a33" text-anchor="end" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">B</text><rect x="98" y="168" width="120" height="16" rx="5" fill="#b03a2e" fill-opacity=".85"/><text x="88" y="212" font-size="12" fill="#1d2a33" text-anchor="end" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">C</text><rect x="98" y="200" width="20" height="16" rx="5" fill="#b03a2e" fill-opacity=".85"/><text x="88" y="244" font-size="12" fill="#1d2a33" text-anchor="end" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">D</text><rect x="98" y="232" width="16" height="16" rx="5" fill="#b03a2e" fill-opacity=".85"/><text x="88" y="276" font-size="12" fill="#1d2a33" text-anchor="end" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">E</text><rect x="98" y="264" width="12" height="16" rx="5" fill="#b03a2e" fill-opacity=".85"/><text x="88" y="308" font-size="12" fill="#1d2a33" text-anchor="end" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Từ xa</text><rect x="98" y="296" width="8" height="16" rx="5" fill="#b03a2e" fill-opacity=".85"/><text x="167" y="336" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Vài người nói gần hết giờ</text><rect x="330" y="48" width="286" height="300" rx="14" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="473" y="76" font-size="15" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sau thỏa thuận</text><text x="394" y="116" font-size="12" fill="#1d2a33" text-anchor="end" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">QL</text><rect x="404" y="104" width="68" height="16" rx="5" fill="#1e7d4f" fill-opacity=".85"/><text x="394" y="148" font-size="12" fill="#1d2a33" text-anchor="end" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">A</text><rect x="404" y="136" width="60" height="16" rx="5" fill="#1e7d4f" fill-opacity=".85"/><text x="394" y="180" font-size="12" fill="#1d2a33" text-anchor="end" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">B</text><rect x="404" y="168" width="64" height="16" rx="5" fill="#1e7d4f" fill-opacity=".85"/><text x="394" y="212" font-size="12" fill="#1d2a33" text-anchor="end" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">C</text><rect x="404" y="200" width="56" height="16" rx="5" fill="#1e7d4f" fill-opacity=".85"/><text x="394" y="244" font-size="12" fill="#1d2a33" text-anchor="end" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">D</text><rect x="404" y="232" width="60" height="16" rx="5" fill="#1e7d4f" fill-opacity=".85"/><text x="394" y="276" font-size="12" fill="#1d2a33" text-anchor="end" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">E</text><rect x="404" y="264" width="52" height="16" rx="5" fill="#1e7d4f" fill-opacity=".85"/><text x="394" y="308" font-size="12" fill="#1d2a33" text-anchor="end" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Từ xa</text><rect x="404" y="296" width="48" height="16" rx="5" fill="#1e7d4f" fill-opacity=".85"/><text x="473" y="336" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Viết trước, người ít nói nói trước</text><text x="320" y="380" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Độ dài thanh: thời gian nói, minh họa giả định</text></svg>