<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Cân công sức, giả định, cho một phòng đảm bảo chất lượng 5 người trong một quý. Bên trái: 7 việc cần tổng 340 ngày công. Bên phải: sức thật của đội 250 ngày công sau khi trừ nghỉ phép, họp, đào tạo, việc phát sinh. Cán cân nghiêng. Để cân bằng: dừng 1 việc không gắn mục tiêu, hoãn 1 việc sang quý sau, thu nhỏ phạm vi 1 việc."><title>Cân công sức, giả định, cho một phòng đảm bảo chất lượng 5 người trong một quý. Bên trái: 7 việc cần tổng 340 ngày công. Bên phải: sức thật của đội 250 ngày công sau khi trừ nghỉ phép, họp, đào tạo, việc phát sinh. Cán cân nghiêng. Để cân bằng: dừng 1 việc không gắn mục tiêu, hoãn 1 việc sang quý sau, thu nhỏ phạm vi 1 việc.</title><rect width="640" height="400" rx="18" fill="#fdf8ef"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Cân công sức của đội trong một quý</text><polygon points="320,300 300,340 340,340" fill="#14524f"/><line x1="120" y1="250" x2="520" y2="200" stroke="#14524f" stroke-width="5" stroke-linecap="round"/><circle cx="320" cy="225" r="7" fill="#14524f"/><line x1="320" y1="225" x2="320" y2="300" stroke="#14524f" stroke-width="4"/><rect x="40" y="150" width="170" height="100" rx="12" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><text x="125" y="178" font-size="15" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">7 việc cần</text><text x="125" y="206" font-size="26" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">340</text><text x="125" y="230" font-size="12.5" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">ngày công</text><rect x="430" y="100" width="170" height="100" rx="12" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="515" y="128" font-size="15" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sức thật</text><text x="515" y="156" font-size="26" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">250</text><text x="515" y="180" font-size="11.5" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">sau khi trừ phép, họp…</text><rect x="40" y="348" width="560" height="40" rx="10" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="320" y="373" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Dừng 1 việc · Hoãn 1 việc sang quý sau · Thu nhỏ 1 việc</text><text x="320" y="70" font-size="14" fill="#b03a2e" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Thiếu khoảng 90 ngày công → phải bớt việc</text></svg>