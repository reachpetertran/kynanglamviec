<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Bản đồ phối hợp của một nhân viên mới ở phòng kinh doanh, giả định. Ở giữa là Mình. Xung quanh là bốn đầu mối: kho, kế toán, chăm sóc khách hàng, trưởng nhóm. Mỗi đầu mối ghi mình cần gì từ họ và họ cần gì từ mình."><title>Bản đồ phối hợp của một nhân viên mới ở phòng kinh doanh, giả định. Ở giữa là Mình. Xung quanh là bốn đầu mối: kho, kế toán, chăm sóc khách hàng, trưởng nhóm. Mỗi đầu mối ghi mình cần gì từ họ và họ cần gì từ mình.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Bản đồ phối hợp</text><circle cx="320" cy="214" r="46" fill="#14524f"/><text x="320" y="210" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Mình</text><text x="320" y="227" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">(kinh doanh)</text><rect x="40" y="56" width="220" height="92" rx="12" fill="#fff" stroke="#1f7a74" stroke-width="2"/><text x="150" y="80" font-size="14" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Kho</text><text x="54" y="106" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Cần: số tồn kho trước 9:00</text><text x="54" y="130" font-size="12" fill="#d98a1c" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Họ cần: đơn đủ mã hàng</text><line x1="150" y1="148" x2="320" y2="214" stroke="#1f7a74" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="380" y="56" width="220" height="92" rx="12" fill="#fff" stroke="#1f7a74" stroke-width="2"/><text x="490" y="80" font-size="14" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Kế toán</text><text x="394" y="106" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Cần: xác nhận đã nhận tiền</text><text x="394" y="130" font-size="12" fill="#d98a1c" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Họ cần: hóa đơn đúng hạn</text><line x1="490" y1="148" x2="320" y2="214" stroke="#1f7a74" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="40" y="284" width="220" height="92" rx="12" fill="#fff" stroke="#1f7a74" stroke-width="2"/><text x="150" y="308" font-size="14" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Chăm sóc khách hàng</text><text x="54" y="334" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Cần: ghi chú khách khó</text><text x="54" y="358" font-size="12" fill="#d98a1c" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Họ cần: hẹn giao chính xác</text><line x1="150" y1="284" x2="320" y2="214" stroke="#1f7a74" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="380" y="284" width="220" height="92" rx="12" fill="#fff" stroke="#1f7a74" stroke-width="2"/><text x="490" y="308" font-size="14" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Trưởng nhóm</text><text x="394" y="334" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Cần: ưu tiên khi trùng việc</text><text x="394" y="358" font-size="12" fill="#d98a1c" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Họ cần: báo sớm khi chậm</text><line x1="490" y1="284" x2="320" y2="214" stroke="#1f7a74" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="320" cy="214" r="46" fill="#14524f"/><text x="320" y="210" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Mình</text><text x="320" y="227" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">(kinh doanh)</text></svg>