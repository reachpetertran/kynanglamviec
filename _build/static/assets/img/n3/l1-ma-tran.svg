<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Ma trận bốn ô sắp ưu tiên, giả định. Trục ngang là hạn gần hay xa, trục dọc là ảnh hưởng lớn hay nhỏ. Ô ảnh hưởng lớn, hạn gần: làm trước. Ảnh hưởng lớn, hạn xa: xếp lịch. Ảnh hưởng nhỏ, hạn gần: làm nhanh hoặc hỏi. Ảnh hưởng nhỏ, hạn xa: để sau."><title>Ma trận bốn ô sắp ưu tiên, giả định. Trục ngang là hạn gần hay xa, trục dọc là ảnh hưởng lớn hay nhỏ. Ô ảnh hưởng lớn, hạn gần: làm trước. Ảnh hưởng lớn, hạn xa: xếp lịch. Ảnh hưởng nhỏ, hạn gần: làm nhanh hoặc hỏi. Ảnh hưởng nhỏ, hạn xa: để sau.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sắp ưu tiên: ảnh hưởng × hạn</text><rect x="110" y="56" width="240" height="140" rx="12" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><text x="230" y="84" font-size="16" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1. Làm trước</text><text x="230" y="108" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ảnh hưởng lớn</text><text x="230" y="124" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hạn gần</text><text x="230" y="156" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Báo cáo số liệu</text><text x="230" y="173" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">cho khách, hạn 15:00</text><rect x="370" y="56" width="240" height="140" rx="12" fill="#e8f0fa" stroke="#2563a8" stroke-width="2"/><text x="490" y="84" font-size="16" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2. Xếp lịch</text><text x="490" y="108" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ảnh hưởng lớn</text><text x="490" y="124" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hạn xa</text><text x="490" y="156" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Học phần mềm mới,</text><text x="490" y="173" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">đặt 2 khung giờ</text><rect x="110" y="212" width="240" height="140" rx="12" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="230" y="240" font-size="16" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3. Làm nhanh / hỏi</text><text x="230" y="264" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ảnh hưởng nhỏ</text><text x="230" y="280" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hạn gần</text><text x="230" y="312" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">In tài liệu họp,</text><text x="230" y="329" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">làm trong 10 phút</text><rect x="370" y="212" width="240" height="140" rx="12" fill="#f1f4f5" stroke="#5b6b73" stroke-width="2"/><text x="490" y="240" font-size="16" fill="#5b6b73" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">4. Để sau</text><text x="490" y="264" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ảnh hưởng nhỏ</text><text x="490" y="280" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hạn xa</text><text x="490" y="312" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sắp lại thư mục</text><text x="490" y="329" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">chung</text><text x="60" y="140" font-size="12" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ảnh</text><text x="60" y="155" font-size="12" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">hưởng</text><text x="60" y="170" font-size="12" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">lớn</text><text x="60" y="296" font-size="12" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ảnh</text><text x="60" y="311" font-size="12" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">hưởng</text><text x="60" y="326" font-size="12" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">nhỏ</text><text x="230" y="378" font-size="13" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hạn gần</text><text x="490" y="378" font-size="13" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hạn xa</text></svg>