<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Hồ sơ cho buổi đánh giá 90 ngày, giả định. Bên trái là sáu tờ của Sổ tay 90 ngày. Mũi tên dẫn sang bên phải: ba ví dụ STAR có số liệu, bảng tự đánh giá Tôi có thể, hai câu hỏi cho cấp trên, ba mục tiêu cho 90 ngày tới."><title>Hồ sơ cho buổi đánh giá 90 ngày, giả định. Bên trái là sáu tờ của Sổ tay 90 ngày. Mũi tên dẫn sang bên phải: ba ví dụ STAR có số liệu, bảng tự đánh giá Tôi có thể, hai câu hỏi cho cấp trên, ba mục tiêu cho 90 ngày tới.</title><rect width="640" height="400" rx="18" fill="#fdf3e2"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Từ Sổ tay 90 ngày đến buổi đánh giá</text><rect x="30" y="56" width="230" height="42" rx="8" fill="#fff" stroke="#1f7a74" stroke-width="1.5"/><text x="46" y="82" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tờ 1 Bảng việc tuần</text><rect x="34" y="108" width="230" height="42" rx="8" fill="#fff" stroke="#1f7a74" stroke-width="1.5"/><text x="50" y="134" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tờ 2 Trang ghi họp</text><rect x="38" y="160" width="230" height="42" rx="8" fill="#fff" stroke="#1f7a74" stroke-width="1.5"/><text x="54" y="186" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tờ 3 Phiếu yêu cầu</text><rect x="42" y="212" width="230" height="42" rx="8" fill="#fff" stroke="#1f7a74" stroke-width="1.5"/><text x="58" y="238" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tờ 4 Phiếu sự cố</text><rect x="46" y="264" width="230" height="42" rx="8" fill="#fff" stroke="#1f7a74" stroke-width="1.5"/><text x="62" y="290" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tờ 5 Phiếu rút kinh nghiệm</text><rect x="50" y="316" width="230" height="42" rx="8" fill="#fff" stroke="#1f7a74" stroke-width="1.5"/><text x="66" y="342" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tờ 6 Bản đồ phối hợp</text><line x1="280" y1="214" x2="330" y2="214" stroke="#d98a1c" stroke-width="2.5"/><circle cx="330" cy="214" r="4.5" fill="#d98a1c"/><rect x="340" y="56" width="270" height="320" rx="14" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="475" y="84" font-size="15" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Mang vào buổi đánh giá</text><rect x="358" y="110" width="16" height="16" rx="3" fill="#fff" stroke="#d98a1c" stroke-width="2"/><text x="384" y="124" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3 ví dụ STAR có số liệu</text><rect x="358" y="160" width="16" height="16" rx="3" fill="#fff" stroke="#d98a1c" stroke-width="2"/><text x="384" y="174" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Bảng tự đánh giá &quot;Tôi có thể…&quot;</text><rect x="358" y="210" width="16" height="16" rx="3" fill="#fff" stroke="#d98a1c" stroke-width="2"/><text x="384" y="224" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1 điểm mạnh, 1 điểm cần tiến bộ</text><rect x="358" y="260" width="16" height="16" rx="3" fill="#fff" stroke="#d98a1c" stroke-width="2"/><text x="384" y="274" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2 câu hỏi cho cấp trên</text><rect x="358" y="310" width="16" height="16" rx="3" fill="#fff" stroke="#d98a1c" stroke-width="2"/><text x="384" y="324" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3 mục tiêu cho 90 ngày tới</text></svg>