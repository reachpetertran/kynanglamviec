<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Chuỗi năm câu hỏi vì sao, giả định, ở xưởng may. Hiện tượng: lô áo bị trả vì sai cỡ nhãn. Vì sao 1: nhãn cỡ M gắn vào áo cỡ L. Vì sao 2: hai hộp nhãn để cạnh nhau, giống màu. Vì sao 3: kệ nhãn không chia ô theo cỡ. Nguyên nhân gốc: chưa có quy định sắp kệ. Sửa tạm: kiểm lại lô. Sửa gốc: chia ô kệ, dán màu theo cỡ."><title>Chuỗi năm câu hỏi vì sao, giả định, ở xưởng may. Hiện tượng: lô áo bị trả vì sai cỡ nhãn. Vì sao 1: nhãn cỡ M gắn vào áo cỡ L. Vì sao 2: hai hộp nhãn để cạnh nhau, giống màu. Vì sao 3: kệ nhãn không chia ô theo cỡ. Nguyên nhân gốc: chưa có quy định sắp kệ. Sửa tạm: kiểm lại lô. Sửa gốc: chia ô kệ, dán màu theo cỡ.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hỏi &quot;Vì sao?&quot; đến nguyên nhân gốc</text><rect x="30" y="50" width="580" height="40" rx="10" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><text x="320" y="76" font-size="14" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hiện tượng: lô 300 áo bị trả vì sai nhãn cỡ (giả định)</text><rect x="50" y="104" width="470" height="36" rx="8" fill="#fff" stroke="#1f7a74" stroke-width="1.5"/><text x="66" y="127" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Vì sao? Nhãn cỡ M bị gắn vào áo cỡ L.</text><rect x="68" y="150" width="470" height="36" rx="8" fill="#fff" stroke="#1f7a74" stroke-width="1.5"/><text x="84" y="173" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Vì sao? Hai hộp nhãn M và L để cạnh nhau, cùng màu.</text><rect x="86" y="196" width="470" height="36" rx="8" fill="#fff" stroke="#1f7a74" stroke-width="1.5"/><text x="102" y="219" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Vì sao? Kệ nhãn không chia ô theo cỡ.</text><rect x="104" y="242" width="470" height="36" rx="8" fill="#fff" stroke="#1f7a74" stroke-width="1.5"/><text x="120" y="265" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Vì sao? Chưa có quy định sắp kệ nhãn.</text><rect x="30" y="296" width="280" height="84" rx="12" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="170" y="320" font-size="14" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sửa tạm (ngay hôm nay)</text><text x="170" y="344" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Kiểm lại cả lô, thay nhãn sai</text><rect x="330" y="296" width="280" height="84" rx="12" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="470" y="320" font-size="14" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sửa gốc (để không lặp lại)</text><text x="470" y="344" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Chia ô kệ theo cỡ,</text><text x="470" y="361" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">dán màu khác nhau cho mỗi cỡ</text></svg>