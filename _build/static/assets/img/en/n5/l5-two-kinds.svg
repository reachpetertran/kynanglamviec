<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Two kinds of difficult conversation. Left: a conversation with one person about their work, with facts, impact, listening, agreement and a review date. Right: mediating a conflict between two people, with meeting person A alone, meeting person B alone, meeting together, shared criteria and an agreed way of working. Below is a red zone: harassment, violence, fraud and safety dangers are not mediated, they are reported through the proper process."><title>Two kinds of difficult conversation. Left: a conversation with one person about their work, with facts, impact, listening, agreement and a review date. Right: mediating a conflict between two people, with meeting person A alone, meeting person B alone, meeting together, shared criteria and an agreed way of working. Below is a red zone: harassment, violence, fraud and safety dangers are not mediated, they are reported through the proper process.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Two kinds of difficult conversation</text><rect x="24" y="48" width="286" height="250" rx="14" fill="#e8f0fa" stroke="#2563a8" stroke-width="2"/><text x="167" y="76" font-size="16" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">With one person</text><text x="167" y="96" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">about their work</text><circle cx="64" cy="122" r="11" fill="#2563a8"/><text x="64" y="127" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1</text><text x="86" y="127" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Facts</text><circle cx="64" cy="156" r="11" fill="#2563a8"/><text x="64" y="161" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2</text><text x="86" y="161" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Impact</text><circle cx="64" cy="190" r="11" fill="#2563a8"/><text x="64" y="195" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3</text><text x="86" y="195" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ask and listen</text><circle cx="64" cy="224" r="11" fill="#2563a8"/><text x="64" y="229" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">4</text><text x="86" y="229" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Agreement</text><circle cx="64" cy="258" r="11" fill="#2563a8"/><text x="64" y="263" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">5</text><text x="86" y="263" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Review date</text><rect x="330" y="48" width="286" height="250" rx="14" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="473" y="76" font-size="16" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Between two people</text><text x="473" y="96" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">mediating a conflict</text><circle cx="370" cy="122" r="11" fill="#d98a1c"/><text x="370" y="127" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1</text><text x="392" y="127" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Meet A alone</text><circle cx="370" cy="156" r="11" fill="#d98a1c"/><text x="370" y="161" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2</text><text x="392" y="161" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Meet B alone</text><circle cx="370" cy="190" r="11" fill="#d98a1c"/><text x="370" y="195" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3</text><text x="392" y="195" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Meet together</text><circle cx="370" cy="224" r="11" fill="#d98a1c"/><text x="370" y="229" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">4</text><text x="392" y="229" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Shared criteria</text><circle cx="370" cy="258" r="11" fill="#d98a1c"/><text x="370" y="263" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">5</text><text x="392" y="263" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Agreed way of working</text><rect x="24" y="312" width="592" height="72" rx="12" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><text x="320" y="340" font-size="15" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">No-mediation zone</text><text x="320" y="364" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Harassment, violence, fraud, safety danger → report via the process</text></svg>