<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Comparing interview questions, hypothetical. Left, leading questions in red: Would you like a booking app? Would you pay a monthly fee for it? Right, questions about the past in green: When did you last book an appointment? How did you do it? How much time did it take?"><title>Comparing interview questions, hypothetical. Left, leading questions in red: Would you like a booking app? Would you pay a monthly fee for it? Right, questions about the past in green: When did you last book an appointment? How did you do it? How much time did it take?</title><rect width="640" height="400" rx="18" fill="#fdf8ef"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ask about the future or the past?</text><rect x="24" y="56" width="280" height="286" rx="14" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><text x="164" y="88" font-size="16" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Leading questions</text><text x="164" y="132" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Would you like</text><text x="164" y="166" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">a booking app?</text><text x="164" y="234" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Would you pay a</text><text x="164" y="268" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">monthly fee for it?</text><text x="164" y="322" font-size="15" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">→ get praise</text><rect x="336" y="56" width="280" height="286" rx="14" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="476" y="88" font-size="16" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Questions about the past</text><text x="476" y="132" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">When did you last</text><text x="476" y="166" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">book an appointment?</text><text x="476" y="200" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">How did you do it?</text><text x="476" y="234" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">How much time</text><text x="476" y="268" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">did it take?</text><text x="476" y="322" font-size="15" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">→ get facts</text><text x="320" y="376" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Record what customers did, paid and spent time on. Not praise.</text></svg>