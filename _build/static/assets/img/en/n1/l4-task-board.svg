<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="A group Task board on a whiteboard, with 3 columns: Who, What, Done by when. Lily draws 3 job pictures, Tuesday, done. Hugo writes the job names, Tuesday, done. May sticks the pictures on the paper, Wednesday. The whole group checks together, Wednesday."><title>A group Task board on a whiteboard, with 3 columns: Who, What, Done by when. Lily draws 3 job pictures, Tuesday, done. Hugo writes the job names, Tuesday, done. May sticks the pictures on the paper, Wednesday. The whole group checks together, Wednesday.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><rect x="50" y="30" width="540" height="330" rx="12" fill="#fff" stroke="#9aa" stroke-width="6"/><text x="320" y="72" font-size="22" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">GROUP TASK BOARD</text><rect x="70" y="90" width="500" height="36" rx="6" fill="#14524f"/><text x="84" y="114" font-size="16" fill="#fff" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Who</text><text x="214" y="114" font-size="16" fill="#fff" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">What</text><text x="434" y="114" font-size="16" fill="#fff" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Done by when</text><rect x="70" y="136" width="500" height="44" rx="6" fill="#ffe08a" opacity=".55"/><text x="84" y="164" font-size="16" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Lily</text><text x="214" y="164" font-size="16" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Draw 3 job pictures</text><text x="434" y="164" font-size="16" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tuesday</text><rect x="540" y="148" width="20" height="20" rx="4" fill="#fff" stroke="#14524f" stroke-width="2"/><path d="M544,158 l5,6 l9,-12" stroke="#14524f" stroke-width="3" fill="none"/><rect x="70" y="188" width="500" height="44" rx="6" fill="#bfe3ff" opacity=".55"/><text x="84" y="216" font-size="16" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hugo</text><text x="214" y="216" font-size="16" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Write the job names</text><text x="434" y="216" font-size="16" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tuesday</text><rect x="540" y="200" width="20" height="20" rx="4" fill="#fff" stroke="#14524f" stroke-width="2"/><path d="M544,210 l5,6 l9,-12" stroke="#14524f" stroke-width="3" fill="none"/><rect x="70" y="240" width="500" height="44" rx="6" fill="#c8f0c4" opacity=".55"/><text x="84" y="268" font-size="16" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">May</text><text x="214" y="268" font-size="16" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Stick pictures on</text><text x="434" y="268" font-size="16" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Wednesday</text><rect x="540" y="252" width="20" height="20" rx="4" fill="#fff" stroke="#14524f" stroke-width="2"/><rect x="70" y="292" width="500" height="44" rx="6" fill="#f5d0f0" opacity=".55"/><text x="84" y="320" font-size="16" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Everyone</text><text x="214" y="320" font-size="16" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Check together</text><text x="434" y="320" font-size="16" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Wednesday</text><rect x="540" y="304" width="20" height="20" rx="4" fill="#fff" stroke="#14524f" stroke-width="2"/><rect x="270" y="360" width="100" height="14" rx="4" fill="#9aa"/></svg>