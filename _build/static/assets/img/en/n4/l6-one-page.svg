<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="A hypothetical one-page project plan for next-day city delivery. Six boxes: goal, scope in and out, four milestones, roles, a dependency on the IT team, three risks. Below is a milestone progress bar: milestone 1 done in green, milestone 2 late in orange."><title>A hypothetical one-page project plan for next-day city delivery. Six boxes: goal, scope in and out, four milestones, roles, a dependency on the IT team, three risks. Below is a milestone progress bar: milestone 1 done in green, milestone 2 late in orange.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="28" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">One-page project (hypothetical)</text><rect x="30" y="44" width="180" height="100" rx="10" fill="#fff" stroke="#14524f" stroke-width="2"/><text x="44" y="70" font-size="15" fill="#14524f" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Goal</text><text x="44" y="98" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">80% of city orders</text><text x="44" y="116" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">in 1 day, by 31 March</text><rect x="230" y="44" width="180" height="100" rx="10" fill="#fff" stroke="#2563a8" stroke-width="2"/><text x="244" y="70" font-size="15" fill="#2563a8" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Scope</text><text x="244" y="98" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">In: city orders</text><text x="244" y="116" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Out: out-of-town</text><rect x="430" y="44" width="180" height="100" rx="10" fill="#fff" stroke="#d98a1c" stroke-width="2"/><text x="444" y="70" font-size="15" fill="#d98a1c" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Milestones</text><text x="444" y="98" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1 Current process</text><text x="444" y="116" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2 Warehouse by 11:00</text><rect x="30" y="160" width="180" height="100" rx="10" fill="#fff" stroke="#1f7a74" stroke-width="2"/><text x="44" y="186" font-size="15" fill="#1f7a74" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Roles</text><text x="44" y="214" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">One person</text><text x="44" y="232" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">responsible per task</text><rect x="230" y="160" width="180" height="100" rx="10" fill="#fff" stroke="#b03a2e" stroke-width="2"/><text x="244" y="186" font-size="15" fill="#b03a2e" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Dependency</text><text x="244" y="214" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">IT changes order</text><text x="244" y="232" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">cut-off, by week 3</text><rect x="430" y="160" width="180" height="100" rx="10" fill="#fff" stroke="#5b6b73" stroke-width="2"/><text x="444" y="186" font-size="15" fill="#5b6b73" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Risks</text><text x="444" y="214" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">IT late · Few vans</text><text x="444" y="232" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">· Warehouse overload</text><text x="30" y="300" font-size="14" fill="#14524f" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Milestone bar</text><rect x="30" y="312" width="140" height="30" rx="6" fill="#1e7d4f"/><text x="100" y="332" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Milestone 1</text><text x="100" y="362" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Done</text><rect x="178" y="312" width="140" height="30" rx="6" fill="#d98a1c"/><text x="248" y="332" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Milestone 2</text><text x="248" y="362" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-seri