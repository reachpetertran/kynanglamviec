<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Three ways to renew a career, hypothetical, for a quality engineer with 8 years of experience. Deeper: expert in quality management systems. Broader: lead cross-team improvement projects and mentor new engineers. New direction: become an auditor for a certification body. In the middle are the transferable skills: systems thinking, deciding, persuading, mentoring, reading regulations."><title>Three ways to renew a career, hypothetical, for a quality engineer with 8 years of experience. Deeper: expert in quality management systems. Broader: lead cross-team improvement projects and mentor new engineers. New direction: become an auditor for a certification body. In the middle are the transferable skills: systems thinking, deciding, persuading, mentoring, reading regulations.</title><rect width="640" height="400" rx="18" fill="#fdf8ef"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Three ways to renew your career</text><circle cx="320" cy="215" r="80" fill="#14524f"/><text x="320" y="178" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Transferable</text><text x="320" y="195" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">skills</text><text x="320" y="222" font-size="11" fill="#e3f0ee" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">systems · deciding</text><text x="320" y="237" font-size="11" fill="#e3f0ee" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">persuading · mentoring</text><text x="320" y="252" font-size="11" fill="#e3f0ee" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">projects · reading rules</text><rect x="30" y="60" width="180" height="78" rx="12" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="120" y="86" font-size="15" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Deeper</text><text x="120" y="108" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Expert in quality</text><text x="120" y="124" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">management systems</text><line x1="240" y1="180" x2="120" y2="138" stroke="#1e7d4f" stroke-width="2.5" stroke-dasharray="6 4"/><rect x="430" y="60" width="180" height="78" rx="12" fill="#e8f0fa" stroke="#2563a8" stroke-width="2"/><text x="520" y="86" font-size="15" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Broader</text><text x="520" y="108" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Cross-team projects,</text><text x="520" y="124" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">mentor new engineers</text><line x1="400" y1="180" x2="520" y2="138" stroke="#2563a8" stroke-width="2.5" stroke-dasharray="6 4"/><rect x="230" y="312" width="180" height="78" rx="12" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="320" y="338" font-size="15" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">New direction</text><text x="320" y="360" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Certification body</text><text x="320" y="376" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">auditor (test small first)</text><line x1="320" y1="295" x2="320" y2="312" stroke="#d98a1c" stroke-width="2.5" stroke-dasharray="6 4"/></svg>