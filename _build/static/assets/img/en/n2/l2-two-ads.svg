<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Two hypothetical job ads side by side. The left ad states the work, shift, pay and address. The right ad shows three signs to stop: very high pay with vague work, a uniform fee, handing over an original ID card."><title>Two hypothetical job ads side by side. The left ad states the work, shift, pay and address. The right ad shows three signs to stop: very high pay with vague work, a uniform fee, handing over an original ID card.</title><rect width="640" height="400" rx="18" fill="#f4f7f6"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Two job ads (hypothetical)</text><rect x="24" y="50" width="286" height="328" rx="12" fill="#fff" stroke="#1e7d4f" stroke-width="2"/><rect x="24" y="50" width="286" height="34" rx="12" fill="#e6f4ec"/><text x="167" y="73" font-size="15" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ad A · Clear</text><text x="36" y="112" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Work:</text><text x="110" y="112" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">serve, clear tables, take orders</text><text x="36" y="146" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Shift:</text><text x="110" y="146" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">18:00–22:00, pick 3 a week</text><text x="36" y="180" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Pay:</text><text x="110" y="180" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">hourly rate stated, paid monthly</text><text x="36" y="214" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Required:</text><text x="110" y="214" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">aged 18+, can ride a scooter</text><text x="36" y="248" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Preferred:</text><text x="110" y="248" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">serving experience</text><text x="36" y="282" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Address:</text><text x="110" y="282" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">number, street, district</text><text x="36" y="316" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Contact:</text><text x="110" y="316" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">café manager, office hours</text><rect x="102" y="199" width="200" height="22" rx="5" fill="none" stroke="#1e7d4f" stroke-dasharray="4 3"/><text x="167" y="366" font-size="12" fill="#1e7d4f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Required and preferred kept apart</text><rect x="330" y="50" width="286" height="328" rx="12" fill="#fff" stroke="#b03a2e" stroke-width="2"/><rect x="330" y="50" width="286" height="34" rx="12" fill="#fbe9e7"/><text x="473" y="73" font-size="15" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ad B · Stop and check</text><text x="342" y="112" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Work:</text><text x="414" y="112" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">&quot;easy work from home&quot;</text><text x="342" y="150" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Pay:</text><text x="414" y="150" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">&quot;very high income&quot;</text><text x="342" y="188" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Required:</text><text x="414" y="188" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">no experience needed</text><text x="342" y="226" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Process:</text><text x="414" y="226" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">pay a uniform fee</text><text x="342" y="264" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif"></text><text x="414" y="264" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">hand over original ID</text><text x="342" y="302" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Contact:</text><text x="414" y="302" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">messages only, no address</text><circle cx="604" cy="107" r="8" fill="#b03a2e"/><text x="600" y="111" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">!</text><circle cx="604" cy="145" r="8" fill="#b03a2e"/><text x="600" y="149" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">!</text><circle cx="604" cy="221" r="8" fill="#b03a2e"/><text x="600" y="225" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">!</text><circle cx="604" cy="259" r="8" fill="#b03a2e"/><text x="600" y="263" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">!</text><circle cx="604" cy="297" r="8" fill="#b03a2e"/><text x="600" y="301" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">!</text><text x="473" y="366" font-size="12" fill="#b03a2e" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Vague · asks for money · keeps originals</text></svg>