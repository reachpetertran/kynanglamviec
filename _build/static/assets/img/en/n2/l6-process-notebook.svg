<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="A handwritten process notebook page: making peach, orange and lemongrass iced tea, numbered steps, a common mistakes box, and three review boxes for 1, 3 and 7 days, two of them ticked."><title>A handwritten process notebook page: making peach, orange and lemongrass iced tea, numbered steps, a common mistakes box, and three review boxes for 1, 3 and 7 days, two of them ticked.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><rect x="120" y="20" width="400" height="360" rx="8" fill="#fffdf6" stroke="#d8cfae" stroke-width="1.5"/><path d="M140,78 L500,78" stroke="#e9e1c7"/><path d="M140,100 L500,100" stroke="#e9e1c7"/><path d="M140,122 L500,122" stroke="#e9e1c7"/><path d="M140,144 L500,144" stroke="#e9e1c7"/><path d="M140,166 L500,166" stroke="#e9e1c7"/><path d="M140,188 L500,188" stroke="#e9e1c7"/><path d="M140,210 L500,210" stroke="#e9e1c7"/><path d="M140,232 L500,232" stroke="#e9e1c7"/><path d="M140,254 L500,254" stroke="#e9e1c7"/><path d="M140,276 L500,276" stroke="#e9e1c7"/><path d="M140,298 L500,298" stroke="#e9e1c7"/><path d="M140,320 L500,320" stroke="#e9e1c7"/><path d="M140,342 L500,342" stroke="#e9e1c7"/><path d="M140,364 L500,364" stroke="#e9e1c7"/><path d="M170,20 L170,380" stroke="#e7b3a9" stroke-width="1.5"/><text x="184" y="54" font-size="14" fill="#14524f" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Process: Peach lemongrass tea (hypothetical)</text><text x="184" y="96" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1. Wash hands, take a size M cup</text><text x="184" y="118" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2. Add 30 ml peach syrup</text><text x="184" y="140" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3. Add tea to line 2</text><text x="184" y="162" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">4. Ice to line 3, shake 10 times</text><text x="184" y="184" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">5. Add peach, orange, lemongrass</text><text x="184" y="206" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">6. Seal lid, add time sticker</text><rect x="184" y="236" width="300" height="64" rx="8" fill="#fbe9e7" stroke="#b03a2e" stroke-width="1.5"/><text x="196" y="256" font-size="13" fill="#b03a2e" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Common mistakes</text><text x="196" y="276" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">No shake → weak tea at the bottom</text><text x="196" y="294" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ice before syrup → syrup won&#x27;t mix</text><text x="184" y="330" font-size="13" fill="#14524f" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Recall, no notes:</text><rect x="312" y="316" width="18" height="18" rx="3" fill="#fff" stroke="#14524f" stroke-width="2"/><path d="M315,325 l5,5 l8,-10" fill="none" stroke="#1e7d4f" stroke-width="3"/><text x="336" y="330" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1 day</text><rect x="378" y="316" width="18" height="18" rx="3" fill="#fff" stroke="#14524f" stroke-width="2"/><path d="M381,325 l5,5 l8,-10" fill="none" stroke="#1e7d4f" stroke-width="3"/><text x="402" y="330" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3 days</text><rect x="444" y="316" width="18" height="18" rx="3" fill="#fff" stroke="#14524f" stroke-width="2"/><text x="468" y="330" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">7 days</text></svg>