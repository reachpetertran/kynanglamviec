<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Two views when estimating the time to open 20 shops, hypothetical. Inside view: the plan says 6 months. Outside view: 6 previous expansions took 8 to 11 months, with the middle at about 9 months. The base estimate should start from 9 months, then be adjusted for specific differences."><title>Two views when estimating the time to open 20 shops, hypothetical. Inside view: the plan says 6 months. Outside view: 6 previous expansions took 8 to 11 months, with the middle at about 9 months. The base estimate should start from 9 months, then be adjusted for specific differences.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Estimating the time to open 20 shops</text><rect x="24" y="52" width="280" height="120" rx="12" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="164" y="80" font-size="15" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Inside view</text><text x="164" y="112" font-size="13" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">The plan says</text><text x="164" y="148" font-size="26" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">6 months</text><rect x="336" y="52" width="280" height="120" rx="12" fill="#e8f0fa" stroke="#2563a8" stroke-width="2"/><text x="476" y="80" font-size="15" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Outside view</text><text x="476" y="112" font-size="13" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">6 past expansions</text><text x="476" y="148" font-size="24" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">8 – 11 months</text><line x1="60" y1="300" x2="580.0" y2="300" stroke="#5b6b73" stroke-width="2"/><text x="60.0" y="320" font-size="11.5" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">0</text><text x="146.66666666666669" y="320" font-size="11.5" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2</text><text x="233.33333333333334" y="320" font-size="11.5" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">4</text><text x="320.0" y="320" font-size="11.5" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">6</text><text x="406.6666666666667" y="320" font-size="11.5" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">8</text><text x="493.33333333333337" y="320" font-size="11.5" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">10</text><text x="580.0" y="320" font-size="11.5" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">12</text><text x="320" y="340" font-size="11.5" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">months</text><circle cx="406.6666666666667" cy="270" r="8" fill="#2563a8" opacity="0.8"/><circle cx="450.0" cy="255" r="8" fill="#2563a8" opacity="0.8"/><circle cx="450.0" cy="240" r="8" fill="#2563a8" opacity="0.8"/><circle cx="493.33333333333337" cy="270" r="8" fill="#2563a8" opacity="0.8"/><circle cx="536.6666666666667" cy="255" r="8" fill="#2563a8" opacity="0.8"/><circle cx="406.6666666666667" cy="240" r="8" fill="#2563a8" opacity="0.8"/><line x1="320.0" y1="210" x2="320.0" y2="300" stroke="#d98a1c" stroke-width="3" stroke-dasharray="6 4"/><text x="320.0" y="202" font-size="12" fill="#d98a1c" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">plan</text><line x1="450.0" y1="210" x2="450.0" y2="300" stroke="#1e7d4f" stroke-width="3"/><text x="450.0" y="202" font-size="12" fill="#1e7d4f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">middle ≈ 9</text><rect x="24" y="352" width="592" height="36" rx="10" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="1.5"/><text x="320" y="376" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Start from 9 months, then adjust for specific, reasoned differences</text></svg>