<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="The path of bad news, hypothetical. Left: news from the front line passes through a team leader, a department head and a division director; each level filters it, and the leadership team only hears that everything is fine. Right: with a bad-news channel, news about safety, major clients, legal and finance reaches the leadership team within 48 hours, with a route to skip a level."><title>The path of bad news, hypothetical. Left: news from the front line passes through a team leader, a department head and a division director; each level filters it, and the leadership team only hears that everything is fine. Right: with a bad-news channel, news about safety, major clients, legal and finance reaches the leadership team within 48 hours, with a route to skip a level.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">How bad news travels</text><text x="164" y="60" font-size="15" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">No channel</text><rect x="64" y="72" width="200" height="38" rx="10" fill="#fbe9e7" stroke="#b03a2e" stroke-width="1.5"/><text x="164" y="96" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Leadership team</text><rect x="64" y="124" width="200" height="38" rx="10" fill="#fff" stroke="#b03a2e" stroke-width="1.5"/><text x="164" y="148" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Division director</text><rect x="64" y="176" width="200" height="38" rx="10" fill="#fff" stroke="#b03a2e" stroke-width="1.5"