<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="One strategic priority shared among three divisions, hypothetical. Priority: city delivery in under 24 hours by June. Warehouse: orders picked within 4 hours. Transport: 95% of trips on time. Technology: orders flow automatically from the website to the warehouse. Two dependency arrows: the warehouse needs technology, transport needs the warehouse. Each dependency has a coordinator."><title>One strategic priority shared among three divisions, hypothetical. Priority: city delivery in under 24 hours by June. Warehouse: orders picked within 4 hours. Transport: 95% of trips on time. Technology: orders flow automatically from the website to the warehouse. Two dependency arrows: the warehouse needs technology, transport needs the warehouse. Each dependency has a coordinator.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">One priority, three divisions, two dependencies</text><rect x="110" y="50" width="420" height="60" rx="12" fill="#e8f0fa" stroke="#2563a8" stroke-width="2"/><text x="320" y="74" font-size="13" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Priority</text><text x="320" y="96" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">City delivery in under 24 hours by June</text><line x1="320" y1="110" x2="112" y2="168" stroke="#1f7a74" stroke-width="2"/><circle cx="112" cy="168" r="4.5" fill="#1f7a74"/><rect x="24" y="172" width="176" height="82" rx="12" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="112" y="200" font-size="15" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Warehouse</text><text x="112" y="228" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Orders picked in 4 hours</text><line x1="320" y1="110" x2="320" y2="168" stroke="#1f7a74" stroke-width="2"/><circle cx="320" cy="168" r="4.5" fill="#1f7a74"/><rect x="232" y="172" width="176" height="82" rx="12" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="320" y="200" font-size="15" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Transport</text><text x="320" y="228" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">95% of trips on time</text><line x1="320" y1="110" x2="528" y2="168" stroke="#1f7a74" stroke-width="2"/><circle cx="528" cy="168" r="4.5" fill="#1f7a74"/><rect x="440" y="172" width="176" height="82" rx="12" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="528" y="200" font-size="15" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Technology</text><text x="528" y="228" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Orders flow web → warehouse</text><path d="M 528 256 C 480 330, 160 330, 112 256" fill="none" stroke="#b03a2e" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="112" cy="256" r="5" fill="#b03a2e"/><circle cx="320" cy="311" r="12" fill="#b03a2e"/><text x="320" y="316" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1</text><path d="M 112 256 C 140 286, 290 286, 320 256" fill="none" stroke="#d98a1c" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="320" cy="256" r="5" fill="#d98a1c"/><circle cx="216" cy="278" r="12" fill="#d98a1c"/><text x="216" y="283" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2</text><rect x="24" y="330" width="592" height="62" rx="10" fill="#fdf3e2" stroke="#d98a1c" stroke-width="1.5"/><text x="320" y="350" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Dependencies: (1) Warehouse needs Technology · (2) Transport needs Warehouse</text><text x="320" y="368" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Each dependency has a named coordinator</text><text x="320" y="385" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Monthly review: continue · change approach · stop</text></svg>