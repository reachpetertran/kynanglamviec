<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Three places with the same problem: a supermarket restocking shelves, a drinks bar using two ingredient boxes, a hospital ward&#x27;s medicine cupboard. Arrows lead to one shared principle: use two boxes; when the first is empty, it is the signal to fetch more, while the second is in use. The principle is applied to a sewing line, hypothetical."><title>Three places with the same problem: a supermarket restocking shelves, a drinks bar using two ingredient boxes, a hospital ward's medicine cupboard. Arrows lead to one shared principle: use two boxes; when the first is empty, it is the signal to fetch more, while the second is in use. The principle is applied to a sewing line, hypothetical.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Borrow a principle from three other fields</text><rect x="24" y="50" width="180" height="70" rx="12" fill="#fff" stroke="#2563a8" stroke-width="2"/><text x="114" y="78" font-size="14.5" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Supermarket</text><text x="114" y="100" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">restocking shelves</text><line x1="114" y1="120" x2="320" y2="160" stroke="#2563a8" stroke-width="2"/><circle cx="320" cy="160" r="4.5" fill="#2563a8"/><rect x="230" y="50" width="180" height="70" rx="12" fill="#fff" stroke="#2563a8" stroke-width="2"/><text x="320" y="78" font-size="14.5" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Drinks bar</text><text x="320" y="100" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">two ingredient boxes</text><line x1="320" y1="120" x2="320" y2="160" stroke="#2563a8" stroke-width="2"/><circle cx="320" cy="160" r="4.5" fill="#2563a8"/><rect x="436" y="50" width="180" height="70" rx="12" fill="#fff" stroke="#2563a8" stroke-width="2"/><text x="526" y="78" font-size="14.5" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hospital</text><text x="526" y="100" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">ward medicine cupboard</text><line x1="526" y1="120" x2="320" y2="160" stroke="#2563a8" stroke-width="2"/><circle cx="320" cy="160" r="4.5" fill="#2563a8"/><rect x="150" y="164" width="340" height="116" rx="14" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2.5"/><text x="320" y="188" font-size="15" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Principle: use two boxes</text><rect x="196" y="204" width="98" height="46" rx="6" fill="#fff" stroke="#1d2a33" stroke-width="2"/><rect x="218" y="216" width="54" height="22" rx="4" fill="#b03a2e"/><text x="245" y="232" font-size="11" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">refill</text><text x="245" y="268" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Box 1: empty</text><rect x="346" y="204" width="98" height="46" rx="6" fill="#fff" stroke="#1d2a33" stroke-width="2"/><circle cx="360" cy="232" r="6" fill="#1f7a74"/><circle cx="374" cy="232" r="6" fill="#1f7a74"/><circle cx="388" cy="232" r="6" fill="#1f7a74"/><circle cx="402" cy="232" r="6" fill="#1f7a74"/><circle cx="416" cy="232" r="6" fill="#1f7a74"/><circle cx="430" cy="232" r="6" fill="#1f7a74"/><text x="395" y="268" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Box 2: in use</text><line x1="320" y1="280" x2="320" y2="306" stroke="#d98a1c" stroke-width="3"/><circle cx="320" cy="306" r="4.5" fill="#d98a1c"/><rect x="120" y="308" width="400" height="72" rx="14" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="320" y="334" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">On the sewing line: thread, buttons, labels</text><text x="320" y="354" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">An empty box is the signal; the line never stops</text></svg>