<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="A phone screen with a message pretending to be from the director, hypothetical. A new account with the director&#x27;s photo writes: urgently transfer 45,000 to a partner, I&#x27;m in a meeting and can&#x27;t take calls, done before 11. Three red marks point to three signs: asking for money, urgency, blocking a confirmation call. Beside it are three steps: stop, call the saved number, tell the chief accountant."><title>A phone screen with a message pretending to be from the director, hypothetical. A new account with the director's photo writes: urgently transfer 45,000 to a partner, I'm in a meeting and can't take calls, done before 11. Three red marks point to three signs: asking for money, urgency, blocking a confirmation call. Beside it are three steps: stop, call the saved number, tell the chief accountant.</title><rect width="640" height="400" rx="18" fill="#fdf8ef"/><text x="320" y="30" font-size="18.5" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Three warning signs in one message (hypothetical)</text><rect x="40" y="46" width="250" height="342" rx="26" fill="#1d2a33"/><rect x="52" y="62" width="226" height="310" rx="14" fill="#fff"/><circle cx="80" cy="88" r="15" fill="#1f7a74"/><text x="102" y="86" font-size="11.5" fill="#1d2a33" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Director (new account)</text><text x="102" y="101" font-size="10" fill="#5b6b73" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">just now</text><rect x="64" y="118" width="202" height="122" rx="12" fill="#eef2f1"/><text x="76" y="140" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Alex, urgently send 45,000</text><text x="76" y="162" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">to a partner, this account.</text><text x="76" y="184" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">I'm in a meeting, can't</text><text x="76" y="206" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">take calls.</text><text x="76" y="228" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Done before 11, OK?</text><line x1="266" y1="147" x2="318" y2="147" stroke="#b03a2e" stroke-width="2"/><circle cx="330" cy="147" r="12" fill="#b03a2e"/><text x="330" y="152" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1</text><text x="350" y="152" font-size="13.5" fill="#b03a2e" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Asks for money</text><line x1="266" y1="224" x2="318" y2="224" stroke="#b03a2e" stroke-width="2"/><circle cx="330" cy="224" r="12" fill="#b03a2e"/><text x="330" y="229" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2</text><text x="350" y="229" font-size="13.5" fill="#b03a2e" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Urgency</text><line x1="266" y1="191" x2="318" y2="191" stroke="#b03a2e" stroke-width="2"/><circle cx="330" cy="191" r="12" fill="#b03a2e"/><text x="330" y="196" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3</text><text x="350" y="196" font-size="13.5" fill="#b03a2e" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Blocks a check call</text><rect x="338" y="262" width="286" height="118" rx="14" fill="#fff" stroke="#1e7d4f" stroke-width="2"/><text x="481" y="286" font-size="14" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Alex takes 3 steps</text><text x="354" y="314" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1. Stop: no transfer, no reply</text><text x="354" y="338" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2. Call the director's saved number</text><text x="354" y="362" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3. Tell chief accountant, warn team</text><rect x="64" y="252" width="202" height="30" rx="15" fill="#fff" stroke="#c9d6d4"/><text x="165" y="272" font-size="11" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Type a message…</text></svg>