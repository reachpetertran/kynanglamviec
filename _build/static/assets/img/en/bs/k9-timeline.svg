<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Timeline of an afternoon reorganising a linen store, hypothetical. 13:00 a 3-sentence proposal and 3 pairs: sorting, folding, shelving and labelling. 15:00 checking each pair&#x27;s progress; the folding pair is behind and the coordinator goes to help. 17:00 telling the supervisor it is done and thanking the whole group."><title>Timeline of an afternoon reorganising a linen store, hypothetical. 13:00 a 3-sentence proposal and 3 pairs: sorting, folding, shelving and labelling. 15:00 checking each pair's progress; the folding pair is behind and the coordinator goes to help. 17:00 telling the supervisor it is done and thanking the whole group.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="18.5" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Coordinating an afternoon in the store (hypothetical)</text><line x1="60" y1="84" x2="590" y2="84" stroke="#14524f" stroke-width="4"/><circle cx="80" cy="84" r="11" fill="#d98a1c" stroke="#fff" stroke-width="3"/><text x="80" y="62" font-size="14" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">13:00</text><text x="80" y="112" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Propose, share tasks</text><circle cx="330" cy="84" r="11" fill="#d98a1c" stroke="#fff" stroke-width="3"/><text x="330" y="62" font-size="14" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">15:00</text><text x="330" y="112" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Check progress</text><circle cx="570" cy="84" r="11" fill="#d98a1c" stroke="#fff" stroke-width="3"/><text x="570" y="62" font-size="14" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">17:00</text><text x="570" y="112" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Close, thanks</text><text x="60" y="142" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Pair 1: sort</text><rect x="60" y="150" width="530" height="22" rx="11" fill="#e1eae8"/><rect x="60" y="150" width="270.0" height="22" rx="11" fill="#1f7a74"/><text x="60" y="204" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Pair 2: fold</text><rect x="60" y="212" width="530" height="22" rx="11" fill="#e1eae8"/><rect x="60" y="212" width="148.5" height="22" rx="11" fill="#d98a1c"/><text x="60" y="266" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Pair 3: shelve, label</text><rect x="60" y="274" width="530" height="22" rx="11" fill="#e1eae8"/><rect x="60" y="274" width="243.0" height="22" rx="11" fill="#2563a8"/><line x1="330" y1="128" x2="330" y2="300" stroke="#b03a2e" stroke-width="2" stroke-dasharray="5 4"/><rect x="346" y="180" width="240" height="28" rx="8" fill="#fbe9e7" stroke="#b03a2e" stroke-width="1.6"/><text x="466" y="199" font-size="12" fill="#b03a2e" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Behind → finish own part, go help</text><rect x="40" y="318" width="560" height="64" rx="12" fill="#fff" stroke="#1e7d4f" stroke-width="2"/><text x="32