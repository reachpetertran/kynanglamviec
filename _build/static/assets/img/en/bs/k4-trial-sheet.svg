<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Lan&#x27;s small trial sheet, hypothetical, with 4 boxes: old way, tools kept in a drawer; new way, tape and scissors hung on a rack; measure minutes for 10 orders; try for 3 shifts. On the right, two bars compare before, about 25 minutes, and after, about 20 minutes."><title>Lan's small trial sheet, hypothetical, with 4 boxes: old way, tools kept in a drawer; new way, tape and scissors hung on a rack; measure minutes for 10 orders; try for 3 shifts. On the right, two bars compare before, about 25 minutes, and after, about 20 minutes.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Lan's small trial sheet (hypothetical)</text><rect x="22" y="52" width="176" height="148" rx="12" fill="#fff" stroke="#5b6b73" stroke-width="2"/><rect x="22" y="52" width="176" height="34" rx="12" fill="#5b6b73" fill-opacity=".16"/><text x="110" y="75" font-size="14" fill="#5b6b73" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Old way</text><text x="110" y="126" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tools kept</text><text x="110" y="146" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">in a drawer</text><rect x="208" y="52" width="176" height="148" rx="12" fill="#fff" stroke="#d98a1c" stroke-width="2"/><rect x="208" y="52" width="176" height="34" rx="12" fill="#d98a1c" fill-opacity=".16"/><text x="296" y="75" font-size="14" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">New way</text><text x="296" y="126" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hang tape and</text><text x="296" y="146" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">scissors on rack</text><rect x="22" y="212" width="176" height="148" rx="12" fill="#fff" stroke="#2563a8" stroke-width="2"/><rect x="22" y="212" width="176" height="34" rx="12" fill="#2563a8" fill-opacity=".16"/><text x="110" y="235" font-size="14" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Measure</text><text x="110" y="286" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Minutes for</text><text x="110" y="306" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">10 orders</text><rect x="208" y="212" width="176" height="148" rx="12" fill="#fff" stroke="#1f7a74" stroke-width="2"/><rect x="208" y="212" width="176" height="34" rx="12" fill="#1f7a74" fill-opacity=".16"/><text x="296" y="235" font-size="14" fill="#1f7a74" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">How long</text><text x="296" y="296" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3 shifts</text><rect x="398" y="52" width="222" height="308" rx="12" fill="#fff" stroke="#9fb9b6" stroke-width="1.5"/><text x="509" y="78" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Minutes for 10 orders</text><rect x="438" y="110.0" width="56" height="210.0" rx="6" fill="#5b6b73"/><text x="466" y="102.0" font-size="15" fill="#5b6b73" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">~25</text><text x="466" y="342" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Before</text><rect x="530" y="152.0" width="56" height="168.0" rx="6" fill="#1e7d4f"/><text x="558" y="144.0" font-size="15" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">~20</text><text x="558" y="342" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">After</text><line x1="420" y1="320" x2="600" y2="320" stroke="#1d2a33" stroke-width="1.5"/><text x="320" y="388" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Change one thing · measure before and after · try enough times</text></svg>