<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="A hypothetical file for a 90-day review. On the left are the six sheets of the 90-day notebook. An arrow leads to the right: three STAR examples with numbers, the I can self-assessment, two questions for your manager, three goals for the next 90 days."><title>A hypothetical file for a 90-day review. On the left are the six sheets of the 90-day notebook. An arrow leads to the right: three STAR examples with numbers, the I can self-assessment, two questions for your manager, three goals for the next 90 days.</title><rect width="640" height="400" rx="18" fill="#fdf3e2"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">From the 90-day notebook to your review</text><rect x="30" y="56" width="230" height="42" rx="8" fill="#fff" stroke="#1f7a74" stroke-width="1.5"/><text x="46" y="82" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sheet 1 Weekly task board</text><rect x="34" y="108" width="230" height="42" rx="8" fill="#fff" stroke="#1f7a74" stroke-width="1.5"/><text x="50" y="134" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sheet 2 Meeting notes page</text><rect x="38" y="160" width="230" height="42" rx="8" fill="#fff" stroke="#1f7a74" stroke-width="1.5"/><text x="54" y="186" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sheet 3 Customer request log</text><rect x="42" y="212" width="230" height="42" rx="8" fill="#fff" stroke="#1f7a74" stroke-width="1.5"/><text x="58" y="238" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sheet 4 Incident sheet</text><rect x="46" y="264" width="230" height="42" rx="8" fill="#fff" stroke="#1f7a74" stroke-width="1.5"/><text x="62" y="290" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sheet 5 Lessons-learned sheet</text><rect x="50" y="316" width="230" height="42" rx="8" fill="#fff" stroke="#1f7a74" stroke-width="1.5"/><text x="66" y="342" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sheet 6 Coordination map</text><line x1="280" y1="214" x2="330" y2="214" stroke="#d98a1c" stroke-width="2.5"/><circle cx="330" cy="214" r="4.5" fill="#d98a1c"/><rect x="340" y="56" width="270" height="320" rx="14" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="475" y="84" font-size="15" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Bring to your review</text><rect x="358" y="110" width="16" height="16" rx="3" fill="#fff" stroke="#d98a1c" stroke-width="2"/><text x="384" y="124" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3 STAR examples with numbers</text><rect x="358" y="160" width="16" height="16" rx="3" fill="#fff" stroke="#d98a1c" stroke-width="2"/><text x="384" y="174" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">&quot;I can…&quot; self-assessment</text><rect x="358" y="210" width="16" height="16" rx="3" fill="#fff" stroke="#d98a1c" stroke-width="2"/><text x="384" y="224" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1 strength, 1 area to improve</text><rect x="358" y="260" width="16" height="16" rx="3" fill="#fff" stroke="#d98a1c" stroke-width="2"/><text x="384" y="274" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2 questions for your manager</text><rect x="358" y="310" width="16" height="16" rx="3" fill="#fff" stroke="#d98a1c" stroke-width="2"/><text x="384" y="324" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3 goals for the next 90 days</text></svg>