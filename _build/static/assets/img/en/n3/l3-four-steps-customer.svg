<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Four steps for handling a customer request, hypothetical: listen fully, confirm the need, give an option and a time, follow up until done. On the left, an external customer at an appliance store. On the right, an internal customer, a colleague from accounts."><title>Four steps for handling a customer request, hypothetical: listen fully, confirm the need, give an option and a time, follow up until done. On the left, an external customer at an appliance store. On the right, an internal customer, a colleague from accounts.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Four steps for every customer</text><rect x="30" y="56" width="136" height="92" rx="12" fill="#fff" stroke="#1f7a74" stroke-width="2"/><circle cx="52" cy="80" r="13" fill="#14524f"/><text x="52" y="85" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1</text><text x="112" y="86" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Listen fully</text><text x="98" y="132" font-size="11.5" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Do not interrupt</text><line x1="166" y1="102" x2="180" y2="102" stroke="#1f7a74" stroke-width="2.5"/><circle cx="180" cy="102" r="4.5" fill="#1f7a74"/><rect x="182" y="56" width="136" height="92" rx="12" fill="#fff" stroke="#1f7a74" stroke-width="2"/><circle cx="204" cy="80" r="13" fill="#14524f"/><text x="204" y="85" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2</text><text x="264" y="86" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Confirm</text><text x="250" y="132" font-size="11.5" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sum up the need</text><line x1="318" y1="102" x2="332" y2="102" stroke="#1f7a74" stroke-width="2.5"/><circle cx="332" cy="102" r="4.5" fill="#1f7a74"/><rect x="334" y="56" width="136" height="92" rx="12" fill="#fff" stroke="#1f7a74" stroke-width="2"/><circle cx="356" cy="80" r="13" fill="#14524f"/><text x="356" y="85" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3</text><text x="416" y="86" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Option + time</text><text x="402" y="132" font-size="11.5" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Within your authority</text><line x1="470" y1="102" x2="484" y2="102" stroke="#1f7a74" stroke-width="2.5"/><circle cx="484" cy="102" r="4.5" fill="#1f7a74"/><rect x="486" y="56" width="136" height="92" rx="12" fill="#fff" stroke="#1f7a74" stroke-width="2"/><circle cx="508" cy="80" r="13" fill="#14524f"/><text x="508" y="85" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">4</text><text x="568" y="86" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Follow up</text><text x="554" y="132" font-size="11.5" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Report when done</text><rect x="30" y="170" width="284" height="206" rx="12" fill="#e8f0fa" stroke="#2563a8" stroke-width="2"/><text x="172" y="196" font-size="15" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">External customer</text><text x="46" y="224" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Customer: &quot;My new washing machine</text><text x="46" y="246" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">is really loud. I want a new one.&quot;</text><text x="46" y="268" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Me: &quot;So it has been loud since the first</text><text x="46" y="290" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">wash, and you want it replaced?&quot;</text><text x="46" y="312" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Technician visits at 10:00 tomorrow;</text><text x="46" y="334" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">I will call you in the afternoon.</text><rect x="326" y="170" width="284" height="206" rx="12" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="468" y="196" font-size="15" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Internal customer</text><text x="342" y="224" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Accounts: &quot;Send me the sales table.&quot;</text><text x="342" y="246" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Me: &quot;Which month? By store</text><text x="342" y="268" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">or by salesperson?&quot;</text><text x="342" y="290" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">&quot;October, by store.&quot;</text><text x="342" y="312" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">&quot;OK, I will send the spreadsheet</text><text x="342" y="334" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">before 16:00 today.&quot;</text></svg>