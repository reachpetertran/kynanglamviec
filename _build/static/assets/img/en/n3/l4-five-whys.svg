<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="A hypothetical chain of why questions in a garment workshop. Symptom: a batch of shirts was returned for wrong size labels. Why 1: size M labels were sewn onto size L shirts. Why 2: the two label boxes sat side by side, same colour. Why 3: the label shelf had no separate slots by size. Root cause: no rule for arranging the shelf. Quick fix: recheck the batch. Root fix: slots by size, a colour for each size."><title>A hypothetical chain of why questions in a garment workshop. Symptom: a batch of shirts was returned for wrong size labels. Why 1: size M labels were sewn onto size L shirts. Why 2: the two label boxes sat side by side, same colour. Why 3: the label shelf had no separate slots by size. Root cause: no rule for arranging the shelf. Quick fix: recheck the batch. Root fix: slots by size, a colour for each size.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ask &quot;Why?&quot; until you reach the root cause</text><rect x="30" y="50" width="580" height="40" rx="10" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><text x="320" y="76" font-size="14" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Symptom: a batch of 300 shirts returned for wrong size labels</text><rect x="50" y="104" width="470" height="36" rx="8" fill="#fff" stroke="#1f7a74" stroke-width="1.5"/><text x="66" y="127" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Why? Size M labels were sewn onto size L shirts.</text><rect x="68" y="150" width="470" height="36" rx="8" fill="#fff" stroke="#1f7a74" stroke-width="1.5"/><text x="84" y="173" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Why? The M and L label boxes sit side by side, same colour.</text><rect x="86" y="196" width="470" height="36" rx="8" fill="#fff" stroke="#1f7a74" stroke-width="1.5"/><text x="102" y="219" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Why? The label shelf has no separate slots by size.</text><rect x="104" y="242" width="470" height="36" rx="8" fill="#fff" stroke="#1f7a74" stroke-width="1.5"/><text x="120" y="265" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Why? There is no rule for arranging the label shelf.</text><rect x="30" y="296" width="280" height="84" rx="12" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="170" y="320" font-size="14" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Quick fix (today)</text><text x="170" y="344" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Recheck the whole batch,</text><text x="170" y="361" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">replace wrong labels</text><rect x="330" y="296" width="280" height="84" rx="12" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="470" y="320" font-size="14" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Root fix (so it does not recur)</text><text x="470" y="344" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Shelf slots by size,</text><text x="470" y="361" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">a different colour for each size</text></svg>