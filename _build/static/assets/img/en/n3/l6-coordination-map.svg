<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="A hypothetical coordination map for a new salesperson. In the middle is Me. Around it are four contacts: warehouse, accounts, customer service, team leader. Each contact shows what I need from them and what they need from me."><title>A hypothetical coordination map for a new salesperson. In the middle is Me. Around it are four contacts: warehouse, accounts, customer service, team leader. Each contact shows what I need from them and what they need from me.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Coordination map</text><rect x="40" y="56" width="220" height="92" rx="12" fill="#fff" stroke="#1f7a74" stroke-width="2"/><text x="150" y="80" font-size="14" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Warehouse</text><text x="54" y="106" font-size="11.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Need: stock levels by 9:00</text><text x="52" y="130" font-size="11" fill="#d98a1c" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">They need: orders with item codes</text><line x1="150" y1="148" x2="320" y2="214" stroke="#1f7a74" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="380" y="56" width="220" height="92" rx="12" fill="#fff" stroke="#1f7a74" stroke-width="2"/><text x="490" y="80" font-size="14" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Accounts</text><text x="394" y="106" font-size="11.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Need: payment confirmation</text><text x="392" y="130" font-size="11" fill="#d98a1c" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">They need: invoices on time</text><line x1="490" y1="148" x2="320" y2="214" stroke="#1f7a74" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="40" y="284" width="220" height="92" rx="12" fill="#fff" stroke="#1f7a74" stroke-width="2"/><text x="150" y="308" font-size="14" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Customer service</text><text x="54" y="334" font-size="11.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Need: notes on hard cases</text><text x="52" y="358" font-size="11" fill="#d98a1c" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">They need: exact delivery times</text><line x1="150" y1="284" x2="320" y2="214" stroke="#1f7a74" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="380" y="284" width="220" height="92" rx="12" fill="#fff" stroke="#1f7a74" stroke-width="2"/><text x="490" y="308" font-size="14" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Team leader</text><text x="394" y="334" font-size="11.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Need: priorities when tasks clash</text><text x="392" y="358" font-size="11" fill="#d98a1c" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">They need: early warning of delays</text><line x1="490" y1="284" x2="320" y2="214" stroke="#1f7a74" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="320" cy="214" r="46" fill="#14524f"/><text x="320" y="210" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Me</text><text x="320" y="227" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">(sales)</text></svg>