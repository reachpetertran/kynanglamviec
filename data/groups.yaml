    name: THPT, sinh viên, làm thêm, thực tập
    short: Chuẩn bị đi làm
    audience: Học sinh THPT, sinh viên chưa đi làm, người làm thêm, thực tập sinh, người học nghề.
    levels: "Bậc 1–2"
    intro: >-
      Bạn chuẩn bị bước vào nơi làm việc đầu tiên. Trọng tâm: hiểu mình để chọn hướng,
      viết CV và phỏng vấn, biết quyền và an toàn khi đi làm thêm, giao tiếp và làm nhóm.
    modules: ["Hiểu mình để chọn hướng", "Hồ sơ xin việc đầu tiên (CV, STAR)", "Quyền và an toàn khi đi làm thêm, thực tập", "Giao tiếp ở nơi làm việc đầu tiên", "Học nhanh việc mới", "Làm dự án nhóm hiệu quả"]
    matrix: {K1: ["c", ""], K2: ["c", "email, CV, phỏng vấn"], K3: ["c", ""], K4: ["o", ""], K5: ["c", ""], K6: ["o", ""], K7: ["c", "chọn ngành, thực tập"], K8: ["c", ""], K9: ["o", "lãnh đạo không chức danh"], K10: ["c", "quyền, an toàn khi đi làm; AI cơ bản"]}

