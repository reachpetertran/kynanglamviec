# 7 nhóm người học. N1–N5: file Context mục 2, 3, 5, 6. N6, N7: thêm 14/11/2026 theo yêu cầu của Peter,
# căn cứ báo cáo nghiên cứu ngày 14/11/2026 (project doc claude/khung-n6-n7.md). Học phần là gợi ý [SL].
# matrix: "-" không dạy · "o" giới thiệu · "c" trọng tâm · "a" nâng cao
groups:
  - code: N1
    slug: n1
    name: Học sinh tiểu học, THCS
    short: Khám phá nghề
    audience: Phụ huynh hoặc giáo viên dùng cùng trẻ. Trẻ không tự dùng thiết bị một mình.
    levels: "Bậc 1"
    intro: >-
      Ở tuổi này, mục tiêu là mở rộng hiểu biết về nghề, không phải chọn nghề.
      Trẻ học bốn việc: khám phá nghề quanh mình, thấy rằng ai cũng có thể làm bất kỳ nghề nào,
      làm việc nhóm và giữ cam kết trong nhiệm vụ. Không có trắc nghiệm chọn nghề.
    note: "Site không thu bất kỳ dữ liệu nào của trẻ. Thói quen, giá trị và phẩm chất được dạy ở daynentang.com."
    modules: ["Nghề nghiệp quanh em", "Nghề nào cũng cần kỹ năng", "Ai cũng có thể làm nghề này", "Cùng nhau hoàn thành nhiệm vụ", "Nhận việc và giữ hẹn (THCS)", "Phỏng vấn người làm nghề (THCS)"]
    matrix: {K1: ["o", "nghe và làm theo chỉ dẫn"], K2: ["o", "kể về một nghề"], K3: ["o", "nhờ giúp đúng lúc"], K4: ["o", ""], K5: ["c", "giữ cam kết nhiệm vụ"], K6: ["-", "xem daynentang.com"], K7: ["c", "khám phá nghề"], K8: ["c", "làm nhóm trong nhiệm vụ"], K9: ["-", ""], K10: ["o", "nghề nào cũng dùng công nghệ"]}

  - code: N2
