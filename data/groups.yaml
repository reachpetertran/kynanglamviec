    slug: n4
    name: Senior, chuyên gia
    short: Ảnh hưởng và kèm cặp
    audience: Người có kinh nghiệm, chuyên viên chính, chuyên gia.
    levels: "Bậc 3–4"
    intro: >-
      Bạn làm tốt việc chuyên môn. Bước tiếp theo: tư duy hệ thống, ảnh hưởng không cần chức danh,
      kèm cặp đồng nghiệp, quản lý dự án gọn nhẹ và làm mới nghề nghiệp.
