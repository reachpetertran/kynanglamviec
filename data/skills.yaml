    slug: k9
    cluster: IV
    name: Lãnh đạo và phát triển người khác
    summary: Dẫn dắt việc chung, giao việc, phản hồi và giúp người khác tiến bộ.
    framework_map: ["WEF: Leadership and social influence; Talent management", "SkillsFuture CCS: Developing People, Influence", "NACE: Leadership"]
    gdpt: "–"
    levels:
      1: ["Tôi có thể chỉ cho bạn mới một việc mình đã biết.", "Tôi có thể nhận một vai trò nhỏ trong nhóm, như giữ giờ hay ghi chép.", "Tôi có thể giúp nhóm giữ trật tự khi làm nhiệm vụ."]
      2: ["Tôi có thể đề xuất cách làm cho nhóm khi chưa ai lên tiếng.", "Tôi có thể làm mẫu bằng việc làm đúng hạn, đúng chuẩn.", "Tôi có thể nhận trách nhiệm điều phối một việc nhỏ của nhóm."]
      3: ["Tôi có thể hướng dẫn người mới làm quen công việc.", "Tôi có thể phản hồi cụ thể, dựa trên hành vi, cho đồng nghiệp.", "Tôi có thể điều phối một cuộc họp ngắn đúng giờ, có kết luận."]
      4: ["Tôi có thể kèm cặp (mentoring) một người trong nhiều tháng.", "Tôi có thể tác động đến quyết định dù không có chức danh.", "Tôi có thể dẫn một nhóm dự án không có quan hệ cấp trên cấp dưới."]
      5: ["Tôi có thể giao việc rõ, theo dõi và phản hồi định kỳ.", "Tôi có thể phát hiện và bồi dưỡng người kế cận.", "Tôi có thể đặt mục tiêu cho đội và gắn nó với mục tiêu của đơn vị."]

