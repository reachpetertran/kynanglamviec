    summary: Dùng công cụ số và AI an toàn; hiểu hợp đồng, an toàn, bảo mật ở nơi làm việc.
    framework_map: ["WEF: Technological literacy; AI and big data", "CSfW: 3e, 1b", "SkillsFuture CCS: Digital Fluency", "DigComp 3.0"]
    gdpt: (Tin học)
    crosslink: {site: trachnhiemxahoi.com, url: "https://trachnhiemxahoi.com/", note: "Quyền con người và social compliance nằm ở trachnhiemxahoi.com. Ở đây ta học phần kiến thức thực tế khi đi làm."}
    levels:
