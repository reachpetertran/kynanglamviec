"system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ghi một điều sửa</text><rect x="444" y="320" width="14" height="14" rx="3" fill="none" stroke="#2563a8" stroke-width="2"/><text x="466" y="332" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Đọc kỹ đề nghị việc</text></svg>