<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Dòng thời gian buổi phỏng vấn. Trước: tìm hiểu nơi tuyển, luyện giới thiệu 60 giây, chuẩn bị một ví dụ STAR, hai câu hỏi ngược, báo người nhà nơi đến. Trong: đến sớm 10 phút, nghe hết câu hỏi, hỏi lại khi chưa rõ. Sau: nhắn cảm ơn trong 24 giờ, ghi lại câu hỏi đã gặp."><title>Dòng thời gian buổi phỏng vấn. Trước: tìm hiểu nơi tuyển, luyện giới thiệu 60 giây, chuẩn bị một ví dụ STAR, hai câu hỏi ngược, báo người nhà nơi đến. Trong: đến sớm 10 phút, nghe hết câu hỏi, hỏi lại khi chưa rõ. Sau: nhắn cảm ơn trong 24 giờ, ghi lại câu hỏi đã gặp.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="34" font-size="20" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Phỏng vấn: trước · trong · sau</text><path d="M40,80 L600,80" stroke="#1f7a74" stroke-width="4"/><circle cx="120" cy="80" r="16" fill="#d98a1c"/><rect x="30" y="108" width="180" height="260" rx="12" fill="#fff" stroke="#d98a1c" stroke-width="2"/><text x="120" y="136" font-size="17" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Trước</text><rect x="44" y="160" width="14" height="14" rx="3" fill="none" stroke="#d98a1c" stroke-width="2"/><text x="66" y="172" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tìm hiểu nơi tuyển</text><rect x="44" y="200" width="14" height="14" rx="3" fill="none" stroke="#d98a1c" stroke-width="2"/><text x="66" y="212" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Giới thiệu 60 giây</text><rect x="44" y="240" width="14" height="14" rx="3" fill="none" stroke="#d98a1c" stroke-width="2"/><text x="66" y="25