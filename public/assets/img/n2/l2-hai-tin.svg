<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Hai tin tuyển dụng giả định đặt cạnh nhau. Tin bên trái ghi rõ việc, ca, lương, địa chỉ. Tin bên phải có ba dấu hiệu cần dừng lại: lương rất cao mà không nói rõ việc, thu phí đồng phục, nộp bản gốc căn cước."><title>Hai tin tuyển dụng giả định đặt cạnh nhau. Tin bên trái ghi rõ việc, ca, lương, địa chỉ. Tin bên phải có ba dấu hiệu cần dừng lại: lương rất cao mà không nói rõ việc, thu phí đồng phục, nộp bản gốc căn cước.</title><rect width="640" height="400" rx="18" fill="#f4f7f6"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hai tin tuyển dụng (giả định)</text><rect x="24" y="50" width="286" height="328" rx="12" fill="#fff" stroke="#1e7d4f" stroke-width="2"/><rect x="24" y="50" width="286" height="34" rx="12" fill="#e6f4ec"/><text x="167" y="73" font-size="15" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tin A · Rõ ràng</text><text x="40" y="112" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Việc:</text><text x="112" y="112" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">phục vụ, dọn bàn, nhận order</text><text x="40" y="146" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ca:</text><text x="112" y="146" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">18:00–22:00, chọn 3 ca/tuần</text><text x="40" y="180" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Lương:</text><text x="112" y="180" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">ghi rõ theo giờ, trả hằng tháng</text><text x="40" y="214" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Yêu cầu:</text><text x="112" y="214" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">đủ 18 tuổi, biết đi xe máy</text><text x="40" y="248" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ưu tiên:</text><text x="112" y="248" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">đã từng phục vụ</text><text x="40" y="282" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Địa chỉ:</text><text x="112" y="282" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">số nhà, tên đường, quận</text><text x="40" y="316" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Liên hệ:</text><text x="112" y="316" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">quản lý quán, giờ hành chính</text><rect x="104" y="199" width="198" height="22" rx="5" fill="none" stroke="#1e7d4f" stroke-dasharray="4 3"/><text x="167" y="366" font-size="12" fill="#1e7d4f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Bắt buộc và ưu tiên tách riêng</text><rect x="330" y="50" width="286" height="328" rx="12" fill="#fff" stroke="#b03a2e" stroke-width="2"/><rect x="330" y="50" width="286" height="34" rx="12" fill="#fbe9e7"/><text x="473" y="73" font-size="15" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tin B · Cần dừng lại</text><text x="346" y="112" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Việc:</text><text x="416" y="112" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">&quot;việc nhẹ, làm tại nhà&quot;</text><text x="346" y="150" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Lương:</text><text x="416" y="150" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">&quot;thu nhập rất cao&quot;</text><text x="346" y="188" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Yêu cầu:</text><text x="416" y="188" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">không cần kinh nghiệm</text><text x="346" y="226" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Thủ tục:</text><text x="416" y="226" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">nộp 500.000 đ đồng phục</text><text x="346" y="264" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif"></text><text x="416" y="264" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">nộp bản gốc căn cước</text><text x="346" y="302" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Liên hệ:</text><text x="416" y="302" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">chỉ nhắn tin, không địa chỉ</text><circle cx="604" cy="107" r="8" fill="#b03a2e"/><text x="600" y="111" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">!</text><circle cx="604" cy="145" r="8" fill="#b03a2e"/><text x="600" y="149" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">!</text><circle cx="604" cy="221" r="8" fill="#b03a2e"/><text x="600" y="225" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">!</text><circle cx="604" cy="259" r="8" fill="#b03a2e"/><text x="600" y="263" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">!</text><circle cx="604" cy="297" r="8" fill="#b03a2e"/><text x="600" y="301" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">!</text><text x="473" y="366" font-size="12" fill="#b03a2e" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Mập mờ · thu tiền · giữ giấy tờ gốc</text></svg>