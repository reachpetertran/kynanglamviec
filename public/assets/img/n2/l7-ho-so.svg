-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3</text><text x="116" y="175" font-size="14" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">CV một trang</text><rect x="78" y="194" width="300" height="40" rx="6" fill="#fff" stroke="#2563a8" stroke-width="2"/><circle cx="102" cy="214" r="11" fill="#2563a8"/><text x="102" y="219" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">4</text><text x="122" y="219" font-size="14" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Phiếu phỏng vấn</text><rect x="84" y="238" width="300" height="40" rx="6" fill="#fff" stroke="#8e44ad" stroke-width="2"/><circle cx="108" cy="258" r="11" fill="#8e44ad"/><text x="108" y="263" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">5</text><text x="128" y="263" font-size="14" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sổ tay tuần đầu</text><rect x="90" y="282" width="300" height="40" rx="6" fill="#fff" stroke="#1e7d4f" stroke-width="2"/><circle cx="114" cy="302" r="11" fill="#1e7d4f"/><text x="114" y="307" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">6</text><text x="134" y="307" font-size="14" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sổ quy trình</text><rect x="40" y="330" width="360" height="44" rx="8" fill="#14524f"/><text x="220" y="357" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" font-family="syste