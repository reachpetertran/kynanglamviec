<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Hai màn hình điện thoại. Bên trái tin nhắn mơ hồ: chị ơi, em có chút việc. Bên phải tin nhắn rõ: em chào chị, em là Linh ca tối thứ Sáu, em bị sốt nên xin nghỉ ca này, em đã hỏi bạn Tú làm thay, chị đồng ý giúp em nhé."><title>Hai màn hình điện thoại. Bên trái tin nhắn mơ hồ: chị ơi, em có chút việc. Bên phải tin nhắn rõ: em chào chị, em là Linh ca tối thứ Sáu, em bị sốt nên xin nghỉ ca này, em đã hỏi bạn Tú làm thay, chị đồng ý giúp em nhé.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><rect x="70" y="22" width="210" height="356" rx="26" fill="#1d2a33" stroke="#1d2a33" stroke-width="1.5"/><rect x="80" y="46" width="190" height="306" rx="14" fill="#f5f7f8" stroke="#f5f7f8" stroke-width="1.5"/><rect x="80" y="46" width="190" height="34" rx="14" fill="#fbe9e7"/><text x="175" y="68" font-size="14" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Mơ hồ</text><rect x="360" y="22" width="210" height="356" rx="26" fill="#1d2a33" stroke="#1d2a33" stroke-width="1.5"/><rect x="370" y="46" width="190" height="306" rx="14" fill="#f5f7f8" stroke="#f5f7f8" stroke-width="1.5"/><rect x="370" y="46" width="190" height="34" rx="14" fill="#e6f4ec"/><text x="465" y="68" font-size="14" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Rõ, đủ ý</text><rect x="86" y="100" width="150" height="44" rx="12" fill="#fff" stroke="#cfd8dc" stroke-width="1.5"/><text x="161" y="118" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Chị ơi</text><text x="161" y="135" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">em có chút việc ạ</text><rect x="160" y="160" width="120" height="30" rx="12" fill="#dff1ef" stroke="#dff1ef" stroke-width="1.5"/><text x="220" y="180" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Việc gì em?</text><rect x="86" y="206" width="120" height="30" rx="12" fill="#fff" stroke="#cfd8dc" stroke-width="1.5"/><text x="146" y="226" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tối nay ạ</text><rect x="160" y="252" width="120" height="30" rx="12" fill="#dff1ef" stroke="#dff1ef" stroke-width="1.5"/><text x="220" y="272" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tối nay sao em?</text><text x="175" y="330" font-size="12.5" fill="#b03a2e" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Phải hỏi lại 2 lần</text><rect x="376" y="96" width="176" height="196" rx="12" fill="#fff" stroke="#cfd8dc" stroke-width="1.5"/><text x="388" y="116" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Em chào chị, em là Linh,</text><text x="388" y="137" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">ca tối thứ Sáu.</text><text x="388" y="158" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Em bị sốt nên xin nghỉ</text><text x="388" y="179" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">ca 18:00–22:00 hôm nay.</text><text x="388" y="200" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Em đã hỏi bạn Tú,</text><text x="388" y="221" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">bạn ấy làm thay được.</text><text x="388" y="242" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Chị đồng ý giúp em nhé.</text><text x="388" y="263" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Em cảm ơn chị.</text><rect x="440" y="302" width="104" height="30" rx="12" fill="#dff1ef" stroke="#dff1ef" stroke-width="1.5"/><text x="492" y="322" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ok em, nghỉ đi</text><text x="465" y="346" font-size="12" fill="#1e7d4f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ai · việc gì · cần gì</text></svg>