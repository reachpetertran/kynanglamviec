<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Bốn bước gỡ bất đồng, giả định, giữa kỹ sư thiết kế và kỹ sư sản xuất. Bước 1 sự kiện: 6 trên 200 chi tiết lệch dung sai. Bước 2 diễn giải: thiết kế cho rằng máy cũ, sản xuất cho rằng dung sai quá chặt. Bước 3 tiêu chí chung: lắp ráp được, không tăng chi phí. Bước 4 thử: đo 50 chi tiết trên máy khác."><title>Bốn bước gỡ bất đồng, giả định, giữa kỹ sư thiết kế và kỹ sư sản xuất. Bước 1 sự kiện: 6 trên 200 chi tiết lệch dung sai. Bước 2 diễn giải: thiết kế cho rằng máy cũ, sản xuất cho rằng dung sai quá chặt. Bước 3 tiêu chí chung: lắp ráp được, không tăng chi phí. Bước 4 thử: đo 50 chi tiết trên máy khác.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Gỡ bất đồng: từ sự kiện đến thử nghiệm</text><rect x="30" y="48" width="360" height="74" rx="12" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="46" y="72" font-size="15" fill="#1e7d4f" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1. Sự kiện chung</text><text x="46" y="94" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">6/200 chi tiết lệch dung sai</text><text x="46" y="113" font-size="12.5" fill="#5b6b73" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hai bên cùng công nhận</text><line x1="210" y1="122" x2="242" y2="134" stroke="#1e7d4f" stroke-width="2.5"/><circle cx="242" cy="134" r="4.5" fill="#1e7d4f"/><rect x="62" y="134" width="360" height="74" rx="12" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="78" y="158" font-size="15" fill="#d98a1c" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2. Diễn giải mỗi bên</text><text x="78" y="180" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Thảo (thiết kế): máy cũ</text><text x="78" y="199" font-size="12.5" fill="#5b6b73" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hưng (sản xuất): dung sai chặt</text><line x1="242" y1="208" x2="274" y2="220" stroke="#d98a1c" stroke-width="2.5"/><circle cx="274" cy="220" r="4.5" fill="#d98a1c"/><rect x="94" y="220" width="360" height="74" rx="12" fill="#e8f0fa" stroke="#2563a8" stroke-width="2"/><text x="110" y="244" font-size="15" fill="#2563a8" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3. Tiêu chí chung</text><text x="110" y="266" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">① Lắp ráp được</text><text x="110" y="285" font-size="12.5" fill="#5b6b73" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">② Không tăng chi phí</text><line x1="274" y1="294" x2="306" y2="306" stroke="#2563a8" stroke-width="2.5"/><circle cx="306" cy="306" r="4.5" fill="#2563a8"/><rect x="126" y="306" width="360" height="74" rx="12" fill="#e3f0ee" stroke="#14524f" stroke-width="2"/><text x="142" y="330" font-size="15" fill="#14524f" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">4. Thử nghiệm</text><text x="142" y="352" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">50 chi tiết, máy khác</text><text x="142" y="371" font-size="12.5" fill="#5b6b73" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hai bên cùng đo, hạn thứ Năm</text><rect x="500" y="50" width="120" height="150" rx="12" fill="#fff" stroke="#d98a1c" stroke-width="2"/><text x="560" y="76" font-size="13" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Trước khi</text><text x="560" y="93" font-size="13" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">trả lời:</text><text x="560" y="122" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Nhắc lại ý</text><text x="560" y="139" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">người kia.</text><text x="560" y="156" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">&quot;Tôi hiểu</text><text x="560" y="173" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">đúng chưa?&quot;</text></svg>