<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Một trang dự án, giả định, cho dự án giao hàng nội thành trong một ngày. Sáu ô: mục tiêu, phạm vi làm và không làm, bốn mốc, vai trò, phụ thuộc vào phòng IT, ba rủi ro. Bên dưới là dải tiến độ các mốc: mốc 1 xong màu xanh, mốc 2 trễ màu cam."><title>Một trang dự án, giả định, cho dự án giao hàng nội thành trong một ngày. Sáu ô: mục tiêu, phạm vi làm và không làm, bốn mốc, vai trò, phụ thuộc vào phòng IT, ba rủi ro. Bên dưới là dải tiến độ các mốc: mốc 1 xong màu xanh, mốc 2 trễ màu cam.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="28" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Một trang dự án (giả định)</text><rect x="30" y="44" width="180" height="100" rx="10" fill="#fff" stroke="#14524f" stroke-width="2"/><text x="44" y="70" font-size="15" fill="#14524f" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Mục tiêu</text><text x="44" y="98" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">80% đơn nội thành giao</text><text x="44" y="116" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">trong 1 ngày, trước 31/3</text><rect x="230" y="44" width="180" height="100" rx="10" fill="#fff" stroke="#2563a8" stroke-width="2"/><text x="244" y="70" font-size="15" fill="#2563a8" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Phạm vi</text><text x="244" y="98" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Làm: đơn nội thành</text><text x="244" y="116" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Không làm: đơn tỉnh</text><rect x="430" y="44" width="180" height="100" rx="10" fill="#fff" stroke="#d98a1c" stroke-width="2"/><text x="444" y="70" font-size="15" fill="#d98a1c" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Mốc</text><text x="444" y="98" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1 Quy trình hiện tại</text><text x="444" y="116" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2 Kho xong trước 11h</text><rect x="30" y="160" width="180" height="100" rx="10" fill="#fff" stroke="#1f7a74" stroke-width="2"/><text x="44" y="186" font-size="15" fill="#1f7a74" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Vai trò</text><text x="44" y="214" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Mỗi việc 1 người</text><text x="44" y="232" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">chịu trách nhiệm</text><rect x="230" y="160" width="180" height="100" rx="10" fill="#fff" stroke="#b03a2e" stroke-width="2"/><text x="244" y="186" font-size="15" fill="#b03a2e" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Phụ thuộc</text><text x="244" y="214" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,