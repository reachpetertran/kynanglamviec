<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Bốn nấc giao việc khi kèm cặp, giả định, cho việc lập báo giá. Nấc 1 làm mẫu: tuần 1. Nấc 2 làm cùng: tuần 2 đến 3. Nấc 3 quan sát: tuần 4 đến 6, xem trước khi gửi khách. Nấc 4 tự làm: từ tuần 7, báo lại sau khi gửi. Người kèm lùi lại khi người được kèm tiến lên."><title>Bốn nấc giao việc khi kèm cặp, giả định, cho việc lập báo giá. Nấc 1 làm mẫu: tuần 1. Nấc 2 làm cùng: tuần 2 đến 3. Nấc 3 quan sát: tuần 4 đến 6, xem trước khi gửi khách. Nấc 4 tự làm: từ tuần 7, báo lại sau khi gửi. Người kèm lùi lại khi người được kèm tiến lên.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Bốn nấc giao việc khi kèm cặp</text><rect x="40" y="280" width="135" height="80" rx="8" fill="#fff" stroke="#5b6b73" stroke-width="2.5"/><text x="107" y="306" font-size="15" fill="#5b6b73" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1. Làm mẫu</text><text x="107" y="328" font-size="11.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Mình làm, bạn xem</text><text x="107" y="348" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tuần 1</text><rect x="185" y="220" width="135" height="140" rx="8" fill="#fff" stroke="#2563a8" stroke-width="2.5"/><text x="252" y="246" font-size="15" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2. Làm cùng</text><text x="252" y="268" font-size="11.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Bạn làm, mình bên cạnh</text><text x="252" y="288" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tuần 2–3</text><rect x="330" y="160" width="135" height="200" rx="8" fill="#fff" stroke="#d98a1c" stroke-width="2.5"/><text x="397" y="186" font-size="15" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3. Quan sát</text><text x="397" y="208" font-size="11.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Bạn làm, mình xem trước</text><text x="397" y="228" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tuần 4–6</text><rect x="475" y="100" width="135" height="260" rx="8" fill="#fff" stroke="#1e7d4f" stroke-width="2.5"/><text x="542" y="126" font-size="15" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">4. Tự làm</text><text x="542" y="148" font-size="11.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Bạn làm, báo lại sau</text><text x="542" y="168" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Từ tuần 7</text><text x="40" y="76" font-size="13" fill="#d98a1c" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Người được kèm: tiến lên từng nấc</text><text x="40" y="98" font-size="13" fill="#14524f" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Người kèm: lùi lại từng bước</text><text x="320" y="388" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Việc mẫu: lập báo giá cho khách vừa (giả định)</text></svg>