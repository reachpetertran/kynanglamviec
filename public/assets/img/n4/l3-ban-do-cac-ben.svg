<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Bản đồ các bên liên quan, giả định, cho đề xuất quét mã vạch ở kho. Trục dọc là ảnh hưởng tới quyết định, trục ngang là mức bị tác động. Giám đốc vận hành: ảnh hưởng cao, cần đề xuất một trang. Tổ trưởng kho: ảnh hưởng cao, bị tác động nhiều, gặp riêng trước. Kế toán: cần số liệu chi phí. Nhân viên kho ca đêm: bị tác động nhiều, cần hướng dẫn."><title>Bản đồ các bên liên quan, giả định, cho đề xuất quét mã vạch ở kho. Trục dọc là ảnh hưởng tới quyết định, trục ngang là mức bị tác động. Giám đốc vận hành: ảnh hưởng cao, cần đề xuất một trang. Tổ trưởng kho: ảnh hưởng cao, bị tác động nhiều, gặp riêng trước. Kế toán: cần số liệu chi phí. Nhân viên kho ca đêm: bị tác động nhiều, cần hướng dẫn.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Bản đồ các bên: gặp ai trước, nói gì</text><rect x="90" y="48" width="520" height="300" rx="12" fill="#fff" stroke="#9fb9b6" stroke-width="1.5"/><line x1="350" y1="48" x2="350" y2="348" stroke="#c9d6d4" stroke-width="1.5"/><line x1="90" y1="198" x2="610" y2="198" stroke="#c9d6d4" stroke-width="1.5"/><text x="52" y="110" font-size="12" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ảnh</text><text x="52" y="125" font-size="12" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">hưởng</text><text x="52" y="140" font-size="12" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">cao</text><text x="52" y="262" font-size="12" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ảnh</text><text x="52" y="277" font-size="12" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">hưởng</text><text x="52" y="292" font-size="12" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">thấp</text><text x="220" y="372" font-size="13" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Bị tác động ít</text><text x="480" y="372" font-size="13" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Bị tác động nhiều</text><rect x="110" y="70" width="220" height="104" rx="12" fill="#e8f0fa" stroke="#2563a8" stroke-width="2"/><circle cx="136" cy="98" r="12" fill="#2563a8"/><text x="156" y="103" font-size="14" fill="#2563a8" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Giám đốc vận hành</text><text x="220" y="136" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Quyết. Cần đề xuất</text><text x="220" y="154" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">một trang, có số liệu</text><rect x="370" y="70" width="220" height="104" rx="12" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><circle cx="396" cy="98" r="12" fill="#b03a2e"/><text x="416" y="103" font-size="14" fill="#b03a2e" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tổ trưởng kho</text><text x="480" y="136" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Có thể cản. Lo xe chờ.</text><text x="480" y="154" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Gặp riêng trước!</text><rect x="110" y="220" width="220" height="104" rx="12" fill="#f1f4f5" stroke="#5b6b73" stroke-width="2"/><circle cx="136" cy="248" r="12" fill="#5b6b73"/><text x="156" y="253" font-size="14" fill="#5b6b73" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Kế toán</text><text x="220" y="286" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Cần chi phí máy quét</text><text x="220" y="304" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">và tiền sai lệch/tháng</text><rect x="370" y="220" width="220" height="104" rx="12" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><circle cx="396" cy="248" r="12" fill="#d98a1c"/><text x="416" y="253" font-size="14" fill="#d98a1c" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Nhân viên kho ca đêm</text><text x="480" y="286" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Làm thay đổi hằng ngày.</text><text x="480" y="304" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Cần hướng dẫn, thử sau</text></svg>