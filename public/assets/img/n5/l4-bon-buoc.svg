<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Bốn bước của buổi 1-1 coaching, mỗi bước một câu hỏi mẫu. Mục tiêu: hôm nay em muốn ra về với điều gì. Thực tế: hiện giờ đang thế nào, em đã thử gì. Lựa chọn: còn cách nào khác. Bước tiếp: em sẽ làm gì trước, khi nào. Phía dưới: quản lý nghe nhiều hơn nói, nhân viên nói nhiều hơn."><title>Bốn bước của buổi 1-1 coaching, mỗi bước một câu hỏi mẫu. Mục tiêu: hôm nay em muốn ra về với điều gì. Thực tế: hiện giờ đang thế nào, em đã thử gì. Lựa chọn: còn cách nào khác. Bước tiếp: em sẽ làm gì trước, khi nào. Phía dưới: quản lý nghe nhiều hơn nói, nhân viên nói nhiều hơn.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Buổi 1-1: bốn bước câu hỏi</text><rect x="24" y="60" width="136" height="180" rx="14" fill="#e8f0fa" stroke="#2563a8" stroke-width="2"/><circle cx="92" cy="94" r="18" fill="#2563a8"/><text x="92" y="100" font-size="16" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1</text><text x="92" y="140" font-size="15" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Mục tiêu</text><path d="M38 160 h108 a8 8 0 0 1 8 8 v40 a8 8 0 0 1 -8 8 h-70 l-10 10 v-10 h-28 a8 8 0 0 1 -8 -8 v-40 a8 8 0 0 1 8 -8z" fill="#fff" stroke="#2563a8" stroke-width="1.5"/><text x="92" y="182" font-size="11.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hôm nay em muốn</text><text x="92" y="198" font-size="11.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">ra về với điều gì?</text><line x1="160" y1="150" x2="176" y2="150" stroke="#14524f" stroke-width="2"/><circle cx="176" cy="150" r="4.5" fill="#14524f"/><rect x="176" y="60" width="136" height="180" rx="14" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><circle cx="244" cy="94" r="18" fill="#d98a1c"/><text x="244" y="100" font-size="16" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2</text><text x="244" y="140" font-size="15" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Thực tế</text><path d="M190 160 h108 a8 8 0 0 1 8 8 v40 a8 8 0 0 1 -8 8 h-70 l-10 10 v-10 h-28 a8 8 0 0 1 -8 -8 v-40 a8 8 0 0 1 8 -8z" fill="#fff" stroke="#d98a1c" stroke-width="1.5"/><text x="244" y="182" font-size="11.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Đang thế nào?</text><text x="244" y="198" font-size="11.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Em đã thử gì?</text><line x1="312" y1="150" x2="328" y2="150" stroke="#14524f" stroke-width="2"/><circle cx="328" cy="150" r="4.5" fill="#14524f"/><rect x="328" y="60" width="136" height="180" rx="14" fill="#e3f0ee" stroke="#1f7a74" stroke-width="2"/><circle cx="396" cy="94" r="18" fill="#1f7a74"/><text x="396" y="100" font-size="16" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3</text><text x="396" y="140" font-size="15" fill="#1f7a74" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Lựa chọn</text><path d="M342 160 h108 a8 8 0 0 1 8 8 v40 a8 8 0 0 1 -8 8 h-70 l-10 10 v-10 h-28 a8 8 0 0 1 -8 -8 v-40 a8 8 0 0 1 8 -8z" fill="#fff" stroke="#1f7a74" stroke-width="1.5"/><text x="396" y="182" font-size="11.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Còn cách nào</text><text x="396" y="198" font-size="11.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">khác nữa?</text><line x1="464" y1="150" x2="480" y2="150" stroke="#14524f" stroke-width="2"/><circle cx="480" cy="150" r="4.5" fill="#14524f"/><rect x="480" y="60" width="136" height="180" rx="14" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><circle cx="548" cy="94" r="18" fill="#1e7d4f"/><text x="548" y="100" font-size="16" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">4</text><text x="548" y="140" font-size="15" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Bước tiếp</text><path d="M494 160 h108 a8 8 0 0 1 8 8 v40 a8 8 0 0 1 -8 8 h-70 l-10 10 v-10 h-28 a8 8 0 0 1 -8 -8 v-40 a8 8 0 0 1 8 -8z" fill="#fff" stroke="#1e7d4f" stroke-width="1.5"/><text x="548" y="182" font-size="11.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Em làm gì trước?</text><text x="548" y="198" font-size="11.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Khi nào?</text><text x="320" y="276" font-size="14" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ai nói nhiều hơn?</text><text x="110" y="312" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Quản lý</text><rect x="200" y="300" width="120" height="16" rx="5" fill="#d98a1c"/><text x="330" y="313" font-size="12" fill="#5b6b73" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">hỏi, tóm lại, chờ</text><text x="110" y="348" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Nhân viên</text><rect x="200" y="336" width="300" height="16" rx="5" fill="#1e7d4f"/><text x="510" y="349" font-size="12" fill="#5b6b73" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">kể, nghĩ, chọn</text><text x="320" y="386" font-size="11.5" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Minh họa ý tưởng, không phải số đo</text></svg>