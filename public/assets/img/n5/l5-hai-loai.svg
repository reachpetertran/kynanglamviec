<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Hai loại đối thoại khó. Bên trái: đối thoại với một người về kết quả công việc, gồm sự kiện, tác động, nghe, thỏa thuận, ngày xem lại. Bên phải: hòa giải xung đột giữa hai người, gồm gặp riêng người A, gặp riêng người B, gặp chung, tiêu chí chung, thỏa thuận cách làm. Phía dưới là vùng đỏ: quấy rối, bạo lực, gian lận, nguy hiểm an toàn thì không hòa giải, báo theo quy trình."><title>Hai loại đối thoại khó. Bên trái: đối thoại với một người về kết quả công việc, gồm sự kiện, tác động, nghe, thỏa thuận, ngày xem lại. Bên phải: hòa giải xung đột giữa hai người, gồm gặp riêng người A, gặp riêng người B, gặp chung, tiêu chí chung, thỏa thuận cách làm. Phía dưới là vùng đỏ: quấy rối, bạo lực, gian lận, nguy hiểm an toàn thì không hòa giải, báo theo quy trình.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hai loại đối thoại khó</text><rect x="24" y="48" width="286" height="250" rx="14" fill="#e8f0fa" stroke="#2563a8" stroke-width="2"/><text x="167" y="76" font-size="16" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Với một người</text><text x="167" y="96" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">về kết quả công việc</text><circle cx="64" cy="122" r="11" fill="#2563a8"/><text x="64" y="127" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1</text><text x="86" y="127" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sự kiện</text><circle cx="64" cy="156" r="11" fill="#2563a8"/><text x="64" y="161" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2</text><text x="86" y="161" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tác động</text><circle cx="64" cy="190" r="11" fill="#2563a8"/><text x="64" y="195" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3</text><text x="86" y="195" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hỏi và nghe</text><circle cx="64" cy="224" r="11" fill="#2563a8"/><text x="64" y="229" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">4</text><text x="86" y="229" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Thỏa thuận</text><circle cx="64" cy="258" r="11" fill="#2563a8"/><text x="64" y="263" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">5</text><text x="86" y="263" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ngày xem lại</text><rect x="330" y="48" width="286" height="250" rx="14" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="473" y="76" font-size="16" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Giữa hai người</text><text x="473" y="96" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">hòa giải xung đột</text><circle cx="370" cy="122" r="11" fill="#d98a1c"/><text x="370" y="127" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1</text><text x="392" y="127" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Gặp riêng A</text><circle cx="370" cy="156" r="11" fill="#d98a1c"/><text x="370" y="161" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2</text><text x="392" y="161" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Gặp riêng B</text><circle cx="370" cy="190" r="11" fill="#d98a1c"/><text x="370" y="195" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3</text><text x="392" y="195" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Gặp chung</text><circle cx="370" cy="224" r="11" fill="#d98a1c"/><text x="370" y="229" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">4</text><text x="392" y="229" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tiêu chí chung</text><circle cx="370" cy="258" r="11" fill="#d98a1c"/><text x="370" y="263" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">5</text><text x="392" y="263" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Thỏa thuận cách làm</text><rect x="24" y="312" width="592" height="72" rx="12" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><text x="320" y="340" font-size="15" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Vùng không hòa giải</text><text x="320" y="364" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Quấy rối, bạo lực, gian lận, nguy hiểm an toàn → báo theo quy trình</text></svg>