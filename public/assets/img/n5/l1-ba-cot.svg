<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Bản chuyển vai, giả định, của một tổ trưởng chuyền may mới lên. Cột buông: tự may mẫu khó, tự sửa hàng lỗi, tự đi lấy phụ liệu. Cột giữ: duyệt mẫu đầu chuyền, đến hết tháng 2. Cột mới: họp đầu ca 10 phút, giao việc theo bảng, gặp 1-1 mỗi tuần 3 người, kèm 2 thợ lên may công đoạn khó."><title>Bản chuyển vai, giả định, của một tổ trưởng chuyền may mới lên. Cột buông: tự may mẫu khó, tự sửa hàng lỗi, tự đi lấy phụ liệu. Cột giữ: duyệt mẫu đầu chuyền, đến hết tháng 2. Cột mới: họp đầu ca 10 phút, giao việc theo bảng, gặp 1-1 mỗi tuần 3 người, kèm 2 thợ lên may công đoạn khó.</title><rect width="640" height="400" rx="18" fill="#fdf8ef"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Bản chuyển vai của tổ trưởng mới</text><rect x="24" y="54" width="188" height="300" rx="14" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><text x="118" y="88" font-size="20" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Buông</text><text x="118" y="110" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">giao lại cho tổ</text><rect x="36" y="128" width="164" height="34" rx="8" fill="#fff" stroke="#b03a2e" stroke-width="1.5"/><text x="118" y="150" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tự may mẫu khó</text><rect x="36" y="172" width="164" height="34" rx="8" fill="#fff" stroke="#b03a2e" stroke-width="1.5"/><text x="118" y="194" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tự sửa hàng lỗi</text><rect x="36" y="216" width="164" height="34" rx="8" fill="#fff" stroke="#b03a2e" stroke-width="1.5"/><text x="118" y="238" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tự đi lấy phụ liệu</text><rect x="226" y="54" width="188" height="300" rx="14" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="320" y="88" font-size="20" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Giữ</text><text x="320" y="110" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">ít, có hạn</text><rect x="238" y="128" width="164" height="34" rx="8" fill="#fff" stroke="#d98a1c" stroke-width="1.5"/><text x="320" y="150" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Duyệt mẫu đầu chuyền</text><rect x="238" y="172" width="164" height="34" rx="8" fill="#fff" stroke="#d98a1c" stroke-width="1.5"/><text x="320" y="194" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">(đến hết tháng 2)</text><rect x="428" y="54" width="188" height="300" rx="14" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="522" y="88" font-size="20" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Mới</text><text x="522" y="110" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">việc của quản lý</text><rect x="440" y="128" width="164" height="34" rx="8" fill="#fff" stroke="#1e7d4f" stroke-width="1.5"/><text x="522" y="150" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Họp đầu ca 10 phút</text><rect x="440" y="172" width="164" height="34" rx="8" fill="#fff" stroke="#1e7d4f" stroke-width="1.5"/><text x="522" y="194" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Giao việc theo bảng</text><rect x="440" y="216" width="164" height="34" rx="8" fill="#fff" stroke="#1e7d4f" stroke-width="1.5"/><text x="522" y="238" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1-1 mỗi tuần 3 người</text><rect x="440" y="260" width="164" height="34" rx="8" fill="#fff" stroke="#1e7d4f" stroke-width="1.5"/><text x="522" y="282" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Kèm 2 thợ công đoạn khó</text><line x1="214" y1="370" x2="426" y2="370" stroke="#14524f" stroke-width="3"/><circle cx="426" cy="370" r="4.5" fill="#14524f"/><text x="320" y="392" font-size="13" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Buông việc cũ → có thời gian cho việc mới</text></svg>