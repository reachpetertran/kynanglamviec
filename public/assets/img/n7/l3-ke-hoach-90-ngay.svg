<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Kế hoạch 90 ngày của một tiệm bánh, giả định. Ba mốc trên trục thời gian. Ngày 30: 50 khách đặt trước, trở ngại là lò hỏng, dự phòng là thuê lò chung. Ngày 60: bán ở 2 quán cà phê, trở ngại là quán từ chối, dự phòng là bán qua nhóm cư dân. Ngày 90: hòa vốn tháng, trở ngại là giá bột tăng, dự phòng là đổi kích cỡ bánh."><title>Kế hoạch 90 ngày của một tiệm bánh, giả định. Ba mốc trên trục thời gian. Ngày 30: 50 khách đặt trước, trở ngại là lò hỏng, dự phòng là thuê lò chung. Ngày 60: bán ở 2 quán cà phê, trở ngại là quán từ chối, dự phòng là bán qua nhóm cư dân. Ngày 90: hòa vốn tháng, trở ngại là giá bột tăng, dự phòng là đổi kích cỡ bánh.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Kế hoạch 90 ngày của một tiệm bánh</text><line x1="60" y1="84" x2="580" y2="84" stroke="#1f7a74" stroke-width="4"/><circle cx="120" cy="84" r="14" fill="#1f7a74"/><text x="120" y="89" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1</text><text x="120" y="122" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ngày 30</text><rect x="28" y="136" width="184" height="62" rx="10" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.5"/><text x="120" y="158" font-size="12" fill="#2563a8" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Kết quả</text><text x="120" y="182" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">50 khách đặt trước</text><rect x="28" y="210" width="184" height="62" rx="10" fill="#fbe9e7" stroke="#b03a2e" stroke-width="1.5"/><text x="120" y="232" font-size="12" fill="#b03a2e" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Trở ngại dự đoán</text><text x="120" y="256" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Lò hỏng</text><rect x="28" y="284" width="184" height="62" rx="10" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="1.5"/><text x="120" y="306" font-size="12" fill="#1e7d4f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Nếu… thì…</text><text x="120" y="330" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Thuê lò chung</text><circle cx="320" cy="84" r="14" fill="#1f7a74"/><text x="320" y="89" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2</text><text x="320" y="122" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ngày 60</text><rect x="228" y="136" width="184" height="62" rx="10" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.5"/><text x="320" y="158" font-size="12" fill="#2563a8" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Kết quả</text><text x="320" y="182" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Bán ở 2 quán cà phê</text><rect x="228" y="210" width="184" height="62" rx="10" fill="#fbe9e7" stroke="#b03a2e" stroke-width="1.5"/><text x="320" y="232" font-size="12" fill="#b03a2e" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Trở ngại dự đoán</text><text x="320" y="256" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Quán từ chối</text><rect x="228" y="284" width="184" height="62" rx="10" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="1.5"/><text x="320" y="306" font-size="12" fill="#1e7d4f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Nếu… thì…</text><text x="320" y="330" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Bán qua nhóm cư dân</text><circle cx="520" cy="84" r="14" fill="#1f7a74"/><text x="520" y="89" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3</text><text x="520" y="122" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ngày 90</text><rect x="428" y="136" width="184" height="62" rx="10" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.5"/><text x="520" y="158" font-size="12" fill="#2563a8" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Kết quả</text><text x="520" y="182" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hòa vốn tháng</text><rect x="428" y="210" width="184" height="62" rx="10" fill="#fbe9e7" stroke="#b03a2e" stroke-width="1.5"/><text x="520" y="232" font-size="12" fill="#b03a2e" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Trở ngại dự đoán</text><text x="520" y="256" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Giá bột tăng</text><rect x="428" y="284" width="184" height="62" rx="10" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="1.5"/><text x="520" y="306" font-size="12" fill="#1e7d4f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Nếu… thì…</text><text x="520" y="330" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Đổi kích cỡ bánh</text><text x="320" y="380" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Quyết trước khi còn bình tĩnh. Khi sự cố đến, chỉ cần làm theo.</text></svg>