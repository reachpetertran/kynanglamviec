<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Quy trình tuyển người đầu tiên, giả định, gồm 4 ô nối nhau. Ô 1: 3 kết quả trong 90 ngày. Ô 2: bài làm thử 45 phút. Ô 3: hợp đồng, thử việc, bảo hiểm. Ô 4: gặp 1-1 mỗi tuần 15 phút. Bên dưới có ghi chú: mô tả bằng kết quả, không bằng chức danh."><title>Quy trình tuyển người đầu tiên, giả định, gồm 4 ô nối nhau. Ô 1: 3 kết quả trong 90 ngày. Ô 2: bài làm thử 45 phút. Ô 3: hợp đồng, thử việc, bảo hiểm. Ô 4: gặp 1-1 mỗi tuần 15 phút. Bên dưới có ghi chú: mô tả bằng kết quả, không bằng chức danh.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Bốn bước tuyển và giữ người đầu tiên</text><rect x="24" y="90" width="136" height="170" rx="14" fill="#e8f0fa" stroke="#2563a8" stroke-width="2"/><circle cx="92" cy="126" r="18" fill="#2563a8"/><text x="92" y="132" font-size="16" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1</text><text x="92" y="186" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3 kết quả</text><text x="92" y="210" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">trong 90 ngày</text><line x1="162" y1="175" x2="174" y2="175" stroke="#1f7a74" stroke-width="2.5"/><circle cx="174" cy="175" r="4.5" fill="#1f7a74"/><rect x="176" y="90" width="136" height="170" rx="14" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><circle cx="244" cy="126" r="18" fill="#d98a1c"/><text x="244" y="132" font-size="16" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2</text><text x="244" y="186" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Bài làm thử</text><text x="244" y="210" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">45 phút</text><line x1="314" y1="175" x2="326" y2="175" stroke="#1f7a74" stroke-width="2.5"/><circle cx="326" cy="175" r="4.5" fill="#1f7a74"/><rect x="328" y="90" width="136" height="170" rx="14" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><circle cx="396" cy="126" r="18" fill="#b03a2e"/><text x="396" y="132" font-size="16" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3</text><text x="396" y="186" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hợp đồng, thử việc,</text><text x="396" y="210" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">bảo hiểm</text><line x1="466" y1="175" x2="478" y2="175" stroke="#1f7a74" stroke-width="2.5"/><circle cx="478" cy="175" r="4.5" fill="#1f7a74"/><rect x="480" y="90" width="136" height="170" rx="14" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><circle cx="548" cy="126" r="18" fill="#1e7d4f"/><text x="548" y="132" font-size="16" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">4</text><text x="548" y="186" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Gặp 1-1</text><text x="548" y="210" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">mỗi tuần 15 phút</text><rect x="24" y="296" width="592" height="64" rx="12" fill="#fff" stroke="#9fb9b6" stroke-width="1.5"/><text x="320" y="322" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Mô tả bằng kết quả, không bằng chức danh.</text><text x="320" y="345" font-size="13" fill="#5b6b73" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tên gọi &quot;cộng tác viên&quot; không đổi bản chất hợp đồng.</text></svg>