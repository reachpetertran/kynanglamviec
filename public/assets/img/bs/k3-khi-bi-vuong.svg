<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Sơ đồ quyết định khi bị vướng. Câu hỏi đầu: việc có liên quan an toàn, tiền của khách hay máy lạ không? Có thì hỏi ngay. Không thì tự thử vài phút với hướng dẫn có sẵn. Được thì làm tiếp và ghi lại. Chưa được thì nói chỗ vướng trong một câu và nhờ đúng người, đúng lúc."><title>Sơ đồ quyết định khi bị vướng. Câu hỏi đầu: việc có liên quan an toàn, tiền của khách hay máy lạ không? Có thì hỏi ngay. Không thì tự thử vài phút với hướng dẫn có sẵn. Được thì làm tiếp và ghi lại. Chưa được thì nói chỗ vướng trong một câu và nhờ đúng người, đúng lúc.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Khi bị vướng: hỏi ngay hay tự thử?</text><rect x="200" y="48" width="240" height="44" rx="22" fill="#14524f" stroke="#14524f" stroke-width="1.5"/><text x="320" y="76" font-size="15" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Mình đang bị vướng</text><line x1="320" y1="92" x2="320" y2="118" stroke="#1f7a74" stroke-width="2.5"/><circle cx="320" cy="118" r="4.5" fill="#1f7a74"/><polygon points="300,122 440,170 300,218 160,170" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="300" y="162" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">An toàn, tiền của khách,</text><text x="300" y="180" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">máy móc lạ?</text><text x="448" y="162" font-size="13" fill="#b03a2e" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Có</text><line x1="440" y1="170" x2="482" y2="170" stroke="#b03a2e" stroke-width="2.5"/><circle cx="482" cy="170" r="4.5" fill="#b03a2e"/><rect x="486" y="136" width="140" height="68" rx="12" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><text x="556" y="164" font-size="13" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">HỎI NGAY</text><text x="556" y="182" font-size="13" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">người phụ trách</text><text x="310" y="238" font-size="13" fill="#1e7d4f" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Không</text><line x1="300" y1="218" x2="300" y2="250" stroke="#1e7d4f" stroke-width="2.5"/><circle cx="300" cy="250" r="4.5" fill="#1e7d4f"/><rect x="170" y="252" width="260" height="44" rx="12" fill="#fff" stroke="#1e7d4f" stroke-width="2"/><text x="300" y="279" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tự thử vài phút với hướng dẫn có sẵn</text><line x1="250" y1="296" x2="150" y2="326" stroke="#1e7d4f" stroke-width="2.5"/><circle cx="150" cy="326" r="4.5" fill="#1e7d4f"/><line x1="390" y1="296" x2="490" y2="326" stroke="#d98a1c" stroke-width="2.5"/><circle cx="490" cy="326" r="4.5" fill="#d98a1c"/><rect x="30" y="328" width="230" height="54" rx="12" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="145" y="350" font-size="13" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Được: làm tiếp,</text><text x="145" y="367" font-size="13" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">ghi lại cách làm</text><rect x="372" y="328" width="254" height="54" rx="12" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="499" y="350" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Chưa được: nói chỗ vướng 1 câu,</text><text x="499" y="367" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">nhờ đúng người, đúng lúc</text></svg>