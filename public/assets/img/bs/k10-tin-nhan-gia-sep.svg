<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Màn hình điện thoại với tin nhắn giả mạo giám đốc, giả định. Tài khoản mới có ảnh giám đốc nhắn: chuyển gấp 45 triệu cho đối tác, anh đang họp không nghe máy, xong trước 11 giờ. Ba dấu đỏ chỉ vào ba dấu hiệu: đòi chuyển tiền, gấp gáp, chặn việc gọi xác nhận. Bên cạnh là ba bước: dừng, gọi số đã lưu, báo kế toán trưởng."><title>Màn hình điện thoại với tin nhắn giả mạo giám đốc, giả định. Tài khoản mới có ảnh giám đốc nhắn: chuyển gấp 45 triệu cho đối tác, anh đang họp không nghe máy, xong trước 11 giờ. Ba dấu đỏ chỉ vào ba dấu hiệu: đòi chuyển tiền, gấp gáp, chặn việc gọi xác nhận. Bên cạnh là ba bước: dừng, gọi số đã lưu, báo kế toán trưởng.</title><rect width="640" height="400" rx="18" fill="#fdf8ef"/><text x="320" y="30" font-size="18.5" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ba dấu hiệu trong một tin nhắn (giả định)</text><rect x="40" y="46" width="250" height="342" rx="26" fill="#1d2a33"/><rect x="52" y="62" width="226" height="310" rx="14" fill="#fff"/><circle cx="80" cy="88" r="15" fill="#1f7a74"/><text x="102" y="86" font-size="11.5" fill="#1d2a33" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Giám đốc (tài khoản mới)</text><text x="102" y="101" font-size="10" fill="#5b6b73" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">vừa xong</text><rect x="64" y="118" width="202" height="122" rx="12" fill="#eef2f1"/><text x="76" y="140" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Phúc chuyển gấp 45 triệu</text><text x="76" y="162" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">cho đối tác theo số TK này.</text><text x="76" y="184" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Anh đang họp, không nghe</text><text x="76" y="206" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">máy được.</text><text x="76" y="228" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Xong trước 11 giờ nhé.</text><line x1="266" y1="147" x2="318" y2="147" stroke="#b03a2e" stroke-width="2"/><circle cx="330" cy="147" r="12" fill="#b03a2e"/><text x="330" y="152" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1</text><text x="350" y="152" font-size="13.5" fill="#b03a2e" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Đòi chuyển tiền</text><line x1="266" y1="224" x2="318" y2="224" stroke="#b03a2e" stroke-width="2"/><circle cx="330" cy="224" r="12" fill="#b03a2e"/><text x="330" y="229" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2</text><text x="350" y="229" font-size="13.5" fill="#b03a2e" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Gấp gáp</text><line x1="266" y1="191" x2="318" y2="191" stroke="#b03a2e" stroke-width="2"/><circle cx="330" cy="191" r="12" fill="#b03a2e"/><text x="330" y="196" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3</text><text x="350" y="196" font-size="13.5" fill="#b03a2e" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Chặn gọi xác nhận</text><rect x="338" y="262" width="286" height="118" rx="14" fill="#fff" stroke="#1e7d4f" stroke-width="2"/><text x="481" y="286" font-size="14" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Phúc làm 3 bước</text><text x="354" y="314" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1. Dừng: không chuyển, không trả lời</text><text x="354" y="338" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2. Gọi số giám đốc đã lưu sẵn</text><text x="354" y="362" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3. Báo kế toán trưởng, cảnh báo nhóm</text><rect x="64" y="252" width="202" height="30" rx="15" fill="#fff" stroke="#c9d6d4"/><text x="165" y="272" font-size="11" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Nhập tin nhắn…</text></svg>