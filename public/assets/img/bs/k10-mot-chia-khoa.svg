<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="So sánh hai cách dùng mật khẩu. Bên trái: một chìa khóa mở cả bốn cửa email, ngân hàng, mạng xã hội, phần mềm bán hàng; lộ một là mất cả bốn. Bên phải: mỗi cửa một chìa riêng, kèm điện thoại nhận mã xác thực hai lớp; lộ một chìa, ba cửa còn lại vẫn an toàn."><title>So sánh hai cách dùng mật khẩu. Bên trái: một chìa khóa mở cả bốn cửa email, ngân hàng, mạng xã hội, phần mềm bán hàng; lộ một là mất cả bốn. Bên phải: mỗi cửa một chìa riêng, kèm điện thoại nhận mã xác thực hai lớp; lộ một chìa, ba cửa còn lại vẫn an toàn.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="18.5" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Một chìa cho mọi cửa, hay mỗi cửa một chìa?</text><rect x="16" y="48" width="296" height="312" rx="14" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><text x="164" y="76" font-size="14.5" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Dùng chung một mật khẩu</text><rect x="30" y="196" width="58" height="84" rx="6" fill="#fff" stroke="#b03a2e" stroke-width="2.2"/><circle cx="76" cy="240" r="3.5" fill="#b03a2e"/><text x="59" y="298" font-size="11" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Email</text><path d="M164,148 L59,194" stroke="#b03a2e" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="100" y="196" width="58" height="84" rx="6" fill="#fff" stroke="#b03a2e" stroke-width="2.2"/><circle cx="146" cy="240" r="3.5" fill="#b03a2e"/><text x="129" y="298" font-size="11" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ngân hàng</text><path d="M164,148 L129,194" stroke="#b03a2