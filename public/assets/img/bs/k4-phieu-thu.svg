<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Phiếu thử nhỏ của Lan, giả định, gồm 4 ô: cách cũ để dụng cụ trong ngăn kéo; cách mới treo băng dính và kéo lên giá; đo số phút cho 10 đơn; thử 3 ca. Bên phải là hai cột so sánh: trước khoảng 25 phút, sau khoảng 20 phút."><title>Phiếu thử nhỏ của Lan, giả định, gồm 4 ô: cách cũ để dụng cụ trong ngăn kéo; cách mới treo băng dính và kéo lên giá; đo số phút cho 10 đơn; thử 3 ca. Bên phải là hai cột so sánh: trước khoảng 25 phút, sau khoảng 20 phút.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Phiếu thử nhỏ của Lan (giả định)</text><rect x="22" y="52" width="176" height="148" rx="12" fill="#fff" stroke="#5b6b73" stroke-width="2"/><rect x="22" y="52" width="176" height="34" rx="12" fill="#5b6b73" fill-opacity=".16"/><text x="110" y="75" font-size="14" fill="#5b6b73" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Cách cũ</text><text x="110" y="126" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Dụng cụ để</text><text x="110" y="146" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">trong ngăn kéo</text><rect x="208" y="52" width="176" height="148" rx="12" fill="#fff" stroke="#d98a1c" stroke-width="2"/><rect x="208" y="52" width="176" height="34" rx="12" fill="#d98a1c" fill-opacity=".16"/><text x="296" y="75" font-size="14" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Cách mới</text><text x="296" y="126" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Treo băng dính,</text><text x="296" y="146" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">kéo lên giá</text><rect x="22" y="212" width="176" height="148" rx="12" fill="#fff" stroke="#2563a8" stroke-width="2"/><rect x="22" y="212" width="176" height="34" rx="12" fill="#2563a8" fill-opacity=".16"/><text x="110" y="235" font-size="14" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Đo gì</text><text x="110" y="286" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Số phút cho</text><text x="110" y="306" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">10 đơn</text><rect x="208" y="212" width="176" height="148" rx="12" fill="#fff" stroke="#1f7a74" stroke-width="2"/><rect x="208" y="212" width="176" height="34" rx="12" fill="#1f7a74" fill-opacity=".16"/><text x="296" y="235" font-size="14" fill="#1f7a74" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Thử bao lâu</text><text x="296" y="296" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3 ca</text><rect x="398" y="52" width="222" height="308" rx="12" fill="#fff" stroke="#9fb9b6" stroke-width="1.5"/><text x="509" y="78" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Phút cho 10 đơn</text><rect x="438" y="110.0" width="56" height="210.0" rx="6"