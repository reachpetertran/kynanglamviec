<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Ba khung tranh, giả định. Khung 1: anh chủ tiệm bánh mì dặn ba việc: tắt lò, đậy khay pa-tê, lau quầy. Khung 2: Minh đặt ổ bánh xuống, quay sang nghe hết câu. Khung 3: Minh nhắc lại, giơ ba ngón tay theo đúng thứ tự."><title>Ba khung tranh, giả định. Khung 1: anh chủ tiệm bánh mì dặn ba việc: tắt lò, đậy khay pa-tê, lau quầy. Khung 2: Minh đặt ổ bánh xuống, quay sang nghe hết câu. Khung 3: Minh nhắc lại, giơ ba ngón tay theo đúng thứ tự.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Nghe hết, rồi nhắc lại theo thứ tự</text><rect x="16" y="48" width="196" height="330" rx="14" fill="#fff" stroke="#14524f" stroke-width="2"/><text x="114" y="74" font-size="14.5" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1. Anh chủ dặn</text><line x1="26" y1="330" x2="202" y2="330" stroke="#c9d6d4" stroke-width="2"/><rect x="224" y="48" width="196" height="330" rx="14" fill="#fff" stroke="#d98a1c" stroke-width="2"/><text x="322" y="74" font-size="14.5" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2. Dừng tay, nghe hết</text><line x1="234" y1="330" x2="410" y2="330" stroke="#c9d6d4" stroke-width="2"/><rect x="432" y="48" width="196" height="330" rx="14" fill="#fff" stroke="#1e7d4f" stroke-width="2"/><text x="530" y="74" font-size="14.5" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3. Nhắc lại</text><line x1="442" y1="330" x2="618" y2="330" stroke="#c9d6d4" stroke-width="2"/><rect x="28" y="88" width="172" height="92" rx="12" fill="#fff" stroke="#14524f" 