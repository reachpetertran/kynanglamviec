<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Hai cột quy trình nhận hàng ở kho, giả định. Cột cách cũ: nhận hàng, kiểm số lượng, ghi sổ tay, xếp lên kệ. Cột cách mới: nhận hàng, kiểm số lượng, quét mã bằng điện thoại, xếp lên kệ. Chỉ bước thứ ba được tô vàng vì là bước thay đổi; ba bước kia giữ nguyên."><title>Hai cột quy trình nhận hàng ở kho, giả định. Cột cách cũ: nhận hàng, kiểm số lượng, ghi sổ tay, xếp lên kệ. Cột cách mới: nhận hàng, kiểm số lượng, quét mã bằng điện thoại, xếp lên kệ. Chỉ bước thứ ba được tô vàng vì là bước thay đổi; ba bước kia giữ nguyên.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Cách cũ và cách mới: tìm điểm khác</text><text x="160" y="66" font-size="15" fill="#5b6b73" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Cách cũ</text><text x="480" y="66" font-size="15" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Cách mới</text><rect x="40" y="82" width="240" height="50" rx="10" fill="#fff" stroke="#b7c7c5" stroke-width="1.6"/><text x="160" y="113" font-size="14" fill="#5b6b73" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Nhận hàng</text><rect x="360" y="82" width="240" height="50" rx="10" fill="#fff" stroke="#1f7a74" stroke-width="1.6"/><text x="480" y="113" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Nhận hàng</text><circle cx="24" cy="107" r="11" fill="#14524f"/><text x="24" y="112" font-size="11" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1</text><line x1="284" y1="107" x2="356" y2="107" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 4"/><text x="320" y="100" font-size="11" fill="#5b6b73" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">giữ</text><rect x="40" y="152" width="240" height="50" rx="10" fill="#fff" stroke="#b7c7c5" stroke-width="1.6"/><text x="160" y="183" font-size="14" fill="#5b6b73" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Kiểm số lượng</text><rect x="360" y="152" width="240" height="50" rx="10" fill="#fff" stroke="#1f7a74" stroke-width="1.6"/><text x="480" y="183" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Kiểm số lượng</text><circle cx="24" cy="177" r="11" fill="#14524f"/><text x="24" y="182" font-size="11" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2</text><line x1="284" y1="177" x2="356" y2="177" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 4"/><text x="320" y="170" font-size="11" fill="#5b6b73" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">giữ</text><rect x="40" y="222" width="240" height="50" rx="10" fill="#fff" stroke="#b7c7c5" stroke-width="1.6"/><text x="160" y="253" font-size="14" fill="#5b6b73" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ghi sổ tay</text><rect x="360" y="222" width="240" height="50" rx="10" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2.4"/><text x="480" y="253" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Quét mã bằng điện thoại</text><circle cx="24" cy="247" r="11" fill="#14524f"/><text x="24" y="252" font-size="11" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3</text><line x1="282" y1="247" x2="356" y2="247" stroke="#d98a1c" stroke-width="3"/><circle cx="356" cy="247" r="4.5" fill="#d98a1c"/><text x="320" y="237" font-size="12" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">đổi</text><rect x="40" y="292" width="240" height="50" rx="10" fill="#fff" stroke="#b7c7c5" stroke-width="1.6"/><text x="160" y="323" font-size="14" fill="#5b6b73" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Xếp lên kệ</text><rect x="360" y="292" width="240" height="50" rx="10" fill="#fff" stroke="#1f7a74" stroke-width="1.6"/><text x="480" y="323" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Xếp lên kệ</text><circle cx="24" cy="317" r="11" fill="#14524f"/><text x="24" y="322" font-size="11" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">4</text><line x1="284" y1="317" x2="356" y2="317" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 4"/><text x="320" y="310" font-size="11" fill="#5b6b73" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">giữ</text><text x="320" y="380" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ba bước giữ nguyên. Chỉ cần tập trung học bước số 3.</text></svg>