<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Ba thẻ vai trò trong nhóm. Người giữ giờ, hình đồng hồ: báo khi còn 5 phút. Người ghi chép, hình cuốn sổ: ghi ai làm gì, hạn khi nào, gửi lại nhóm. Người nhắc việc, hình chuông: một ngày trước hạn, hỏi tiến độ từng phần."><title>Ba thẻ vai trò trong nhóm. Người giữ giờ, hình đồng hồ: báo khi còn 5 phút. Người ghi chép, hình cuốn sổ: ghi ai làm gì, hạn khi nào, gửi lại nhóm. Người nhắc việc, hình chuông: một ngày trước hạn, hỏi tiến độ từng phần.</title><rect width="640" height="400" rx="18" fill="#fdf8ef"/><text x="320" y="32" font-size="20" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ba vai nhỏ trong nhóm</text><rect x="22" y="54" width="188" height="312" rx="16" fill="#fff" stroke="#1f7a74" stroke-width="2.5"/><circle cx="116" cy="130" r="44" fill="#1f7a74" fill-opacity=".15"/><circle cx="116" cy="130" r="28" fill="#fff" stroke="#1f7a74" stroke-width="4"/><path d="M116,130 L116,112 M116,130 L129,136" stroke="#1d2a33" stroke-width="3.5" stroke-linecap="round"/><text x="116" y="206" font-size="15.5" fill="#1f7a74" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Người giữ giờ</text><circle cx="44" cy="246" r="4" fill="#1f7a74"/><text x="56" y="251" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Báo khi còn 5 phút</text><circle cx="44" cy="282" r="4" fill="#1f7a74"/><text x="56" y="287" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Nhắc chuyển việc</text><circle cx="44" cy="318" r="4" fill="#1f7a74"/><text x="56" y="323" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Giữ buổi họp đúng giờ</text><rect x="226" y="54" width="188" height="312" rx="16" fill="#fff" stroke="#d98a1c" stroke-width="2.5"/><circle cx="320" cy="130" r="44" fill="#d98a1c" fill-opacity=".15"/><rect x="296" y="100" width="48" height="60" rx="5" fill="#fff" stroke="#d98a1c" stroke-width="3.5"/><line x1="306" y1="114" x2="334" y2="114" stroke="#5b6b73" stroke-width="2.5"/><line x1="306" y1="125" x2="334" y2="125" stroke="#5b6b73" stroke-width="2.5"/><line x1="306" y1="136" x2="334" y2="136" stroke="#5b6b73" stroke-width="2.5"/><line x1="306" y1="147" x2="334" y2="147" stroke="#5b6b73" stroke-width="2.5"/><text x="320" y="206" font-size="15.5" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Người ghi chép</text><circle cx="248" cy="246" r="4" fill="#d98a1c"/><text x="260" y="251" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ai làm gì</text><circle cx="248" cy="282" r="4" fill="#d98a1c"/><text x="260" y="287" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hạn khi nào</text><circle cx="248" cy="318" r="4" fill="#d98a1c"/><text x="260" y="323" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Gửi lại nhóm sau buổi</text><rect x="430" y="54" width="188" height="312" rx="16" fill="#fff" stroke="#2563a8" stroke-width="2.5"/><circle cx="524" cy="130" r="44" fill="#2563a8" fill-opacity=".15"/><path d="M502,146 q4,-4 4,-20 q0,-22 18,-22 q18,0 18,22 q0,16 4,20 z" fill="#fff" stroke="#2563a8" stroke-width="3.5"/><circle cx="524" cy="154" r="5" fill="#2563a8"/><text x="524" y="206" font-size="15.5" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Người nhắc việc</text><circle cx="452" cy="246" r="4" fill="#2563a8"/><text x="464" y="251" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Một ngày trước hạn</text><circle cx="452" cy="282" r="4" fill="#2563a8"/><text x="464" y="287" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hỏi tiến độ từng phần</text><circle cx="452" cy="318" r="4" fill="#2563a8"/><text x="464" y="323" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hỏi có cần hỗ trợ</text><text x="320" y="388" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Nhận vai thì nói rõ: “Hôm nay mình giữ giờ nhé.”</text></svg>