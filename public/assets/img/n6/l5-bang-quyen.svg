<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Bảng quyền quyết định của một công ty sản xuất, giả định. Hàng là các quyết định: giảm giá cho khách lớn, tuyển trưởng phòng, mua máy dưới 500 triệu, đổi nhà cung cấp chính, ra mẫu sản phẩm mới. Cột là các vai: đề xuất, được hỏi ý kiến, quyết, được báo. Mỗi hàng chỉ có một ô quyết."><title>Bảng quyền quyết định của một công ty sản xuất, giả định. Hàng là các quyết định: giảm giá cho khách lớn, tuyển trưởng phòng, mua máy dưới 500 triệu, đổi nhà cung cấp chính, ra mẫu sản phẩm mới. Cột là các vai: đề xuất, được hỏi ý kiến, quyết, được báo. Mỗi hàng chỉ có một ô quyết.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Bảng quyền quyết định (rút gọn)</text><rect x="24" y="48" width="592" height="36" rx="8" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.5"/><text x="110" y="71" font-size="13" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Quyết định</text><text x="248.0" y="71" font-size="13" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Đề xuất</text><text x="352.0" y="71" font-size="13" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Được hỏi</text><text x="456.0" y="71" font-size="13" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Quyết</text><text x="560.0" y="71" font-size="13" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Được báo</text><rect x="24" y="90" width="592" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1"/><text x="32" y="118" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Giảm giá khách lớn ≤ 5%</text><text x="248.0" y="118" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">NV KD</text><text x="352.0" y="118" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">KT giá</text><rect x="410" y="96" width="92" height="34" rx="8" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="456.0" y="118" font-size="12.5" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">GĐ KD</text><text x="560.0" y="118" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">GĐ SX</text><rect x="24" y="142" width="592" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1"/><text x="32" y="170" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tuyển trưởng phòng</text><text x="248.0" y="170" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">GĐ khối</text><text x="352.0" y="170" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Nhân sự</text><rect x="410" y="148" width="92" height="34" rx="8" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="456.0" y="170" font-size="12.5" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="s