<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Một thông điệp đi qua bốn cấp, giả định. Ban điều hành: năm nay ưu tiên giữ khách cũ, chưa mở thêm chi nhánh. Giám đốc khối: năm nay tập trung khách cũ. Trưởng phòng: năm nay công ty khó khăn. Tổ trưởng: sắp cắt giảm người. Mỗi cấp bỏ bớt một phần, đến tuyến đầu thì nghĩa đã khác."><title>Một thông điệp đi qua bốn cấp, giả định. Ban điều hành: năm nay ưu tiên giữ khách cũ, chưa mở thêm chi nhánh. Giám đốc khối: năm nay tập trung khách cũ. Trưởng phòng: năm nay công ty khó khăn. Tổ trưởng: sắp cắt giảm người. Mỗi cấp bỏ bớt một phần, đến tuyến đầu thì nghĩa đã khác.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Thông điệp đi qua bốn cấp</text><rect x="40.0" y="52" width="560" height="60" rx="12" fill="#e8f0fa" stroke="#2563a8" stroke-width="2"/><text x="320" y="76" font-size="13" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ban điều hành</text><text x="320" y="98" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">“Ưu tiên giữ khách cũ, chưa mở chi nhánh mới”</text><line x1="320" y1="112" x2="320" y2="128" stroke="#5b6b73" stroke-width="2"/><circle cx="320" cy="128" r="4.5" fill="#5b6b73"/><rect x="70.0" y="130" width="500" height="60" rx="12" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="320" y="154" font-size="13" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Giám đốc khối</text><text x="320" y="176" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">“Năm nay tập trung khách cũ”</text><line x1="320" y1="190" x2="320" y2="206" stroke="#5b6b73" stroke-width="2"/><circle cx="320" cy="206" r="4.5" fill="#5b6b73"/><rect x="100.0" y="208" width="440" height="60" rx="12" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="320" y="232" font-size="13" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Trưởng phòng</text><text x="320" y="254" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">“Năm nay công ty khó khăn”</text><line x1="320" y1="268" x2="320" y2="284" stroke="#5b6b73" stroke-width="2"/><circle cx="320" cy="284" r="4.5" fill="#5b6b73"/><rect x="130.0" y="286" width="380" height="60" rx="12" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><text x="320" y="310" font-size="13" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tổ trưởng</text><text x="320" y="332" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">“Sắp cắt giảm người”</text><text x="320" y="382" font-size="13.5" fill="#b03a2e" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Mỗi cấp bỏ bớt một phần. Đến tuyến đầu, nghĩa đã khác.</text></svg>