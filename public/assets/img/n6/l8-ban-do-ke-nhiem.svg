<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Bản đồ kế nhiệm của 4 vị trí then chốt, giả định. Giám đốc tài chính: có người sẵn sàng ngay. Giám đốc nhà máy: có người sau 1 đến 2 năm. Giám đốc kinh doanh: có người sau 3 năm. Trưởng phòng công nghệ: chưa có ai, ô màu đỏ, đưa vào Sổ rủi ro."><title>Bản đồ kế nhiệm của 4 vị trí then chốt, giả định. Giám đốc tài chính: có người sẵn sàng ngay. Giám đốc nhà máy: có người sau 1 đến 2 năm. Giám đốc kinh doanh: có người sau 3 năm. Trưởng phòng công nghệ: chưa có ai, ô màu đỏ, đưa vào Sổ rủi ro.</title><rect width="640" height="400" rx="18" fill="#fdf8ef"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Bản đồ kế nhiệm: 4 vị trí then chốt</text><rect x="200" y="50" width="132" height="34" rx="8" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.5"/><text x="266.0" y="72" font-size="13" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sẵn sàng ngay</text><rect x="340" y="50" width="132" height="34" rx="8" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.5"/><text x="406.0" y="72" font-size="13" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sau 1–2 năm</text><rect x="480" y="50" width="132" height="34" rx="8" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.5"/><text x="546.0" y="72" font-size="13" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sau 3 năm+</text><rect x="24" y="96" width="164" height="56" rx="10" fill="#fff" stroke="#9fb9b6" stroke-width="1.5"/><text x="106" y="129" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,A