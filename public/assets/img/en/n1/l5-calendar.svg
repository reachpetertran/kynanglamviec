" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hand</text><text x="399" y="179" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">in</text><circle cx="399" cy="230" r="20" fill="none" stroke="#b3261e" stroke-width="3"/><text x="399" y="236" font-size="18" fill="#b3261e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">!</text><circle cx="120" cy="340" r="36" fill="#fff" stroke="#14524f" stroke-width="4"/><path d="M120,340 v-22 M120,340 h16" stroke="#14524f" stroke-width="4" stroke-linecap="round"/><text x="370" y="330" font-size="16" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Write the deadline down.</text><text x="370" y="354" font-size="16" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Set a halfway check day.</text></svg>