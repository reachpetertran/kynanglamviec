stem,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">in 3 weeks</text><text x="170" y="312" font-size="13" fill="#1e7d4f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Say: "These are real"</text><rect x="330" y="168" width="280" height="170" rx="12" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="470" y="198" font-size="16" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Forecast figures</text><text x="470" y="240" font-size="18" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">200 orders a month</text><text x="470" y="266" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">after 6 months</text><text x="470" y="312" font-size="13" fill="#d98a1c" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Say: "This is a forecast"</text><text x="320" y="374" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Check: the listener restates your request correctly.</text></svg>