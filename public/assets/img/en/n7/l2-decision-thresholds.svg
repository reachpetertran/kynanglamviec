<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="A hypothetical decision threshold bar. The metric is the number of pre-orders with a deposit in 2 weeks. Fewer than 10 is the red zone: stop or change direction in a big way. 10 to 29 is the amber zone: pivot one element. 30 or more is the green zone: continue. The actual result is 18, in the amber zone."><title>A hypothetical decision threshold bar. The metric is the number of pre-orders with a deposit in 2 weeks. Fewer than 10 is the red zone: stop or change direction in a big way. 10 to 29 is the amber zone: pivot one element. 30 or more is the green zone: continue. The actual result is 18, in the amber zone.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Three decision zones, drawn before the test</text><text x="320" y="62" font-size="14" fill="#5b6b73" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Metric: pre-orders with a deposit in 2 weeks</text><rect x="40.0" y="110" width="140.0" height="70" rx="8" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><text x="110.0" y="151" font-size="13" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Stop / big change</text><rect x="180.0" y="110" width="280.0" height="70" rx="8" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="383.0" y="151" font-size="13" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Pivot one element</text><rect x="460.0" y="110" width="140.0" height="70" rx="8" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="530.0" y="151" font-size="13" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Continue</text><text x="40.0" y="204" font-size="12.5" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">0</text><text x="180.0" y="204" font-size="12.5" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">10</text><text x="320.0" y="204" font-size="12.5" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">20</text><text x="460.0" y="204" font-size="12.5" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">30</text><text x="600.0" y="204" font-size="12.5" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">40</text><line x1="292.0" y1="96" x2="292.0" y2="196" stroke="#1d2a33" stroke-width="3"/><rect x="212.0" y="232" width="160" height="52" rx="10" fill="#fff" stroke="#1d2a33" stroke-width="2"/><text x="292.0" y="256" font-size="12.5" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Actual result</text><text x="292.0" y="276" font-size="16" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">18 orders</text><rect x="40" y="312" width="560" height="64" rx="12" fill="#fff" stroke="#9fb9b6" stroke-width="1.5"/><text x="320" y="338" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Write first: hypothesis · test · metric · thresholds · time limit, max cost</text><text x="320" y="360" font-size="13" fill="#b03a2e" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Once you have the result, do not move the thresholds.</text></svg>