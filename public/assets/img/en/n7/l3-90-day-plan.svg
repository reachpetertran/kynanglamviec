<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="A hypothetical 90-day plan for a bakery. Three milestones on a timeline. Day 30: 50 pre-orders; obstacle: the oven breaks; fallback: rent a shared oven. Day 60: selling in 2 cafés; obstacle: cafés say no; fallback: sell through neighbourhood groups. Day 90: monthly break-even; obstacle: flour prices rise; fallback: change the loaf size."><title>A hypothetical 90-day plan for a bakery. Three milestones on a timeline. Day 30: 50 pre-orders; obstacle: the oven breaks; fallback: rent a shared oven. Day 60: selling in 2 cafés; obstacle: cafés say no; fallback: sell through neighbourhood groups. Day 90: monthly break-even; obstacle: flour prices rise; fallback: change the loaf size.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">A bakery's 90-day plan</text><line x1="60" y1="84" x2="580" y2="84" stroke="#1f7a74" stroke-width="4"/><circle cx="120" cy="84" r="14" fill="#1f7a74"/><text x="120" y="89" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1</text><text x="120" y="122" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Day 30</text><rect x="28" y="136" width="184" height="62" rx="10" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.5"/><text x="120" y="158" font-size="12" fill="#2563a8" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Result</text><text x="120" y="182" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">50 pre-orders</text><rect x="28" y="210" width="184" height="62" rx="10" fill="#fbe9e7" stroke="#b03a2e" stroke-width="1.5"/><text x="120" y="232" font-size="12" fill="#b03a2e" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Expected obstacle</text><text x="120" y="256" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Oven breaks</text><rect x="28" y="284" width="184" height="62" rx="10" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="1.5"/><text x="120" y="306" font-size="12" fill="#1e7d4f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">If… then…</text><text x="120" y="330" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Rent a shared oven</text><circle cx="320" cy="84" r="14" fill="#1f7a74"/><text x="320" y="89" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2</text><text x="320" y="122" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Day 60</text><rect x="228" y="136" width="184" height="62" rx="10" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.5"/><text x="320" y="158" font-size="12" fill="#2563a8" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Result</text><text x="320" y="182" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sell in 2 cafés</text><rect x="228" y="210" width="184" height="62" rx="10" fill="#fbe9e7" stroke="#b03a2e" stroke-width="1.5"/><text x="320" y="232" font-size="12" fill="#b03a2e" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Expected obstacle</text><text x="320" y="256" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Cafés say no</text><rect x="228" y="284" width="184" height="62" rx="10" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="1.5"/><text x="320" y="306" font-size="12" fill="#1e7d4f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">If… then…</text><text x="320" y="330" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sell via local groups</text><circle cx="520" cy="84" r="14" fill="#1f7a74"/><text x="520" y="89" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3</text><text x="520" y="122" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Day 90</text><rect x="428" y="136" width="184" height="62" rx="10" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.5"/><text x="520" y="158" font-size="12" fill="#2563a8" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Result</text><text x="520" y="182" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Monthly break-even</text><rect x="428" y="210" width="184" height="62" rx="10" fill="#fbe9e7" stroke="#b03a2e" stroke-width="1.5"/><text x="520" y="232" font-size="12" fill="#b03a2e" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Expected obstacle</text><text x="520" y="256" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Flour price rises</text><rect x="428" y="284" width="184" height="62" rx="10" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="1.5"/><text x="520" y="306" font-size="12" fill="#1e7d4f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">If… then…</text><text x="520" y="330" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Change loaf size</text><text x="320" y="380" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Decide while calm. When trouble comes, just follow the plan.</text></svg>