<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="A table comparing three business forms in Vietnam against four questions. Household business: the owner is liable with all their assets, least paperwork, hard to raise capital. Limited liability company: liability limited to capital contributed, one or more members, limited ways to raise capital. Joint-stock company: liability limited to capital contributed, at least 3 shareholders, easiest to raise capital, most paperwork."><title>A table comparing three business forms in Vietnam against four questions. Household business: the owner is liable with all their assets, least paperwork, hard to raise capital. Limited liability company: liability limited to capital contributed, one or more members, limited ways to raise capital. Joint-stock company: liability limited to capital contributed, at least 3 shareholders, easiest to raise capital, most paperwork.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Three business forms, four questions (Vietnam)</text><rect x="160" y="48" width="148" height="40" rx="8" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.5"/><text x="234.0" y="73" font-size="13.5" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Household business</text><rect x="316" y="48" width="148" height="40" rx="8" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.5"/><text x="390.0" y="73" font-size="13.5" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">LLC</text><rect x="472" y="48" width="148" height="40" rx="8" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.5"/><text x="546.0" y="73" font-size="13.5" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Joint-stock co.</text><rect x="20" y="100" width="128" height="54" rx="8" fill="#fdf3e2" stroke="#d98a1c" stroke-width="1.5"/><text x="84" y="132" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Liability</text><rect x="160" y="100" width="148" height="54" rx="8" fill="#fbe9e7" stroke="#b03a2e" stroke-width="1.5"/><text x="234.0" y="132" font-size="13" fill="#b03a2e" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">All your assets</text><rect x="316" y="100" width="148" height="54" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="390.0" y="132" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Up to capital paid in</text><rect x="472" y="100" width="148" height="54" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="546.0" y="132" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Up to capital paid in</text><rect x="20" y="164" width="128" height="54" rx="8" fill="#fdf3e2" stroke="#d98a1c" stroke-width="1.5"/><text x="84" y="196" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Owners</text><rect x="160" y="164" width="148" height="54" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="234.0" y="196" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Household head</text><rect x="316" y="164" width="148" height="54" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="390.0" y="196" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1 or more</text><rect x="472" y="164" width="148" height="54" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="546.0" y="196" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3+ shareholders</text><rect x="20" y="228" width="128" height="54" rx="8" fill="#fdf3e2" stroke="#d98a1c" stroke-width="1.5"/><text x="84" y="260" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Raising capital</text><rect x="160" y="228" width="148" height="54" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="234.0" y="260" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hardest</text><rect x="316" y="228" width="148" height="54" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="390.0" y="260" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Limited</text><rect x="472" y="228" width="148" height="54" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="546.0" y="260" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Easiest</text><rect x="20" y="292" width="128" height="54" rx="8" fill="#fdf3e2" stroke="#d98a1c" stroke-width="1.5"/><text x="84" y="324" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Paperwork</text><rect x="160" y="292" width="148" height="54" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="234.0" y="324" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Least</text><rect x="316" y="292" width="148" height="54" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="390.0" y="324" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Medium</text><rect x="472" y="292" width="148" height="54" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="546.0" y="324" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Most</text><text x="320" y="384" font-size="12.5" fill="#5b6b73" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">A summary for comparison. Check the original law before deciding.</text></svg>