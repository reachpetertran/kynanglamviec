oto,Noto Sans,Arial,sans-serif">Each row has only one Decides cell</text><text x="320" y="390" font-size="11" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Abbreviations: dir director, acct accountant, Prod production, div division</text></svg>