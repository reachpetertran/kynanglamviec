<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="A hypothetical decision rights table at a manufacturing company. Rows are decisions: discount for a major client, hiring a department head, buying a machine below a set amount, changing a main supplier, launching a new product design. Columns are roles: proposes, consulted, decides, informed. Each row has only one decides cell."><title>A hypothetical decision rights table at a manufacturing company. Rows are decisions: discount for a major client, hiring a department head, buying a machine below a set amount, changing a main supplier, launching a new product design. Columns are roles: proposes, consulted, decides, informed. Each row has only one decides cell.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Decision rights table (short version)</text><rect x="24" y="48" width="592" height="36" rx="8" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.5"/><text x="110" y="71" font-size="13" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Decision</text><text x="248.0" y="71" font-size="13" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Proposes</text><text x="352.0" y="71" font-size="13" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Consulted</text><text x="456.0" y="71" font-size="13" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Decides</text><text x="560.0" y="71" font-size="13" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Informed</text><rect x="24" y="90" width="592" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1"/><text x="32" y="118" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Major client discount ≤ 5%</text><text x="248.0" y="118" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sales rep</text><text x="352.0" y="118" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Cost acct</text><rect x="410" y="96" width="92" height="34" rx="8" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="456.0" y="118" font-size="12.5" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sales dir</text><text x="560.0" y="118" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Prod dir</text><rect x="24" y="142" width="592" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1"/><text x="32" y="170" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hire a dept head</text><text x="248.0" y="170" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Div dir</text><text x="352.0" y="170" font-size="12" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">HR</text><rect x="410" y="148" width="92" height="34" rx="8" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2