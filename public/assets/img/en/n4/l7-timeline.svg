<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Timeline of Vietnam&#x27;s Decree 283/2026/ND-CP. 15 July 2026: signed by the Government. 10 September 2026: enters into force, and Decree 12/2022/ND-CP ceases to apply. A violation that took place and ended before 10 September 2026 is handled under the rule in force at that time. A violation still continuing after 10 September 2026 falls under Decree 283."><title>Timeline of Vietnam's Decree 283/2026/ND-CP. 15 July 2026: signed by the Government. 10 September 2026: enters into force, and Decree 12/2022/ND-CP ceases to apply. A violation that took place and ended before 10 September 2026 is handled under the rule in force at that time. A violation still continuing after 10 September 2026 falls under Decree 283.</title><rect width="640" height="400" rx="18" fill="#f4f8f8"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Three dates when you read a new rule</text><text x="320" y="52" font-size="13" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Real example (Vietnam): Decree 283/2026/ND-CP (Art. 66, 67)</text><line x1="40" y1="160" x2="600" y2="160" stroke="#14524f" stroke-width="4"/><rect x="40" y="148" width="300" height="24" rx="4" fill="#5b6b73" fill-opacity=".25"/><rect x="340" y="148" width="260" height="24" rx="4" fill="#1f7a74" fill-opacity=".3"/><text x="190" y="140" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Decree 12/2022 still applies</text><text x="470" y="140" font-size="12.5" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Decree 283/2026 applies</text><circle cx="120" cy="160" r="10" fill="#2563a8"/><text x="120" y="198" font-size="15" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">15/7/2026</text><text x="120" y="218" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Signed</text><circle cx="340" cy="160" r="10" fill="#1e7d4f"/><text x="340" y="198" font-size="15" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">10/9/2026</text><text x="340" y="218" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">In force</text><text x="340" y="236" font-size="12" fill="#b03a2e" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Decree 12/2022 ends</text><rect x="30" y="260" width="285" height="120" rx="12" fill="#fff" stroke="#5b6b73" stroke-width="2"/><text x="46" y="284" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Act ended before 10 Sep</text><text x="46" y="308" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Apply the rule in force</text><text x="46" y="326" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">when the act took place</text><text x="46" y="344" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">(Article 67(1))</text><rect x="325" y="260" width="285" height="120" rx="12" fill="#fff" stroke="#1f7a74" stroke-width="2"/><text x="341" y="284" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Act continues after 10 Sep</text><text x="341" y="308" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Apply Decree 283/2026</text><text x="341" y="326" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">(Article 67(2))</text></svg>