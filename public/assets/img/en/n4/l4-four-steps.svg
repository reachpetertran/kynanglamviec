<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Four steps to resolve a hypothetical disagreement between a design engineer and a production engineer about a part&#x27;s tolerance. Step 1, facts: 6 of 200 parts were out of tolerance. Step 2, interpretations: design blames the old machine, production says the tolerance is too tight. Step 3, shared criteria: the part must assemble, with no extra cost. Step 4, test: measure 50 parts on another machine."><title>Four steps to resolve a hypothetical disagreement between a design engineer and a production engineer about a part's tolerance. Step 1, facts: 6 of 200 parts were out of tolerance. Step 2, interpretations: design blames the old machine, production says the tolerance is too tight. Step 3, shared criteria: the part must assemble, with no extra cost. Step 4, test: measure 50 parts on another machine.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Resolving disagreement: facts to test</text><rect x="30" y="48" width="360" height="74" rx="12" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="46" y="72" font-size="15" fill="#1e7d4f" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1. Shared facts</text><text x="46" y="94" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">6 of 200 parts out of tolerance</text><text x="46" y="113" font-size="12.5" fill="#5b6b73" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Both sides accept this</text><line x1="210" y1="122" x2="242" y2="134" stroke="#1e7d4f" stroke-width="2.5"/><circle cx="242" cy="134" r="4.5" fill="#1e7d4f"/><rect x="62" y="134" width="360" height="74" rx="12" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="78" y="158" font-size="15" fill="#d98a1c" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2. Each side's reading</text><text x="78" y="180" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sara (design): old machine</text><text x="78" y="199" font-size="12.5" fill="#5b6b73" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ken (production): tight tolerance</text><line x1="242" y1="208" x2="274" y2="220" stroke="#d98a1c" stroke-width="2.5"/><circle cx="274" cy="220" r="4.5" fill="#d98a1c"/><rect x="94" y="220" width="360" height="74" rx="12" fill="#e8f0fa" stroke="#2563a8" stroke-width="2"/><text x="110" y="244" font-size="15" fill="#2563a8" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3. Shared criteria</text><text x="110" y="266" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">① It assembles</text><text x="110" y="285" font-size="12.5" fill="#5b6b73" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">② No extra cost</text><line x1="274" y1="294" x2="306" y2="306" stroke="#2563a8" stroke-width="2.5"/><circle cx="306" cy="306" r="4.5" fill="#2563a8"/><rect x="126" y="306" width="360" height="74" rx="12" fill="#e3f0ee" stroke="#14524f" stroke-width="2"/><text x="142" y="330" font-size="15" fill="#14524f" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">4. Test</text><text x="142" y="352" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">50 parts, another machine</text><text x="142" y="371" font-size="12.5" fill="#5b6b73" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Measured together, by Thursday</text><rect x="500" y="50" width="120" height="150" rx="12" fill="#fff" stroke="#d98a1c" stroke-width="2"/><text x="560" y="76" font-size="13" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Before you</text><text x="560" y="93" font-size="13" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">reply:</text><text x="560" y="122" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Restate the</text><text x="560" y="139" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">other view.</text><text x="560" y="156" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">"Have I got</text><text x="560" y="173" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">that right?"</text></svg>