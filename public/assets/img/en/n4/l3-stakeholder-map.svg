"262" font-size="12" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Influ-</text><text x="52" y="277" font-size="12" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">ence:</text><text x="52" y="292" font-size="12" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">low</text><text x="220" y="372" font-size="13" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Affected a little</text><text x="480" y="372" font-size="13" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Affected a lot</text><rect x="110" y="70" width="220" height="104" rx="12" fill="#e8f0fa" stroke="#2563a8" stroke-width="2"/><circle cx="136" cy="98" r="12" fill="#2563a8"/><text x="156" y="103" font-size="14" fill="#2563a8" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Operations director</text><text x="220" y="136" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Decides. Needs a one-</text><text x="220" y="154" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">page proposal with data</text><rect x="370" y="70" width="220" height="104" rx="12" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><circle cx="396" cy="98" r="12" fill="#b03a2e"/><text x="416" y="103" font-size="14" fill="#b03a2e" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Warehouse supervisor</text><text x="480" y="136" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Could block. Trucks waiting?</text><text x="480" y="154" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Meet one to one first!</text><rect x="110" y="220" width="220" height="104" rx="12" fill="#f1f4f5" stroke="#5b6b73" stroke-width="2"/><circle cx="136" cy="248" r="12" fill="#5b6b73"/><text x="156" y="253" font-size="14" fill="#5b6b73" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Accounts</text><text x="220" y="286" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Need scanner costs and</text><text x="220" y="304" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">the monthly stock gap</text><rect x="370" y="220" width="220" height="104" rx="12" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><circle cx="396" cy="248" r="12" fill="#d98a1c"/><text x="416" y="253" font-size="14" fill="#d98a1c" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Night-shift staff</text><text x="480" y="286" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Live the change daily.</text><text x="480" y="304" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Need training, start later</text></svg>