<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Four rungs of handover when mentoring, hypothetical, for preparing quotes. Rung 1, demonstrate: week 1. Rung 2, do together: weeks 2 to 3. Rung 3, observe: weeks 4 to 6, checked before going to the client. Rung 4, do alone: from week 7, reporting back after sending. Each rung rises like a ladder."><title>Four rungs of handover when mentoring, hypothetical, for preparing quotes. Rung 1, demonstrate: week 1. Rung 2, do together: weeks 2 to 3. Rung 3, observe: weeks 4 to 6, checked before going to the client. Rung 4, do alone: from week 7, reporting back after sending. Each rung rises like a ladder.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Four rungs of handover when mentoring</text><rect x="40" y="280" width="135" height="80" rx="8" fill="#fff" stroke="#5b6b73" stroke-width="2.5"/><text x="107" y="306" font-size="15" fill="#5b6b73" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1. Demonstrate</text><text x="107" y="328" font-size="11.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">I do, you watch</text><text x="107" y="348" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Week 1</text><rect x="185" y="220" width="135" height="140" rx="8" fill="#fff" stroke="#2563a8" stroke-width="2.5"/><text x="252" y="246" font-size="15" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2. Do together</text><text x="252" y="268" font-size="11.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">You do, I sit beside</text><text x="252" y="288" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Weeks 2–3</text><rect x="330" y="160" width="135" height="200" rx="8" fill="#fff" stroke="#d98a1c" stroke-width="2.5"/><text x="397" y="186" font-size="15" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3. Observe</text><text x="397" y="208" font-size="11.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">You do, I check first</text><text x="397" y="228" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Weeks 4–6</text><rect x="475" y="100" width="135" height="260" rx="8" fill="#fff" stroke="#1e7d4f" stroke-width="2.5"/><text x="542" y="126" font-size="15" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">4. Do alone</text><text x="542" y="148" font-size="11.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">You do, report after</text><text x="542" y="168" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">From week 7</text><text x="40" y="76" font-size="13" fill="#d98a1c" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Learner: steps up one rung at a time</text><text x="40" y="98" font-size="13" fill="#14524f" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Mentor: steps back one step at a time</text><text x="320" y="388" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sample task: quotes for mid-sized clients (hypothetical)</text></svg>