<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="A hypothetical role-shift sheet for a newly promoted sewing line leader. Let go: sewing difficult samples, repairing defective items, fetching materials. Keep: approving the first sample on the line, until the end of February. Start: a 10-minute start-of-shift meeting, assigning work from a board, weekly one-to-ones with 3 people, mentoring 2 workers on the difficult operation."><title>A hypothetical role-shift sheet for a newly promoted sewing line leader. Let go: sewing difficult samples, repairing defective items, fetching materials. Keep: approving the first sample on the line, until the end of February. Start: a 10-minute start-of-shift meeting, assigning work from a board, weekly one-to-ones with 3 people, mentoring 2 workers on the difficult operation.</title><rect width="640" height="400" rx="18" fill="#fdf8ef"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">A new line leader's role-shift sheet</text><rect x="24" y="54" width="188" height="300" rx="14" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><text x="118" y="88" font-size="20" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Let go</text><text x="118" y="110" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">hand to the team</text><rect x="36" y="128" width="164" height="34" rx="8" fill="#fff" stroke="#b03a2e" stroke-width="1.5"/><text x="118" y="150" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sewing hard samples</text><rect x="36" y="172" width="164" height="34" rx="8" fill="#fff" stroke="#b03a2e" stroke-width="1.5"/><text x="118" y="194" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Repairing defects</text><rect x="36" y="216" width="164" height="34" rx="8" fill="#fff" stroke="#b03a2e" stroke-width="1.5"/><text x="118" y="238" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Fetching materials</text><rect x="226" y="54" width="188" height="300" rx="14" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="320" y="88" font-size="20" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Keep</text><text x="320" y="110" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">few, time-limited</text><rect x="238" y="128" width="164" height="34" rx="8" fill="#fff" stroke="#d98a1c" stroke-width="1.5"/><text x="320" y="150" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Approve first sample</text><rect x="238" y="172" width="164" height="34" rx="8" fill="#fff" stroke="#d98a1c" stroke-width="1.5"/><text x="320" y="194" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">(until end of Feb)</text><rect x="428" y="54" width="188" height="300" rx="14" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="522" y="88" font-size="20" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Start</text><text x="522" y="110" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">a manager's work</text><rect x="440" y="128" width="164" height="34" rx="8" fill="#fff" stroke="#1e7d4f" stroke-width="1.5"/><text x="522" y="150" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">10-min shift briefing</text><rect x="440" y="172" width="164" height="34" rx="8" fill="#fff" stroke="#1e7d4f" stroke-width="1.5"/><text x="522" y="194" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Assign from a board</text><rect x="440" y="216" width="164" height="34" rx="8" fill="#fff" stroke="#1e7d4f" stroke-width="1.5"/><text x="522" y="238" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Weekly 1-1s, 3 people</text><rect x="440" y="260" width="164" height="34" rx="8" fill="#fff" stroke="#1e7d4f" stroke-width="1.5"/><text x="522" y="282" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Mentor 2 on hard step</text><line x1="214" y1="370" x2="426" y2="370" stroke="#14524f" stroke-width="3"/><circle cx="426" cy="370" r="4.5" fill="#14524f"/><text x="320" y="392" font-size="13" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Let go of old work → time for the new</text></svg>