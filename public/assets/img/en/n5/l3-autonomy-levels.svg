<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Four levels of autonomy when delegating. Level 1: follow the instructions, ask if anything is different. Level 2: propose options, wait for approval, then act. Level 3: act alone, report back when done. Level 4: decide fully alone, report at the regular meeting. The higher the level, the less the manager steps in."><title>Four levels of autonomy when delegating. Level 1: follow the instructions, ask if anything is different. Level 2: propose options, wait for approval, then act. Level 3: act alone, report back when done. Level 4: decide fully alone, report at the regular meeting. The higher the level, the less the manager steps in.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Four levels of autonomy</text><rect x="30" y="230" width="136" height="120" rx="12" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><circle cx="98" cy="260" r="17" fill="#b03a2e"/><text x="98" y="266" font-size="16" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1</text><text x="98" y="300" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Follow instructions</text><text x="98" y="320" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">ask if anything differs</text><rect x="178" y="185" width="136" height="165" rx="12" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><circle cx="246" cy="215" r="17" fill="#d98a1c"/><text x="246" y="221" font-size="16" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2</text><text x="246" y="255" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Propose, await OK</text><text x="246" y="275" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">then act</text><rect x="326" y="140" width="136" height="210" rx="12" fill="#e8f0fa" stroke="#2563a8" stroke-width="2"/><circle cx="394" cy="170" r="17" fill="#2563a8"/><text x="394" y="176" font-size="16" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3</text><text x="394" y="210" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Act, then report</text><text x="394" y="230" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">report when done</text><rect x="474" y="95" width="136" height="255" rx="12" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><circle cx="542" cy="125" r="17" fill="#1e7d4f"/><text x="542" y="131" font-size="16" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">4</text><text x="542" y="165" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Decide fully alone</text><text x="542" y="185" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">report at reviews</text><line x1="40" y1="366" x2="600" y2="366" stroke="#14524f" stroke-width="2.5"/><circle cx="600" cy="366" r="4.5" fill="#14524f"/><text x="320" y="390" font-size="12.5" fill="#14524f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Manager steps in less and less →</text><text x="98" y="80" font-size="12.5" fill="#b03a2e" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">High risk,</text><text x="98" y="96" font-size="12.5" fill="#b03a2e" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">new person</text><text x="542" y="60" font-size="12.5" fill="#1e7d4f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Familiar work,</text><text x="542" y="76" font-size="12.5" fill="#1e7d4f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">low risk</text></svg>