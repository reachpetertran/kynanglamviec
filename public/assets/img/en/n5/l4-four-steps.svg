<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="The four steps of a coaching one-to-one, each with a sample question. Goal: what would you like to leave with today. Reality: where are things now, what have you tried. Options: what else could you do. Next step: what will you do first, and when. Below: the manager listens more than they talk, and the employee talks more."><title>The four steps of a coaching one-to-one, each with a sample question. Goal: what would you like to leave with today. Reality: where are things now, what have you tried. Options: what else could you do. Next step: what will you do first, and when. Below: the manager listens more than they talk, and the employee talks more.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">One-to-one: four question steps</text><rect x="24" y="60" width="136" height="180" rx="14" fill="#e8f0fa" stroke="#2563a8" stroke-width="2"/><circle cx="92" cy="94" r="18" fill="#2563a8"/><text x="92" y="100" font-size="16" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1</text><text x="92" y="140" font-size="15" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Goal</text><path d="M38 160 h108 a8 8 0 0 1 8 8 v40 a8 8 0 0 1 -8 8 h-70 l-10 10 v-10 h-28 a8 8 0 0 1 -8 -8 v-40 a8 8 0 0 1 8 -8z" fill="#fff" stroke="#2563a8" stroke-width="1.5"/><text x="92" y="182" font-size="11.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">What would you like</text><text x="92" y="198" font-size="11.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">to leave with today?</text><line x1="160" y1="150" x2="176" y2="150" stroke="#14524f" stroke-width="2"/><circle cx="176" cy="150" r="4.5" fill="#14524f"/><rect x="176" y="60" width="136" height="180" rx="14" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><circle cx="244" cy="94" r="18" fill="#d98a1c"/><text x="244" y="100" font-size="16" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2</text><text x="244" y="140" font-size="15" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Reality</text><path d="M190 160 h108 a8 8 0 0 1 8 8 v40 a8 8 0 0 1 -8 8 h-70 l-10 10 v-10 h-28 a8 8 0 0 1 -8 -8 v-40 a8 8 0 0 1 8 -8z" fill="#fff" stroke="#d98a1c" stroke-width="1.5"/><text x="244" y="182" font-size="11.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Where are things now?</text><text x="244" y="198" font-size="11.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">What have you tried?</text><line x1="312" y1="150" x2="328" y2="150" stroke="#14524f" stroke-width="2"/><circle cx="328" cy="150" r="4.5" fill="#14524f"/><rect x="328" y="60" width="136" height="180" rx="14" fill="#e3f0ee" stroke="#1f7a74" stroke-width="2"/><circle cx="396" cy="94" r="18" fill="#1f7a74"/><text x="396" y="100" font-size="16" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3</text><text x="396" y="140" font-size="15" fill="#1f7a74" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Options</text><path d="M342 160 h108 a8 8 0 0 1 8 8 v40 a8 8 0 0 1 -8 8 h-70 l-10 10 v-10 h-28 a8 8 0 0 1 -8 -8 v-40 a8 8 0 0 1 8 -8z" fill="#fff" stroke="#1f7a74" stroke-width="1.5"/><text x="396" y="182" font-size="11.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">What else</text><text x="396" y="198" font-size="11.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">could you do?</text><line x1="464" y1="150" x2="480" y2="150" stroke="#14524f" stroke-width="2"/><circle cx="480" cy="150" r="4.5" fill="#14524f"/><rect x="480" y="60" width="136" height="180" rx="14" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><circle cx="548" cy="94" r="18" fill="#1e7d4f"/><text x="548" y="100" font-size="16" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">4</text><text x="548" y="140" font-size="15" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Next step</text><path d="M494 160 h108 a8 8 0 0 1 8 8 v40 a8 8 0 0 1 -8 8 h-70 l-10 10 v-10 h-28 a8 8 0 0 1 -8 -8 v-40 a8 8 0 0 1 8 -8z" fill="#fff" stroke="#1e7d4f" stroke-width="1.5"/><text x="548" y="182" font-size="11.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">What will you do first?</text><text x="548" y="198" font-size="11.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">When?</text><text x="320" y="276" font-size="14" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Who talks more?</text><text x="110" y="312" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Manager</text><rect x="200" y="300" width="120" height="16" rx="5" fill="#d98a1c"/><text x="330" y="313" font-size="12" fill="#5b6b73" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">asks, sums up, waits</text><text x="110" y="348" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Employee</text><rect x="200" y="336" width="300" height="16" rx="5" fill="#1e7d4f"/><text x="510" y="349" font-size="12" fill="#5b6b73" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">tells, thinks, chooses</text><text x="320" y="386" font-size="11.5" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">An illustration of the idea, not a measurement</text></svg>