<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="A Job-ready file cover with 6 sheets sticking out: direction map, job ad checklist, one-page CV, interview sheet, first-week notebook, process notebook. Beside it is a peer-check list to complete with a friend."><title>A Job-ready file cover with 6 sheets sticking out: direction map, job ad checklist, one-page CV, interview sheet, first-week notebook, process notebook. Beside it is a peer-check list to complete with a friend.</title><rect width="640" height="400" rx="18" fill="#fdf3e2"/><text x="320" y="32" font-size="20" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Job-ready file</text><rect x="60" y="62" width="300" height="40" rx="6" fill="#fff" stroke="#d98a1c" stroke-width="2"/><circle cx="84" cy="82" r="11" fill="#d98a1c"/><text x="84" y="87" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1</text><text x="104" y="87" font-size="14" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Direction map</text><rect x="66" y="106" width="300" height="40" rx="6" fill="#fff" stroke="#b03a2e" stroke-width="2"/><circle cx="90" cy="126" r="11" fill="#b03a2e"/><text x="90" y="131" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2</text><text x="110" y="131" font-size="14" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Job ad checklist</text><rect x="72" y="150" width="300" height="40" rx="6" fill="#fff" stroke="#1f7a74" stroke-width="2"/><circle cx="96" cy="170" r="11" fill="#1f7a74"/><text x="96" y="175" font-size="12" fill="#fff" text-anch