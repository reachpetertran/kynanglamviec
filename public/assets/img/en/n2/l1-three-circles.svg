<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Three overlapping circles: what I like doing, what I can do with evidence, my real conditions. The overlap in the middle is a direction to test."><title>Three overlapping circles: what I like doing, what I can do with evidence, my real conditions. The overlap in the middle is a direction to test.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="34" font-size="20" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Three circles to choose a direction</text><circle cx="250" cy="170" r="105" fill="#d98a1c" fill-opacity=".22" stroke="#d98a1c" stroke-width="2"/><circle cx="390" cy="170" r="105" fill="#1f7a74" fill-opacity=".2" stroke="#1f7a74" stroke-width="2"/><circle cx="320" cy="280" r="105" fill="#2563a8" fill-opacity=".16" stroke="#2563a8" stroke-width="2"/><text x="215" y="112" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">What do I</text><text x="215" y="130" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">like doing?</text><text x="212" y="152" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hours fly by,</text><text x="212" y="168" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">never boring</text><text x="425" y="112" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">What can</text><text x="425" y="130" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">I do?</text><text x="428" y="152" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">With evidence:</text><text x="428" y="168" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">products, grades</text><text x="320" y="325" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Real conditions</text><text x="320" y="345" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Time, travel, cost,</text><text x="320" y="361" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">who is hiring</text><circle cx="320" cy="210" r="34" fill="#fff" stroke="#14524f" stroke-width="2.5"/><text x="320" y="206" font-size="12" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Direction</text><text x="320" y="222" font-size="12" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">to test</text></svg>