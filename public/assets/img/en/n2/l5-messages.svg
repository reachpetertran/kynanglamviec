<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Two phone screens. Left, a vague message: hi, something came up. Right, a clear message: hi, it&#x27;s Lina from the Friday evening shift, I have a fever so I need to miss tonight&#x27;s shift, Theo can cover, could you approve this."><title>Two phone screens. Left, a vague message: hi, something came up. Right, a clear message: hi, it&#x27;s Lina from the Friday evening shift, I have a fever so I need to miss tonight&#x27;s shift, Theo can cover, could you approve this.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><rect x="70" y="22" width="210" height="356" rx="26" fill="#1d2a33" stroke="#1d2a33" stroke-width="1.5"/><rect x="80" y="46" width="190" height="306" rx="14" fill="#f5f7f8" stroke="#f5f7f8" stroke-width="1.5"/><rect x="80" y="46" width="190" height="34" rx="14" fill="#fbe9e7"/><text x="175" y="68" font-size="14" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Vague</text><rect x="360" y="22" width="210" height="356" rx="26" fill="#1d2a33" stroke="#1d2a33" stroke-width="1.5"/><rect x="370" y="46" width="190" height="306" rx="14" fill="#f5f7f8" stroke="#f5f7f8" stroke-width="1.5"/><rect x="370" y="46" width="190" height="34" rx="14" fill="#e6f4ec"/><text x="465" y="68" font-size="14" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Clear, complete</text><rect x="86" y="100" width="150" height="44" rx="12" fill="#fff" stroke="#cfd8dc" stroke-width="1.5"/><text x="161" y="118" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hi,</text><text x="161" y="135" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">something came up</text><rect x="160" y="160" width="120" height="30" rx="12" fill="#dff1ef" stroke="#dff1ef" stroke-width="1.5"/><text x="220" y="180" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">What is it?</text><rect x="86" y="206" width="120" height="30" rx="12" fill="#fff" stroke="#cfd8dc" stroke-width="1.5"/><text x="146" y="226" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tonight</text><rect x="160" y="252" width="120" height="30" rx="12" fill="#dff1ef" stroke="#dff1ef" stroke-width="1.5"/><text x="220" y="272" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">What about it?</text><text x="175" y="330" font-size="12.5" fill="#b03a2e" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Had to ask twice</text><rect x="376" y="96" width="176" height="196" rx="12" fill="#fff" stroke="#cfd8dc" stroke-width="1.5"/><text x="386" y="116" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hi, it&#x27;s Lina from</text><text x="386" y="137" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">the Friday evening shift.</text><text x="386" y="158" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">I have a fever, so I</text><text x="386" y="179" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">need to miss tonight&#x27;s</text><text x="386" y="200" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">18:00–22:00 shift.</text><text x="386" y="221" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Theo can cover for me.</text><text x="386" y="242" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Could you approve this?</text><text x="386" y="263" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Thank you.</text><rect x="436" y="302" width="112" height="30" rx="12" fill="#dff1ef" stroke="#dff1ef" stroke-width="1.5"/><text x="492" y="322" font-size="12.5" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">OK, rest well</text><text x="465" y="346" font-size="12" fill="#1e7d4f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Who · what · need</text></svg>