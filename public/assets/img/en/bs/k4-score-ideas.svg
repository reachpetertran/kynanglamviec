<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="A table scoring three ideas, A, B and C, on four criteria: impact, low cost to test, level of evidence, reversible. Each cell has 1 to 3 dots. Idea A, replacing all the software, has many cells with only 1 dot, so it needs evidence first. Ideas B and C score high on cost and reversibility, so they get a small test. The scores are hypothetical."><title>A table scoring three ideas, A, B and C, on four criteria: impact, low cost to test, level of evidence, reversible. Each cell has 1 to 3 dots. Idea A, replacing all the software, has many cells with only 1 dot, so it needs evidence first. Ideas B and C score high on cost and reversibility, so they get a small test. The scores are hypothetical.</title><rect width="640" height="400" rx="18" fill="#fdf8ef"/><text x="320" y="30" font-size="18.5" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Scoring ideas on 4 criteria (hypothetical)</text><rect x="174" y="50" width="76" height="48" rx="8" fill="#14524f" stroke="#14524f" stroke-width="1.5"/><text x="212.0" y="79" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Impact</text><rect x="254" y="50" width="76" height="48" rx="8" fill="#14524f" stroke="#14524f" stroke-width="1.5"/><text x="292.0" y="70" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Low cost</text><text x="292.0" y="85" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">to test</text><rect x="334" y="50" width="76" height="48" rx="8" fill="#14524f" stroke="#14524f" stroke-width="1.5"/><text x="372.0" y="70" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Level of</text><text x="372.0" y="85" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">evidence</text><rect x="414" y="50" width="76" height="48" rx="8" fill="#14524f" stroke="#14524f" stroke-width="1.5"/><text x="452.0" y="70" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Reversible</text><text x="452.0" y="85" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif"></text><rect x="498" y="50" width="126" height="48" rx="8" fill="#14524f" stroke="#14524f" stroke-width="1.5"/><text x="561.0" y="79" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Decision</text><rect x="16" y="108" width="152" height="74" rx="10" fill="#fff" stroke="#9fb9b6" stroke-width="1.5"/><text x="92" y="140" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">A. Replace all</text><text x="92" y="158" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">warehouse software</text><rect x="174" y="108" width="76" height="74" rx="8" fill="#fff" stroke="#d5e2e0" stroke-width="1.2"/><circle cx="192.0" cy="145" r="7.5" fill="#d98a1c"/><circle cx="212.0" cy="145" r="7.5" fill="#d98a1c"/><circle cx="232.0" cy="145" r="7.5" fill="#d98a1c"/><rect x="254" y="108" width="76" height="74" rx="8" fill="#fff" stroke="#d5e2e0" stroke-width="1.2"/><circle cx="272.0" cy="145" r="7.5" fill="#d98a1c"/><circle cx="292.0" cy="145" r="7.5" fill="