<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Two ways of using passwords compared. Left: one key opens all four doors, email, bank, social media and sales software; lose one and you lose all four. Right: a separate key for each door, plus a phone receiving a two-step code; lose one key and the other three doors stay safe."><title>Two ways of using passwords compared. Left: one key opens all four doors, email, bank, social media and sales software; lose one and you lose all four. Right: a separate key for each door, plus a phone receiving a two-step code; lose one key and the other three doors stay safe.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="18.5" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">One key for every door, or a key for each?</text><rect x="16" y="48" width="296" height="312" rx="14" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><text x="164" y="76" font-size="14.5" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">One shared password</text><rect x="30" y="196" width="58" height="84" rx="6" fill="#fff" stroke="#b03a2e" stroke-width="2.2"/><circle cx="76" cy="240" r="3.5" fill="#b03a2e"/><text x="59" y="298" font-size="11" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Email</text><path d="M164,148 L59,194" stroke="#b03a2e" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="100" y="196" width="58" height="84" rx="6" fill="#fff" stroke="#b03a2e" stroke-width="2.2"/><circle cx="146" cy="240" r="3.5" fill="#b03a2e"/><text x="129" y="298" font-size="11" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Bank</text><path d="M164,148 L129,194" stroke="#b03a2e" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="170" y="196" width="58" height="84" rx="6" fill="#fff" stroke="#b03a2e" stroke-width="2.2"/><circle cx="216" cy="240" r="3.5" fill="#b03a2e"/><text x="199" y="298" font-size="11" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Social</text><path d="M164,148 L199,194" stroke="#b03a2e" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="240" y="196" width="58" height="84" rx="6" fill="#fff" stroke="#b03a2e" stroke-width="2.2"/><circle cx="286" cy="240" r="3.5" fill="#b03a2e"/><text x="269" y="298" font-size="11" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sales app</text><path d="M164,148 L269,194" stroke="#b03a2e" stroke-width="1.6" stroke-dasharray="4 3"/><circle cx="146" cy="128" r="9" fill="none" stroke="#b03a2e" stroke-width="3.5"/><path d="M155,128 h26 m-8,0 v8 m-8,-8 v6" stroke="#b03a2e" stroke-width="3.5" fill="none" stroke-linecap="round"/><text x="164" y="330" font-size="12.5" fill="#b03a2e" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">One leak → criminals try</text><text x="164" y="347" font-size="12.5" fill="#b03a2e" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">every account → lose all four</text><rect x="328" y="48" width="296" height="312" rx="14" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="476" y="76" font-size="14.5" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">One password each + 2-step</text><rect x="342" y="196" width="58" height="84" rx="6" fill="#fff" stroke="#1e7d4f" stroke-width="2.2"/><circle cx="388" cy="240" r="3.5" fill="#1e7d4f"/><text x="371" y="298" font-size="11" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Email</text><circle cx="356" cy="166" r="9" fill="none" stroke="#1f7a74" stroke-width="3.5"/><path d="M365,166 h26 m-8,0 v8 m-8,-8 v6" stroke="#1f7a74" stroke-width="3.5" fill="none" stroke-linecap="round"/><rect x="412" y="196" width="58" height="84" rx="6" fill="#fff" stroke="#1e7d4f" stroke-width="2.2"/><circle cx="458" cy="240" r="3.5" fill="#1e7d4f"/><text x="441" y="298" font-size="11" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Bank</text><circle cx="426" cy="166" r="9" fill="none" stroke="#d98a1c" stroke-width="3.5"/><path d="M435,166 h26 m-8,0 v8 m-8,-8 v6" stroke="#d98a1c" stroke-width="3.5" fill="none" stroke-linecap="round"/><rect x="482" y="196" width="58" height="84" rx="6" fill="#fff" stroke="#1e7d4f" stroke-width="2.2"/><circle cx="528" cy="240" r="3.5" fill="#1e7d4f"/><text x="511" y="298" font-size="11" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Social</text><circle cx="496" cy="166" r="9" fill="none" stroke="#2563a8" stroke-width="3.5"/><path d="M505,166 h26 m-8,0 v8 m-8,-8 v6" stroke="#2563a8" stroke-width="3.5" fill="none" stroke-linecap="round"/><rect x="552" y="196" width="58" height="84" rx="6" fill="#fff" stroke="#1e7d4f" stroke-width="2.2"/><circle cx="598" cy="240" r="3.5" fill="#1e7d4f"/><text x="581" y="298" font-size="11" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sales app</text><circle cx="566" cy="166" r="9" fill="none" stroke="#1e7d4f" stroke-width="3.5"/><path d="M575,166 h26 m-8,0 v8 m-8,-8 v6" stroke="#1e7d4f" stroke-width="3.5" fill="none" stroke-linecap="round"/><rect x="456" y="96" width="40" height="58" rx="7" fill="#fff" stroke="#1d2a33" stroke-width="2"/><text x="476" y="122" font-size="10.5" fill="#1d2a33" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Code</text><text x="476" y="140" font-size="9" fill="#1d2a33" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">check</text><text x="476" y="330" font-size="12.5" fill="#1e7d4f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">One key lost → other three</text><text x="476" y="347" font-size="12.5" fill="#1e7d4f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">stay safe</text><text x="320" y="388" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Never give a password or one-time code to anyone.</text></svg>