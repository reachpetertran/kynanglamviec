<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Two maps of a neighbourhood, hypothetical. Left: the four students&#x27; routes cross each other, many places get leaflets twice and some areas are missed. Right: the neighbourhood is split into 4 squares, one colour per student, with no overlaps and no gaps."><title>Two maps of a neighbourhood, hypothetical. Left: the four students' routes cross each other, many places get leaflets twice and some areas are missed. Right: the neighbourhood is split into 4 squares, one colour per student, with no overlaps and no gaps.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="30" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Handing out leaflets: two ways (hypothetical)</text><rect x="26" y="70" width="270" height="250" rx="10" fill="#fff" stroke="#9fb9b6" stroke-width="1.5"/><line x1="80" y1="70" x2="80" y2="320" stroke="#e1eae8" stroke-width="6"/><line x1="26" y1="120" x2="296" y2="120" stroke="#e1eae8" stroke-width="6"/><line x1="134" y1="70" x2="134" y2="320" stroke="#e1eae8" stroke-width="6"/><line x1="26" y1="170" x2="296" y2="170" stroke="#e1eae8" stroke-width="6"/><line x1="188" y1="70" x2="188" y2="320" stroke="#e1eae8" stroke-width="6"/><line x1="26" y1="220" x2="296" y2="220" stroke="#e1eae8" stroke-width="6"/><line x1="242" y1="70" x2="242" y2="320" stroke="#e1eae8" stroke-width="6"/><line x1="26" y1="270" x2="296" y2="270" stroke="#e1eae8" stroke-width="6"/><text x="161" y="60" font-size="14" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Everyone goes alone</text><path d="M40,90 L120,90 L120,190 L230,190" fill="none" stroke="#1f7a74" stroke-width="4" stroke-opacity=".8" stroke-linecap="round"/><path d="M60,300 L60,140 L180,140 L180,90" fill="none" stroke="#d98a1c" stroke-width="4" stroke-opacity=".8" stroke-linecap="round"/><path d="M280,300 L170,300 L170,190 L90,190" fill="none" stroke="#2563a8" stroke-width="4" stroke-opacity=".8" stroke-linecap="round"/><path d="M250,90 L250,250 L120,250" fill="none" stroke="#b03a2e" stroke-width="4" stroke-opacity=".8" stroke-linecap="round"/><circle cx="120" cy="190" r="11" fill="none" stroke="#b03a2e" stroke-width="2.5"/><circle cx="170" cy="190" r="11" fill="none" stroke="#b03a2e" stroke-width="2.5"/><circle cx="180" cy="140" r="11" fill="none" stroke="#b03a2e" stroke-width="2.5"/><text x="161" y="344" font-size="13" fill="#b03a2e" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Overlaps in middle, gaps at edges</text><rect x="344" y="70" width="270" height="250" rx="10" fill="#fff" stroke="#9fb9b6" stroke-width="1.5"/><line x1="398" y1="70" x2="398" y2="320" stroke="#e1eae8" stroke-width="6"/><line x1="344" y1="120" x2="614" y2="120" stroke="#e1eae8" stroke-width="6"/><line x1="452" y1="70" x2="452" y2="320" stroke="#e1eae8" stroke-width="6"/><line x1="344" y1="170" x2="614" y2="170" stroke="#e1eae8" stroke-width="6"/><line x1="506" y1="70" x2="506" y2="320" stroke="#e1eae8" stroke-width="6"/><line x1="344" y1="220" x2="614" y2="220" stroke="#e1eae8" stroke-width="6"/><line x1="560" y1="70" x2="560" y2="320" stroke="#e1eae8" stroke-width="6"/><line x1="344" y1="270" x2="614" y2="270" stroke="#e1eae8" stroke-width="6"/><text x="479" y="60" font-size="14" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">4 squares, one each</text><rect x="348" y="74" width="127" height="117" rx="8" fill="#1f7a74" fill-opacity=".16" stroke="#1f7a74" stroke-width="2"/><text x="411" y="138" font-size="14" fill="#1f7a74" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Student 1</text><rect x="483" y="74" width="127" height="117" rx="8" fill="#d98a1c" fill-opacity=".16" stroke="#d98a1c" stroke-width="2"/><text x="546" y="138" font-size="14" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Student 2</text><rect x="348" y="199" width="127" height="117" rx="8" fill="#2563a8" fill-opacity=".16" stroke="#2563a8" stroke-width="2"/><text x="411" y="263" font-size="14" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Student 3</text><rect x="483" y="199" width="127" height="117" rx="8" fill="#b03a2e" fill-opacity=".16" stroke="#b03a2e" stroke-width="2"/><text x="546" y="263" font-size="14" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Student 4</text><text x="479" y="344" font-size="13" fill="#1e7d4f" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">No overlaps, no gaps</text><text x="320" y="382" font-size="13.5" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">The starting question: “Is there another way?”</text></svg>