<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Four steps when work does not go to plan: report at once, fix it, review with four questions, share the new way of working. The four questions: what did I plan, what actually happened, why was it different, what will I do next time."><title>Four steps when work does not go to plan: report at once, fix it, review with four questions, share the new way of working. The four questions: what did I plan, what actually happened, why was it different, what will I do next time.</title><rect width="640" height="400" rx="18" fill="#eef3fa"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">When work does not go to plan</text><rect x="30" y="54" width="136" height="52" rx="26" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><text x="98" y="86" font-size="14" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Report now</text><line x1="166" y1="80" x2="180" y2="80" stroke="#1f7a74" stroke-width="2.5"/><circle cx="180" cy="80" r="4.5" fill="#1f7a74"/><rect x="182" y="54" width="136" height="52" rx="26" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="250" y="86" font-size="14" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Fix it</text><line x1="318" y1="80" x2="332" y2="80" stroke="#1f7a74" stroke-width="2.5"/><circle cx="332" cy="80" r="4.5" fill="#1f7a74"/><rect x="334" y="54" width="136" height="52" rx="26" fill="#e8f0fa" stroke="#2563a8" stroke-width="2"/><text x="402" y="86" font-size="14" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Review</text><line x1="470" y1="80" x2="484" y2="80" stroke="#1f7a74" stroke-width="2.5"/><circle cx="484" cy="80" r="4.5" fill="#1f7a74"/><rect x="486" y="54" width="136" height="52" rx="26" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="554" y="86" font-size="14" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Share</text><rect x="90" y="132" width="460" height="246" rx="14" fill="#fff" stroke="#2563a8" stroke-width="2"/><text x="320" y="160" font-size="16" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Review: 4 questions</text><circle cx="122" cy="191" r="12" fill="#2563a8"/><text x="122" y="196" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1</text><text x="144" y="190" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">What did I plan?</text><text x="144" y="208" font-size="12" fill="#5b6b73" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Send 200 invitations by Friday (hypothetical)</text><circle cx="122" cy="237" r="12" fill="#2563a8"/><text x="122" y="242" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2</text><text x="144" y="236" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">What actually happened?</text><text x="144" y="254" font-size="12" fill="#5b6b73" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Sent 180; 20 new customers missed (hypothetical)</text><circle cx="122" cy="283" r="12" fill="#2563a8"/><text x="122" y="288" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3</text><text x="144" y="282" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Why was it different?</text><text x="144" y="300" font-size="12" fill="#5b6b73" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Used last year&#x27;s list, without new customers (hypothetical)</text><circle cx="122" cy="329" r="12" fill="#2563a8"/><text x="122" y="334" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">4</text><text x="144" y="328" font-size="13.5" fill="#1d2a33" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">What will I do next time?</text><text x="144" y="346" font-size="12" fill="#5b6b73" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ask for the latest list before sending (hypothetical)</text></svg>