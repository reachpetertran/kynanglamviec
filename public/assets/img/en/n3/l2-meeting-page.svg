ht="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">week of 2 Dec</text><rect x="230" y="50" width="230" height="210" rx="12" fill="#fff" stroke="#1f7a74" stroke-width="2"/><text x="345" y="76" font-size="14" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Actions: who · what · when</text><text x="248" y="112" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Lena</text><text x="296" y="112" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">fix print file</text><text x="444" y="112" font-size="13" fill="#b03a2e" text-anchor="end" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Wed</text><text x="248" y="156" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tom</text><text x="296" y="156" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">get 2 quotes</text><text x="444" y="156" font-size="13" fill="#b03a2e" text-anchor="end" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Thu</text><text x="248" y="200" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Me</text><text x="296" y="200" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">launch plan</text><text x="444" y="200" font-size="13" fill="#b03a2e" text-anchor="end" font-weight="700" font-family="system-ui,-a