<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="A hypothetical four-box priority matrix. The horizontal axis is whether the deadline is near or far; the vertical axis is whether the impact is high or low. High impact, near deadline: do first. High impact, far deadline: schedule. Low impact, near deadline: do quickly or ask. Low impact, far deadline: later."><title>A hypothetical four-box priority matrix. The horizontal axis is whether the deadline is near or far; the vertical axis is whether the impact is high or low. High impact, near deadline: do first. High impact, far deadline: schedule. Low impact, near deadline: do quickly or ask. Low impact, far deadline: later.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Prioritising: impact × deadline</text><rect x="110" y="56" width="240" height="140" rx="12" fill="#fbe9e7" stroke="#b03a2e" stroke-width="2"/><text x="230" y="84" font-size="16" fill="#b03a2e" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1. Do first</text><text x="230" y="108" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">High impact</text><text x="230" y="124" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Near deadline</text><text x="230" y="156" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Data report for a</text><text x="230" y="173" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">client, due 15:00</text><rect x="370" y="56" width="240" height="140" rx="12" fill="#e8f0fa" stroke="#2563a8" stroke-width="2"/><text x="490" y="84" font-size="16" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2. Schedule</text><text x="490" y="108" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">High impact</text><text x="490" y="124" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Far deadline</text><text x="490" y="156" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Learn the new software,</text><text x="490" y="173" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">book 2 time slots</text><rect x="110" y="212" width="240" height="140" rx="12" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="230" y="240" font-size="16" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3. Quick or ask</text><text x="230" y="264" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Low impact</text><text x="230" y="280" font-size="12" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Near deadline</text><text x="230" y="312" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Print meeting papers,</