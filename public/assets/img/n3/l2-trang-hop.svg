<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Trang ghi họp chia ba ô, giả định. Ô Quyết định: chọn mẫu bao bì B. Ô Việc: ai làm gì, hạn khi nào, ba dòng. Ô Câu hỏi còn mở: chờ báo giá in. Bên dưới là tin nhắn tóm tắt gửi nhóm trong 24 giờ để mọi người xác nhận."><title>Trang ghi họp chia ba ô, giả định. Ô Quyết định: chọn mẫu bao bì B. Ô Việc: ai làm gì, hạn khi nào, ba dòng. Ô Câu hỏi còn mở: chờ báo giá in. Bên dưới là tin nhắn tóm tắt gửi nhóm trong 24 giờ để mọi người xác nhận.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Trang ghi họp: 3 ô</text><rect x="30" y="50" width="180" height="210" rx="12" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="120" y="76" font-size="15" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Quyết định</text><text x="120" y="110" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Chọn mẫu</text><text x="120" y="128" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">bao bì B</text><text x="120" y="146" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif"></text><text x="120" y="164" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Ra mắt</text><text x="120" y="182" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">tuần 2/12</text><rect x="230" y="50" width="230" height="210" rx="12" fill="#fff" stroke="#1f7a74" stroke-width="2"/><text x="345" y="76" font-size="15" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Việc: ai · gì · hạn</text><text x="248" y="112" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Lan</text><text x="296" y="112" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">sửa file in</text><text x="444" y="112" font-size="13" fill="#b03a2e" text-anchor="end" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">T4</text><text x="248" y="156" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tú</text><text x="296" y="156" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">xin 2 báo giá</text><text x="444" y="156" font-size="13" fill="#b03a2e" text-anchor="end" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">T5</text><text x="248" y="200" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Mình</text><text x="296" y="200" font-size="13" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">lịch ra mắt</text><text x="444" y="200" font-size="13" fill="#b03a2e" text-anchor="end" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">T6</text><rect x="480" y="50" width="130" height="210" rx="12" fill="#fdf3e2" stroke="#d98a1c" stroke-width="2"/><text x="545" y="76" font-size="15" fill="#d98a1c" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Còn mở</text><text x="545" y="110" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Chờ báo giá</text><text x="545" y="128" font-size="13" fill="#1d2a33" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">in: ai chốt?</text><rect x="30" y="278" width="580" height="104" rx="12" fill="#fff" stroke="#2563a8" stroke-width="2"/><text x="46" y="302" font-size="14" fill="#2563a8" text-anchor="start" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tin nhắn tóm tắt (gửi trong 24 giờ)</text><text x="46" y="326" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Em tóm tắt họp sáng nay: chốt mẫu B, ra mắt tuần 2/12.</text><text x="46" y="344" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Việc: Lan sửa file (T4), Tú xin báo giá (T5), em làm lịch (T6).</text><text x="46" y="362" font-size="12.5" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Anh chị xem có sai hay thiếu gì giúp em nhé.</text></svg>