<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Bốn bước xử lý yêu cầu của khách hàng, giả định: nghe hết, xác nhận nhu cầu, đưa phương án và hạn, theo dõi đến khi xong. Bên trái là khách bên ngoài ở cửa hàng điện máy. Bên phải là khách nội bộ, đồng nghiệp phòng kế toán."><title>Bốn bước xử lý yêu cầu của khách hàng, giả định: nghe hết, xác nhận nhu cầu, đưa phương án và hạn, theo dõi đến khi xong. Bên trái là khách bên ngoài ở cửa hàng điện máy. Bên phải là khách nội bộ, đồng nghiệp phòng kế toán.</title><rect width="640" height="400" rx="18" fill="#eef6f5"/><text x="320" y="32" font-size="19" fill="#14524f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Bốn bước với mọi khách hàng</text><rect x="30" y="56" width="136" height="92" rx="12" fill="#fff" stroke="#1f7a74" stroke-width="2"/><circle cx="52" cy="80" r="13" fill="#14524f"/><text x="52" y="85" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">1</text><text x="110" y="86" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Nghe hết</text><text x="98" y="132" font-size="11.5" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Không ngắt lời</text><line x1="166" y1="102" x2="180" y2="102" stroke="#1f7a74" stroke-width="2.5"/><circle cx="180" cy="102" r="4.5" fill="#1f7a74"/><rect x="182" y="56" width="136" height="92" rx="12" fill="#fff" stroke="#1f7a74" stroke-width="2"/><circle cx="204" cy="80" r="13" fill="#14524f"/><text x="204" y="85" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">2</text><text x="262" y="86" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Xác nhận</text><text x="250" y="132" font-size="11.5" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Tóm tắt nhu cầu</text><line x1="318" y1="102" x2="332" y2="102" stroke="#1f7a74" stroke-width="2.5"/><circle cx="332" cy="102" r="4.5" fill="#1f7a74"/><rect x="334" y="56" width="136" height="92" rx="12" fill="#fff" stroke="#1f7a74" stroke-width="2"/><circle cx="356" cy="80" r="13" fill="#14524f"/><text x="356" y="85" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">3</text><text x="414" y="86" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Phương án</text><text x="414" y="104" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">+ hạn</text><text x="402" y="132" font-size="11.5" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Trong quyền của mình</text><line x1="470" y1="102" x2="484" y2="102" stroke="#1f7a74" stroke-width="2.5"/><circle cx="484" cy="102" r="4.5" fill="#1f7a74"/><rect x="486" y="56" width="136" height="92" rx="12" fill="#fff" stroke="#1f7a74" stroke-width="2"/><circle cx="508" cy="80" r="13" fill="#14524f"/><text x="508" y="85" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">4</text><text x="566" y="86" font-size="14" fill="#1d2a33" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Theo dõi</text><text x="554" y="132" font-size="11.5" fill="#5b6b73" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Báo khi xong</text><rect x="30" y="170" width="284" height="206" rx="12" fill="#e8f0fa" stroke="#2563a8" stroke-width="2"/><text x="172" y="196" font-size="15" fill="#2563a8" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Khách bên ngoài</text><text x="46" y="224" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Khách: &quot;Máy giặt mới giao</text><text x="46" y="246" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">kêu to, tôi muốn đổi.&quot;</text><text x="46" y="268" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Mình: &quot;Dạ, máy kêu từ lần giặt đầu,</text><text x="46" y="290" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">anh muốn đổi máy, đúng không ạ?&quot;</text><text x="46" y="312" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Hẹn kỹ thuật kiểm tra 10:00 mai,</text><text x="46" y="334" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">chiều mai em gọi báo kết quả.</text><rect x="326" y="170" width="284" height="206" rx="12" fill="#e6f4ec" stroke="#1e7d4f" stroke-width="2"/><text x="468" y="196" font-size="15" fill="#1e7d4f" text-anchor="middle" font-weight="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Khách nội bộ</text><text x="342" y="224" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Kế toán: &quot;Gửi chị bảng doanh số.&quot;</text><text x="342" y="246" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">Mình: &quot;Chị cần tháng nào, theo</text><text x="342" y="268" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">cửa hàng hay theo nhân viên ạ?&quot;</text><text x="342" y="290" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">&quot;Tháng 10, theo cửa hàng.&quot;</text><text x="342" y="312" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">&quot;Dạ, em gửi file Excel</text><text x="342" y="334" font-size="12" fill="#1d2a33" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif">trước 16:00 hôm nay ạ.&quot;</text></svg>